[tools]
node = "26.13.0"
npm = "12.2.2"
k3d = "5.9.0"
kubectl = "1.37.2"
helm = "4.3.1"
yq = "4.54.2"
sops = "3.13.3"
age = "1.3.2"
mkcert = "1.4.4"
opentofu = "1.13.9"
opa = "1.22.2"
gator = "3.23.1"
cosign = "3.1.4"
crane = "0.22.1"
promtool = "3.16.0"
trufflehog = "3.99.7"
osv-scanner = "2.7.0"
semgrep = "1.182.1"
actionlint = "1.7.12"
zizmor = "1.31.1"
hadolint = "2.15.1"

[tasks.build]
description = "Build the kore executable"
run = "npm --prefix tools/kore run build"

[tasks.test]
description = "Run tests that do not require a cluster"
run = "npm --prefix tools/kore test && npm --prefix apps/reference test && npm --prefix tools/harness test"

[tasks.test-integration]
description = "Run the integration tier of tools/kore and tools/harness: real units together, no cluster. Not part of the default test run or the commit hook"
run = ["npm --prefix tools/kore run test:integration", "npm --prefix tools/harness run test:integration"]

[tasks.harness-build]
description = "Bundle the harness CLI into skills/bin/harness.mjs (a build output, never committed; needs `npm ci --prefix tools/harness`; CI and hooks need it built)"
run = "npm --prefix tools/harness run build"

[tasks.harness-test]
description = "Run the harness unit tests with the coverage threshold"
run = "npm --prefix tools/harness test"

[tasks.harness-lint]
description = "Typecheck and lint the harness with warnings denied"
run = ["npm --prefix tools/harness run check", "npm --prefix tools/harness run lint"]

[tasks.harness-check]
description = "CI gate: typecheck and lint the harness (CI builds the bundle in its own step before the tests)"
depends = ["harness-lint"]

[tasks.harness-format]
description = "Check harness formatting; pass nothing to check, or run `mise run format <files>` to fix"
run = "npm --prefix tools/harness run format:check"

[tasks.format]
description = "Format files with the pinned prettier: mise run format <files>"
run = "tools/kore/node_modules/.bin/prettier --write"

[tasks.test-hooks]
description = "Check skill links and workflow permissions with the harness hooks, and that the settings deny list is the one the inventory generates; then kb-check in warn mode. The hook, status line and eval tests are integration tests (#373), run by test-integration and the integration merge check. Runs the kore barrel-rule test first, so CI check covers it until integration tests have their own step (#418)"
depends = ["test-barrel-rule"]
run = [".claude/hooks/harness.sh hook skill-links --strict", ".claude/hooks/harness.sh hook workflow-permissions --strict", ".claude/hooks/harness.sh guardrail deny --check", ".claude/hooks/harness.sh hook kb-check"]

[tasks.test-barrel-rule]
description = "Run the kore barrel-rule test: oxlint over scratch fixtures, the domain list against src/, and the testing ban (an integration test, so it is outside the unit run and the commit hook)"
run = "npm --prefix tools/kore run test:barrel-rule"

[tasks.kb-check]
description = "Check knowledge-base links, index, frontmatter, and Docs: markers, then print the skill budget audit (never fails); pass -- --strict to fail on findings"
run = ".claude/hooks/harness.sh hook kb-check"

[tasks.eval-harness]
description = "Opt-in: check skill triggering and principles-review with live claude runs (costs tokens)"
run = "node .claude/evals/eval.mjs"

[tasks.validate]
description = "Validate catalogs, environments, and release ordering for every environment"
run = [
  "npm --prefix tools/kore run kore -- validate --environment local",
  "npm --prefix tools/kore run kore -- validate --environment managed-example",
]

[tasks.validate-tofu]
description = "Run tofu validate in every infra/tofu/stacks directory that holds .tf files (passes when there are none)"
run = "infra/tofu/validate-stacks.sh"

[tasks.test-opa]
description = "Run colocated Rego policy specifications with the OPA CLI"
run = "opa test infra/policies/opa/bundles/v1 -v"

[tasks.test-gatekeeper]
description = "Run Gatekeeper constraint template suites with the pinned gator CLI"
run = "gator verify infra/policies/gatekeeper/tests/ -v"

[tasks.install]
description = "Install kore into the repository-local bin directory"
depends = ["build"]

[tasks.test-promtool]
description = "Check and unit test Prometheus rule files with promtool"
run = ["promtool check rules infra/observability/config/files/rules/platform.yaml", "promtool test rules infra/observability/config/tests/platform.test.yaml"]

[tasks.scan-secrets]
description = "Scan git history and tracked files for secrets with TruffleHog (verification needs network); .kore/ and SOPS ciphertext are excluded"
run = [
  "trufflehog git file://. --results=verified,unknown,unverified --exclude-paths=.trufflehog-exclude --no-update --fail --no-color",
  "git ls-files -z | xargs -0 trufflehog filesystem --results=verified,unknown,unverified --exclude-paths=.trufflehog-exclude --no-update --fail --no-color",
]

[tasks.scan-vulns]
description = "Scan npm lockfiles for known vulnerabilities with OSV-Scanner (queries the OSV API); add each new lockfile here"
run = "osv-scanner scan source -L tools/kore/package-lock.json -L tools/harness/package-lock.json"

[tasks.scan-sast]
description = "Run the committed Semgrep rules (infra/policies/semgrep) over source; offline, no telemetry; tests are not scanned"
run = "semgrep scan --metrics=off --disable-version-check --config infra/policies/semgrep/kore-node.yaml --error --exclude '*.spec.ts' --exclude '*.test.ts' --exclude '*.test.mjs' --exclude node_modules tools/kore/src tools/harness/src apps .claude"

[tasks.scan-sast-audit]
description = "Report the audit-mode Semgrep rules (kore-audit.yaml) over the harness; never fails the build"
run = "semgrep scan --metrics=off --disable-version-check --config infra/policies/semgrep/kore-audit.yaml --exclude '*.spec.ts' --exclude '*.test.ts' --exclude node_modules tools/harness/src"

[tasks.scan-sast-test]
description = "Run the Semgrep rule tests beside the rules"
run = "semgrep --test --metrics=off --disable-version-check infra/policies/semgrep"

[tasks.scan-workflows]
description = "Lint GitHub workflows with actionlint and audit them for security issues with zizmor (offline)"
run = ["actionlint .github/workflows/check.yml .github/workflows/nightly.yml .github/workflows/release.yaml","zizmor --offline --no-progress .github/workflows"]

[tasks.scan-dockerfiles]
description = "Lint Dockerfiles with hadolint"
run = "hadolint apps/reference/Dockerfile"

[tasks.scan]
description = "Run every security and quality scan"
depends = ["scan-secrets", "scan-vulns", "scan-sast-test", "scan-sast", "scan-sast-audit", "scan-workflows", "scan-dockerfiles"]
