[tools]
node = "26.8.2"
npm = "12.0.2"
minikube = "1.39.0"
kubectl = "1.37.0"
helm = "4.3.0"
yq = "4.53.6"
sops = "3.13.3"
age = "1.3.2"
mkcert = "1.4.4"
opentofu = "1.12.6"
opa = "1.20.2"
cosign = "3.1.3"

[tasks.build]
description = "Build the kore executable"
run = "npm --prefix tools/kore run build"

[tasks.test]
description = "Run tests that do not require a cluster"
run = "npm --prefix tools/kore test"

[tasks.format]
description = "Format files with the pinned prettier: mise run format <files>"
run = "tools/kore/node_modules/.bin/prettier --write"

[tasks.test-hooks]
description = "Run tests for the agent harness: hooks, status line, skill links, and eval grading; then kb-check in warn mode"
run = ["node --test .claude/hooks .claude/evals", "node .claude/hooks/kb-check.mjs"]

[tasks.kb-check]
description = "Check knowledge-base links, index, frontmatter, and Docs: markers; pass -- --strict to fail on findings"
run = "node .claude/hooks/kb-check.mjs"

[tasks.eval-harness]
description = "Opt-in: check skill triggering and principles-review with live claude runs (costs tokens)"
run = "node .claude/evals/eval.mjs"

[tasks.validate]
description = "Validate catalogs, environments, and release ordering"
run = "npm --prefix tools/kore run kore -- validate --environment local"

[tasks.test-opa]
description = "Run colocated Rego policy specifications with the OPA CLI"
run = "opa test infra/policies/opa/bundles/v1 -v"

[tasks.install]
description = "Install kore into the repository-local bin directory"
depends = ["build"]
