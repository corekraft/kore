{
  "mode": "deployment",
  "fullnameOverride": "otel-collector",
  "image": {
    "repository": "otel/opentelemetry-collector-contrib",
    "tag": "0.163.2",
    "digest": "sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849"
  },
  "resources": {
    "requests": {
      "cpu": "100m",
      "memory": "256Mi"
    },
    "limits": {
      "cpu": "500m",
      "memory": "768Mi"
    }
  },
  "ports": {
    "otlp": {
      "enabled": true,
      "containerPort": 4317,
      "servicePort": 4317,
      "protocol": "TCP"
    },
    "otlp-http": {
      "enabled": true,
      "containerPort": 4318,
      "servicePort": 4318,
      "protocol": "TCP"
    },
    "prometheus": {
      "enabled": true,
      "containerPort": 8889,
      "servicePort": 8889,
      "protocol": "TCP"
    },
    "metrics": {
      "enabled": true,
      "containerPort": 8888,
      "servicePort": 8888,
      "protocol": "TCP"
    }
  },
  "clusterRole": {
    "create": true,
    "rules": [
      {
        "apiGroups": [
          ""
        ],
        "resources": [
          "pods",
          "namespaces",
          "nodes",
          "services",
          "resourcequotas",
          "replicationcontrollers",
          "limitranges"
        ],
        "verbs": [
          "get",
          "list",
          "watch"
        ]
      },
      {
        "apiGroups": [
          "apps"
        ],
        "resources": [
          "replicasets",
          "deployments",
          "daemonsets",
          "statefulsets"
        ],
        "verbs": [
          "get",
          "list",
          "watch"
        ]
      },
      {
        "apiGroups": [
          "batch"
        ],
        "resources": [
          "jobs",
          "cronjobs"
        ],
        "verbs": [
          "get",
          "list",
          "watch"
        ]
      },
      {
        "apiGroups": [
          "autoscaling"
        ],
        "resources": [
          "horizontalpodautoscalers"
        ],
        "verbs": [
          "get",
          "list",
          "watch"
        ]
      }
    ]
  },
  "config": {
    "receivers": {
      "otlp": {
        "protocols": {
          "grpc": {},
          "http": {}
        }
      },
      "k8s_cluster": {
        "auth_type": "serviceAccount",
        "collection_interval": "30s",
        "node_conditions_to_report": [
          "Ready",
          "MemoryPressure",
          "DiskPressure"
        ],
        "allocatable_types_to_report": []
      }
    },
    "processors": {
      "memory_limiter": {
        "check_interval": "1s",
        "limit_mib": 600
      },
      "deltatocumulative": {},
      "batch": {
        "send_batch_size": 512,
        "timeout": "5s"
      },
      "k8s_attributes": {
        "auth_type": "serviceAccount",
        "pod_association": [
          {
            "sources": [
              {
                "from": "resource_attribute",
                "name": "k8s.pod.uid"
              }
            ]
          },
          {
            "sources": [
              {
                "from": "connection"
              }
            ]
          }
        ],
        "extract": {
          "metadata": [
            "k8s.namespace.name",
            "k8s.deployment.name",
            "k8s.pod.name",
            "k8s.node.name"
          ],
          "labels": [
            {
              "tag_name": "app.kubernetes.io/name",
              "key": "app.kubernetes.io/name",
              "from": "pod"
            },
            {
              "tag_name": "app.kubernetes.io/part-of",
              "key": "app.kubernetes.io/part-of",
              "from": "pod"
            },
            {
              "tag_name": "service_account",
              "key": "platform.kore.dev/service-account",
              "from": "pod"
            }
          ]
        }
      },
      "resource/environment": {
        "attributes": []
      },
      "attributes/cardinality": {
        "actions": [
          {
            "key": "k8s.pod.uid",
            "action": "delete"
          },
          {
            "key": "process.command_line",
            "action": "delete"
          }
        ]
      },
      "transform/metric-cardinality": {
        "error_mode": "ignore",
        "metric_statements": [
          {
            "context": "resource",
            "statements": [
              "keep_matching_keys(attributes, \"^(service[.]name|service[.]namespace|service[.]version|k8s[.]cluster[.]name|deployment[.]environment[.]name|k8s[.]namespace[.]name|k8s[.]deployment[.]name|k8s[.]daemonset[.]name|k8s[.]statefulset[.]name|k8s[.]node[.]name|app[.]kubernetes[.]io/name|app[.]kubernetes[.]io/part-of|service_account)$\")"
            ]
          },
          {
            "context": "datapoint",
            "statements": [
              "keep_matching_keys(attributes, \"^(http[.]request[.]method|http[.]response[.]status_code|http[.]route|http[.]method|http[.]status_code|rpc[.]system|rpc[.]service|rpc[.]method|error[.]type|state|direction|cpu|device|interface)$\")"
            ]
          }
        ]
      },
      "filter/cluster-no-pod": {
        "error_mode": "ignore",
        "metrics": {
          "metric": [
            "IsMatch(name, \"^k8s[.](pod|container)[.].*\")"
          ]
        }
      }
    },
    "exporters": {
      "prometheus": {
        "endpoint": "0.0.0.0:8889",
        "resource_to_telemetry_conversion": {
          "enabled": true
        }
      },
      "otlp_http/loki": {
        "endpoint": "http://loki:3100/otlp"
      },
      "otlp_grpc/tempo": {
        "endpoint": "tempo:4317",
        "tls": {
          "insecure": true
        }
      }
    },
    "service": {
      "telemetry": {
        "metrics": {
          "level": "detailed"
        }
      },
      "pipelines": {
        "metrics": {
          "receivers": [
            "otlp"
          ],
          "processors": [
            "memory_limiter",
            "k8s_attributes",
            "resource/environment",
            "attributes/cardinality",
            "deltatocumulative",
            "transform/metric-cardinality",
            "batch"
          ],
          "exporters": [
            "prometheus"
          ]
        },
        "metrics/cluster": {
          "receivers": [
            "k8s_cluster"
          ],
          "processors": [
            "memory_limiter",
            "filter/cluster-no-pod",
            "resource/environment",
            "transform/metric-cardinality",
            "batch"
          ],
          "exporters": [
            "prometheus"
          ]
        },
        "logs": {
          "receivers": [
            "otlp"
          ],
          "processors": [
            "memory_limiter",
            "k8s_attributes",
            "resource/environment",
            "attributes/cardinality",
            "batch"
          ],
          "exporters": [
            "otlp_http/loki"
          ]
        },
        "traces": {
          "receivers": [
            "otlp"
          ],
          "processors": [
            "memory_limiter",
            "k8s_attributes",
            "resource/environment",
            "attributes/cardinality",
            "batch"
          ],
          "exporters": [
            "otlp_grpc/tempo"
          ]
        }
      }
    }
  }
}
