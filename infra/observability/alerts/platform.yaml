apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: kore-platform, namespace: observability}
spec:
  groups:
    - name: kore.platform
      rules:
        - alert: KoreCollectorDroppedData
          expr: rate(otelcol_processor_dropped_spans[5m]) > 0
          for: 10m
          labels: {severity: warning}
          annotations: {summary: OpenTelemetry Collector is dropping spans}
        - alert: KoreCollectorExporterFailure
          expr: rate(otelcol_exporter_send_failed_spans[5m]) > 0
          for: 5m
          labels: {severity: critical}
          annotations: {summary: OpenTelemetry Collector exporter is failing}

