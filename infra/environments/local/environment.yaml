{
  "$schema": "../schema.json",
  "name": "local",
  "provider": "k3d",
  "kubeContext": "k3d-kore-local",
  "k3d":
    {
      "clusterName": "kore-local",
      "serviceCidr": "10.96.0.0/12",
      "ports":
        [
          {
            "hostAddress": "127.0.0.1",
            "hostPort": 443,
            "loadBalancerPort": 30443,
            "featureFlag": "platform-dns"
          },
          {
            "hostAddress": "127.0.0.1",
            "hostPort": 1053,
            "loadBalancerPort": 31053,
            "protocol": "tcp",
            "featureFlag": "platform-dns"
          },
          {
            "hostAddress": "127.0.0.1",
            "hostPort": 1053,
            "loadBalancerPort": 31053,
            "protocol": "udp",
            "featureFlag": "platform-dns"
          },
          {
            "hostAddress": "127.0.0.1",
            "hostPort": 5432,
            "loadBalancerPort": 30432,
            "featureFlag": "database-routes"
          }
        ]
    },
  "registry": { "address": "10.96.0.50:5000" },
  "features":
    {
      "agentgateway-mesh-enrollment": true,
      "autoscaling-defaults": true,
      "gateway-class-change-release": true,
      "gateway-rollback-order": true,
      "ingress-agentgateway": true,
      "agentgateway-data-plane-metrics": false,
      "role-tokens": true,
      "owner-writer": true,
      "local-image-reuse": true,
      "registry-tag-pruning": false,
      "registry-revert-keep": false,
      "platform-organization-service-apis": true,
      "platform-argocd-delivery": true,
      "suborg-tenancy": false,
      "suborg-network-policy": false,
      "platform-sync-window": false,
      "release-recovery-argocd-refusal": false,
      "database-routes": true,
      "platform-dns": true,
      "drift-listing-mappings": true,
      "platform-shared-gateway": true,
      "service-listener-sets": false,
      "external-gateway": false,
      "external-gateway-limits": false,
      "external-dns": false,
      "openbao": false,
      "database-backups": false,
      "openbao-snapshots": false,
      "registry-by-name": true,
      "otlp-route": true,
      "platform-hostname-ownership": false,
      "platform-portal": true,
      "portal-staged-install": true,
      "automatic-retro": true,
      "automatic-approval": false,
      "automatic-revert": true,
      "orchestrator-tick": false,
      "behind-main-notice": false,
      "tick-live-proofs": true,
      "tick-ticket-queue": false,
      "tick-self-update": true,
      "shell-aware-zsh-rules": true,
      "gated-help-exempt": true,
      "main-session-figures": true,
      "pane-result-summary": true,
      "signed-main-sends": true,
      "main-session-wait": true,
      "golden-path-signin": true,
      "golden-path-template-admission": false,
      "golden-path-signin-after-portal": true,
      "postgresql-service-class-instances": false,
      "gateway-proxy-defaults": false,
      "data-path-guaranteed-qos": false,
      "data-path-priority-class": false,
      "platform-keycloak-wait": false,
      "platform-keycloak-realm-wait": false,
      "platform-apiserver-ready": false,
      "golden-path-safety-defaults": false,
      "golden-path-service-identity": false,
      "app-delivery": false,
      "app-sizing": false,
      "workload-defaults-admission": false,
      "pvc-ownership-admission": false,
      "decision-advisor": true
    },
  "imageInventory": "audit",
  "exemptionCheck": "audit",
  "providerOwnedCRDGroups":
    {
      "k3s.cattle.io": "k3s ships its addon and etcd-snapshot CRDs; the provider owns them (ADR 0088).",
      "helm.cattle.io": "k3s's bundled Helm controller ships these CRDs; the provider owns them (ADR 0088)."
    },
  "enrollmentExemptions":
    {
      "cosign-system": "Enrolling the verifier's own namespace deadlocks its webhook (ADR 0056).",
      "kore-dns": "The platform DNS answers before anything else, so enrolling its namespace would make name resolution wait on the image verifier (ADR 0132).",
      "kore-registry": "The registry serves the signatures the verifier needs, so enrolling it would make a registry restart depend on the registry (ADR 0056)."
    },
  "platform": { "domain": "kore.internal", "organizationId": "platform" },
  "gateway":
    { "namespace": "kore-system", "name": "kore-gateway", "port": 8443 },
  "gateways":
    {
      "internal":
        {
          "namespace": "kore-system",
          "name": "kore-gateway",
          "port": 8443,
          "issuer": "kore-local-ca"
        }
    },
  "secrets":
    {
      "storeName": "platform-secrets",
      "sourceNamespace": "kore-secret-source"
    },
  "telemetry":
    { "otlpEndpoint": "http://otel-collector.observability.svc:4318" },
  "componentValues":
    {
      "istio-cni": ["infra/environments/local/values/istio-cni.yaml"],
      "prometheus": ["infra/environments/local/values/prometheus.yaml"],
      "loki": ["infra/environments/local/values/loki.yaml"],
      "tempo": ["infra/environments/local/values/tempo.yaml"],
      "grafana": ["infra/environments/local/values/grafana.yaml"],
      "otel-collector": ["infra/environments/local/values/otel-collector.yaml"],
      "otel-agent": ["infra/environments/local/values/otel-agent.yaml"],
      "kore-storage": ["infra/environments/local/values/platform-storage.yaml"],
      "kore-platform-config":
        ["infra/environments/local/values/platform-config.yaml"],
      "kore-platform-dns":
        ["infra/environments/local/values/platform-dns.yaml"],
      "kore-local-tls":
        ["infra/environments/local/values/platform-config.yaml"],
      "kore-image-policy":
        ["infra/environments/local/values/image-policy.yaml"],
      "policy-controller":
        ["infra/environments/local/values/policy-controller.yaml"],
      "external-dns": ["infra/environments/local/values/external-dns.yaml"]
    }
}
