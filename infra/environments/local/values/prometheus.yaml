{
  "alertmanager": { "enabled": false },
  "prometheus-node-exporter": { "enabled": false },
  "prometheus-pushgateway": { "enabled": false },
  "extraScrapeConfigs": "- {\"job_name\": \"otel-collector-exporter\", \"scrape_interval\": \"30s\", \"static_configs\": [{\"targets\": [\"otel-collector.observability.svc:8889\"]}]}\n- {\"job_name\": \"otel-collector-self\", \"scrape_interval\": \"30s\", \"static_configs\": [{\"targets\": [\"otel-collector.observability.svc:8888\"]}]}\n- {\"job_name\": \"agentgateway-data-plane\", \"scrape_interval\": \"30s\", \"kubernetes_sd_configs\": [{\"role\": \"pod\", \"namespaces\": {\"names\": [\"kore-system\"]}}], \"relabel_configs\": [{\"source_labels\": [\"__meta_kubernetes_pod_label_gateway_networking_k8s_io_gateway_name\"], \"regex\": \"kore-gateway\", \"action\": \"keep\"}, {\"source_labels\": [\"__meta_kubernetes_pod_container_port_number\"], \"regex\": \"15020\", \"action\": \"keep\"}, {\"source_labels\": [\"__meta_kubernetes_namespace\"], \"target_label\": \"namespace\"}, {\"source_labels\": [\"__meta_kubernetes_pod_name\"], \"target_label\": \"pod\"}]}",
  "serverFiles":
    {
      "prometheus.yml":
        {
          "rule_files":
            [
              "/etc/config/recording_rules.yml",
              "/etc/config/alerting_rules.yml",
              "/etc/kore/rules/platform.yaml"
            ]
        }
    },
  "server":
    {
      "retention": "3d",
      "extraConfigmapMounts":
        [
          {
            "name": "kore-prometheus-rules",
            "mountPath": "/etc/kore/rules",
            "configMap": "kore-prometheus-rules",
            "readOnly": true
          }
        ],
      "persistentVolume":
        {
          "enabled": true,
          "size": "5Gi",
          "storageClass": "kore-standard",
          "labels": { "platform.kore.dev/retention": "Delete" }
        },
      "resources":
        {
          "requests": { "cpu": "100m", "memory": "256Mi" },
          "limits": { "cpu": "500m", "memory": "1Gi" }
        }
    }
}
