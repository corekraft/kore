{
  "alertmanager": { "enabled": false },
  "prometheus-node-exporter": { "enabled": false },
  "prometheus-pushgateway": { "enabled": false },
  "extraScrapeConfigs": "- {\"job_name\": \"otel-collector-exporter\", \"scrape_interval\": \"30s\", \"static_configs\": [{\"targets\": [\"otel-collector.observability.svc:8889\"]}]}\n- {\"job_name\": \"otel-collector-self\", \"scrape_interval\": \"30s\", \"static_configs\": [{\"targets\": [\"otel-collector.observability.svc:8888\"]}]}",
  "serverFiles":
    {
      "prometheus.yml":
        {
          "rule_files":
            [
              "/etc/config/recording_rules.yml",
              "/etc/config/alerting_rules.yml",
              "/etc/kore/rules/platform.yaml"
            ]
        }
    },
  "server":
    {
      "retention": "3d",
      "extraConfigmapMounts":
        [
          {
            "name": "kore-prometheus-rules",
            "mountPath": "/etc/kore/rules",
            "configMap": "kore-prometheus-rules",
            "readOnly": true
          }
        ],
      "persistentVolume":
        {
          "enabled": true,
          "size": "5Gi",
          "storageClass": "kore-standard",
          "labels": { "platform.kore.dev/retention": "Delete" }
        },
      "resources":
        {
          "requests": { "cpu": "100m", "memory": "256Mi" },
          "limits": { "cpu": "500m", "memory": "1Gi" }
        }
    }
}
