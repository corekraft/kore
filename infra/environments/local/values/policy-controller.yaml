{
  # One webhook replica on one node: a minAvailable 1 budget can never be
  # satisfied during a drain. Admission stays fail-closed while it restarts.
  "webhook":
    {
      "podDisruptionBudget": { "enabled": false },
      # The verifier reads signatures from the in-cluster registry over TLS and
      # trusts only this CA (ConfigMap kept by kore, ADR 0058). The chart mounts
      # it and points SSL_CERT_DIR at it, next to the system roots.
      "registryCaBundle": { "name": "kore-registry-ca", "key": "ca.crt" }
    }
}
