persistence:
  {
    enabled: true,
    size: 2Gi,
    storageClassName: kore-standard,
    extraPvcLabels: { platform.kore.dev/retention: Delete }
  }
# Minikube's hostpath provisioner creates writable directories; recursive chown
# of existing hostpath data is denied by the container runtime.
initChownData:
  enabled: false
grafana.ini:
  auth.anonymous:
    enabled: true
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 300m, memory: 512Mi }
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - {
          name: Prometheus,
          type: prometheus,
          uid: prometheus,
          url: "http://prometheus-server",
          access: proxy,
          isDefault: true
        }
      - {
          name: Loki,
          type: loki,
          uid: loki,
          url: "http://loki:3100",
          access: proxy,
          jsonData:
            {
              derivedFields:
                [
                  {
                    name: trace_id,
                    datasourceUid: tempo,
                    matcherType: label,
                    matcherRegex: trace_id,
                    url: "${__value.raw}"
                  }
                ]
            }
        }
      - {
          name: Tempo,
          type: tempo,
          uid: tempo,
          url: "http://tempo:3200",
          access: proxy,
          jsonData:
            {
              tracesToLogsV2:
                {
                  datasourceUid: loki,
                  filterByTraceID: true,
                  spanStartTimeShift: "-5m",
                  spanEndTimeShift: "5m"
                }
            }
        }
# The reference dashboard is owned by the kore-observability-config chart and
# mounted from its ConfigMap; no dashboard JSON is duplicated here.
dashboardProviders:
  providers.yaml:
    apiVersion: 1
    providers:
      - name: kore
        orgId: 1
        folder: Kore
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards/kore
dashboardsConfigMaps:
  kore: kore-grafana-dashboards
