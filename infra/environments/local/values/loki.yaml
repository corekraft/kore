deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: {replication_factor: 1}
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: index_, period: 24h}
  limits_config: {retention_period: 72h, max_query_series: 5000}
singleBinary:
  replicas: 1
  persistence: {enabled: true, size: 5Gi, storageClass: kore-standard}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 1Gi}
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}

