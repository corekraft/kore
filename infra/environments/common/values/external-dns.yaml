{
  "sources": ["gateway-httproute"],
  "policy": "upsert-only",
  "registry": "txt",
  "txtOwnerId": "kore-vps",
  "managedRecordTypes": ["A"],
  "interval": "5m",
  "extraArgs":
    {
      "gateway-label-filter": "platform.kore.dev/gateway=external",
      "min-ttl": "300"
    },
  "podAnnotations":
    { "prometheus.io/scrape": "true", "prometheus.io/port": "7979" }
}
