{
  "$schema": "../schema.json",
  "name": "managed-example",
  "provider": "managed",
  "kubeContext": "REQUIRED",
  "cluster": {"profile":"external","kubernetesVersion":"1.37.0","driver":"external","containerRuntime":"containerd","cpus":4,"memoryMB":8192,"diskSize":"40g"},
  "gateway": {"namespace":"kore-system","name":"kore-gateway","hostname":"REQUIRED"},
  "secrets": {"storeName":"platform-secrets","sourceNamespace":"external"},
  "telemetry": {"otlpEndpoint":"http://otel-collector-opentelemetry-collector.observability.svc:4318"},
  "componentValues": {"kore-platform-config":["infra/environments/managed-example/values/platform-config.yaml"]}
}
