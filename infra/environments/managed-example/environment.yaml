{
  "$schema": "../schema.json",
  "name": "managed-example",
  "provider": "managed",
  "kubeContext": "REQUIRED",
  "cluster": {"profile":"external","kubernetesVersion":"1.37.2","driver":"external","containerRuntime":"containerd","cpus":4,"memoryMB":8192,"diskSize":"40g"},
  "gateway": {"namespace":"kore-system","name":"kore-gateway","hostname":"REQUIRED","port":443},
  "secrets": {"storeName":"platform-secrets","sourceNamespace":"external"},
  "telemetry": {"otlpEndpoint":"http://otel-collector.observability.svc:4318"},
  "componentValues": {
    "otel-collector":["infra/environments/managed-example/values/otel-collector.yaml"],
    "kore-platform-config":["infra/environments/managed-example/values/platform-config.yaml"],
    "kore-local-tls":["infra/environments/managed-example/values/platform-config.yaml"],
    "kore-image-policy":["infra/environments/managed-example/values/image-policy.yaml"]
  }
}
