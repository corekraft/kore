{
  "tempo":
    {
      "retention": "168h",
      "resources":
        {
          "requests": { "cpu": "100m", "memory": "256Mi" },
          "limits": { "cpu": "500m", "memory": "1Gi" }
        },
      "extraVolumeMounts": [{ "name": "storage", "mountPath": "/var/tempo" }]
    },
  "persistence": { "enabled": false },
  "extraVolumes":
    [
      {
        "name": "storage",
        "persistentVolumeClaim": { "claimName": "tempo-storage" }
      }
    ]
}
