{
  "$schema": "../schema.json",
  "name": "vps",
  "provider": "managed",
  "kubeContext": "kore-vps",
  "cluster":
    {
      "profile": "external",
      "kubernetesVersion": "1.37.2",
      "driver": "external",
      "containerRuntime": "containerd",
      "serviceCidr": "10.43.0.0/16",
      "cpus": 4,
      "memoryMB": 20480,
      "diskSize": "300g"
    },
  "registry": { "address": "10.43.0.50:5000" },
  "platformMirror": "ghcr.io/corekraft/kore/mirror",
  "imageInventory": "enforce",
  "enrollmentExemptions":
    {
      "cosign-system": "Enrolling the verifier's own namespace deadlocks its webhook (ADR 0056).",
      "kore-registry": "The registry serves the signatures the verifier needs, so enrolling it would make a registry restart depend on the registry (ADR 0056)."
    },
  "platform": { "domain": "kore.internal", "organizationId": "platform" },
  "gateway":
    { "namespace": "kore-system", "name": "kore-gateway", "port": 443 },
  "features":
    {
      "agentgateway-mesh-enrollment": false,
      "autoscaling-defaults": false,
      "gateway-class-change-release": false,
      "gateway-rollback-order": false,
      "ingress-agentgateway": false,
      "local-image-reuse": false,
      "registry-tag-pruning": false,
      "platform-organization-service-apis": false,
      "platform-argocd-delivery": false,
      "database-routes": false,
      "platform-dns": false,
      "platform-shared-gateway": false,
      "registry-by-name": false,
      "registry-tailnet-forward": false,
      "otlp-route": false,
      "in-cluster-ca": false,
      "k3s-registry-trust": false,
      "platform-hostname-ownership": false,
      "platform-portal": false,
      "portal-staged-install": false,
      "automatic-retro": false,
      "automatic-approval": false,
      "automatic-revert": false,
      "orchestrator-tick": false,
      "behind-main-notice": false,
      "tick-live-proofs": false,
      "tick-ticket-queue": false,
      "shell-aware-zsh-rules": false,
      "gated-help-exempt": false,
      "main-session-figures": false,
      "pane-result-summary": false,
      "signed-main-sends": false,
      "main-session-wait": false,
      "golden-path-signin": false,
      "decision-advisor": false,
      "hc-sessions": false
    },
  "secrets": { "storeName": "platform-secrets", "sourceNamespace": "external" },
  "telemetry":
    { "otlpEndpoint": "http://otel-collector.observability.svc:4318" },
  "componentSources":
    {
      "kore-crossplane-functions": "infra/environments/vps/manifests/crossplane-functions"
    },
  "componentValues":
    {
      "kore-platform-backstage":
        ["infra/environments/vps/values/mirror/platform-backstage.yaml"],
      "otel-collector":
        [
          "infra/environments/vps/values/otel-collector.yaml",
          "infra/environments/vps/values/mirror/otel-collector.yaml"
        ],
      "kore-storage": ["infra/environments/vps/values/platform-storage.yaml"],
      "kore-platform-config":
        ["infra/environments/vps/values/platform-config.yaml"],
      "kore-local-tls": ["infra/environments/vps/values/platform-config.yaml"],
      "kore-image-policy": ["infra/environments/vps/values/image-policy.yaml"],
      "cert-manager":
        ["infra/environments/vps/values/mirror/cert-manager.yaml"],
      "cloudnative-pg":
        ["infra/environments/vps/values/mirror/cloudnative-pg.yaml"],
      "crossplane": ["infra/environments/vps/values/mirror/crossplane.yaml"],
      "external-secrets":
        ["infra/environments/vps/values/mirror/external-secrets.yaml"],
      "gatekeeper": ["infra/environments/vps/values/mirror/gatekeeper.yaml"],
      "grafana": ["infra/environments/vps/values/mirror/grafana.yaml"],
      "agentgateway":
        ["infra/environments/vps/values/mirror/agentgateway.yaml"],
      "argocd": ["infra/environments/vps/values/mirror/argocd.yaml"],
      "keycloak-operator":
        ["infra/environments/vps/values/mirror/keycloak-operator.yaml"],
      "keycloak-provider":
        ["infra/environments/vps/values/mirror/keycloak-provider.yaml"],
      "metrics-server":
        ["infra/environments/vps/values/mirror/metrics-server.yaml"],
      "istiod": ["infra/environments/vps/values/mirror/istiod.yaml"],
      "istio-cni": ["infra/environments/vps/values/mirror/istio-cni.yaml"],
      "ztunnel": ["infra/environments/vps/values/mirror/ztunnel.yaml"],
      "loki": ["infra/environments/vps/values/mirror/loki.yaml"],
      "opentelemetry-operator":
        ["infra/environments/vps/values/mirror/opentelemetry-operator.yaml"],
      "otel-agent": ["infra/environments/vps/values/mirror/otel-agent.yaml"],
      "prometheus": ["infra/environments/vps/values/mirror/prometheus.yaml"],
      "tempo": ["infra/environments/vps/values/mirror/tempo.yaml"],
      "opa-authorizer":
        ["infra/environments/vps/values/mirror/opa-authorizer.yaml"],
      "kore-platform-dns":
        ["infra/environments/vps/values/mirror/platform-dns.yaml"],
      "oci-registry":
        ["infra/environments/vps/values/mirror/oci-registry.yaml"],
      "policy-controller":
        [
          "infra/environments/vps/values/mirror/policy-controller.yaml",
          "infra/environments/vps/values/policy-controller.yaml"
        ]
    }
}
