{
  "$schema": "./schemas/recovery.schema.json",
  "objectives":
    [
      {
        "name": "retained-postgresql",
        "components": ["kore-postgresql-api", "cloudnative-pg"],
        "data": "PostgreSQL databases claimed with retentionPolicy Retain",
        "environment": "local",
        "protection": "data-export",
        "schedule":
          {
            "kind": "on-demand",
            "trigger": "kore data export before kore local down --prune, kore cluster destroy, or any upgrade; there is no local scheduler (ADR 0029)"
          },
        "rpoMinutes": 1440,
        "rtoMinutes": 15,
        "restoreTest": "tools/kore/src/ops/data-restore.live.spec.ts"
      },
      {
        "name": "telemetry-history",
        "components":
          [
            "prometheus",
            "loki",
            "grafana",
            "tempo",
            "kore-observability-config"
          ],
        "data": "Metrics, logs, traces, and dashboards state",
        "environment": "local",
        "protection": "rebuild",
        "schedule":
          {
            "kind": "on-demand",
            "trigger": "kore local up recreates the stack"
          },
        "rpoMinutes": null,
        "rtoMinutes": 30,
        "reason": "Claims are labelled Delete and hold only derived telemetry with 72h retention; dashboards and datasources are declared in the repository."
      },
      {
        "name": "platform-registry",
        "components": ["oci-registry"],
        "data": "Images pushed to the in-cluster registry",
        "environment": "local",
        "protection": "rebuild",
        "schedule":
          {
            "kind": "on-demand",
            "trigger": "kore app up rebuilds and republishes local images"
          },
        "rpoMinutes": null,
        "rtoMinutes": 30,
        "reason": "The claim is labelled Delete; every image is rebuilt from source or re-mirrored by digest from the release lock."
      },
      {
        "name": "keycloak-operator",
        "components": ["keycloak-operator"],
        "data": "The Keycloak operator holds no data; the vendored CRDs only describe a persistence field that Keycloak resources may set",
        "environment": "local",
        "protection": "rebuild",
        "schedule":
          {
            "kind": "on-demand",
            "trigger": "kore local up reinstalls the operator (behind platform-portal)"
          },
        "rpoMinutes": null,
        "rtoMinutes": 15,
        "reason": "The operator and its CRDs are declared in the repository and pinned by digest. The operator holds no Keycloak data. The future platform Keycloak must claim its database through the platform PostgreSQL API (covered by retained-postgresql) and gets its own objective when it is installed."
      },
      {
        "name": "keycloak-data",
        "components": ["kore-platform-keycloak"],
        "data": "The platform Keycloak's realm, groups and users, in the PostgreSQL database it claims with retentionPolicy Retain (behind platform-portal)",
        "environment": "local",
        "protection": "data-export",
        "schedule":
          {
            "kind": "on-demand",
            "trigger": "kore data export --environment local --namespace keycloak before kore local down --prune, kore cluster destroy, or any upgrade; there is no local scheduler (ADR 0029)"
          },
        "rpoMinutes": 1440,
        "rtoMinutes": 30,
        "restoreTest": "tools/kore/src/ops/data-restore.live.spec.ts"
      },
      {
        "name": "managed-postgresql",
        "components": ["kore-postgresql-api", "cloudnative-pg"],
        "data": "PostgreSQL databases on a managed cluster",
        "environment": "managed",
        "status": "planned",
        "protection": "scheduled-backup",
        "schedule": { "kind": "cron", "expression": "0 2 * * *" },
        "rpoMinutes": 15,
        "rtoMinutes": 60
      }
    ]
}
