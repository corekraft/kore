      {
        "name": "policy-controller",
        "phase": "bootstrap",
        "namespace": "cosign-system",
        "kind": "helm",
        "repository": "https://sigstore.github.io/helm-charts",
        "chart": "policy-controller",
        "version": "policy-controller",
        "ownsCRDs":
          [
            "clusterimagepolicies.policy.sigstore.dev",
            "trustroots.policy.sigstore.dev"
          ],
        "dependencies": ["kore-gateway-api", "oci-registry"],
        "timeout": "10m",
        "values": ["infra/environments/common/values/policy-controller.yaml"],
        "readiness":
          [
            "deployment/policy-controller-webhook",
            "mutatingwebhookconfiguration/defaulting.clusterimagepolicy.sigstore.dev",
            "mutatingwebhookconfiguration/policy.sigstore.dev",
            "validatingwebhookconfiguration/validating.clusterimagepolicy.sigstore.dev",
            "validatingwebhookconfiguration/policy.sigstore.dev"
          ],
        "helm":
          {
            "forceConflicts": true,
            "reason": "The controller's webhook reconciler (field manager `webhook`) co-owns the namespaceSelector and caBundle of the policy.sigstore.dev Mutating and ValidatingWebhookConfigurations after install, and the chart renders a namespaceSelector that no value can omit, so Helm 4 server-side apply conflicts on upgrade. Helm takes the fields back and the controller re-reconciles them."
          }
      },
