{
  "$schema": "./schemas/components.schema.json",
  "components":
    [
      {
        "name": "kore-gateway-api",
        "phase": "bootstrap",
        "namespace": "kore-system",
        "kind": "manifest",
        "source": "https://github.com/kubernetes-sigs/gateway-api/releases/download/v${gateway-api}/standard-install.yaml",
        "version": "gateway-api",
        "ownsCRDs":
          [
            "gatewayclasses.gateway.networking.k8s.io",
            "gateways.gateway.networking.k8s.io",
            "httproutes.gateway.networking.k8s.io"
          ],
        "dependencies": [],
        "timeout": "3m",
        "readiness":
          [
            "crd/gateways.gateway.networking.k8s.io",
            "crd/httproutes.gateway.networking.k8s.io"
          ]
      },
      {
        "name": "oci-registry",
        "phase": "bootstrap",
        "namespace": "kore-registry",
        "kind": "local-chart",
        "chart": "infra/charts/oci-registry",
        "version": "local",
        "ownsCRDs": [],
        "dependencies": ["kore-gateway-api"],
        "timeout": "10m",
        "readiness": ["deployment/oci-registry"]
      },
      {
        "name": "kore-storage",
        "phase": "bootstrap",
        "namespace": "kore-system",
        "kind": "local-chart",
        "chart": "infra/charts/platform-storage",
        "version": "local",
        "ownsCRDs": [],
        "dependencies": ["kore-gateway-api"],
        "timeout": "5m",
        "readiness":
          ["storageclass/kore-standard", "storageclass/kore-retained"]
      },
      {
        "name": "cert-manager",
        "phase": "bootstrap",
        "namespace": "cert-manager",
        "kind": "helm",
        "repository": "oci://quay.io/jetstack/charts/cert-manager",
        "chart": "cert-manager",
        "version": "cert-manager",
        "ownsCRDs": ["certificates.cert-manager.io", "issuers.cert-manager.io"],
        "dependencies": ["kore-gateway-api"],
        "timeout": "10m",
        "values": ["infra/environments/common/values/cert-manager.yaml"],
        "readiness":
          ["deployment/cert-manager", "deployment/cert-manager-webhook"]
      },
      {
        "name": "gatekeeper",
        "phase": "bootstrap",
        "namespace": "gatekeeper-system",
        "kind": "helm",
        "repository": "https://open-policy-agent.github.io/gatekeeper/charts",
        "chart": "gatekeeper",
        "version": "gatekeeper",
        "ownsCRDs": ["constrainttemplates.templates.gatekeeper.sh"],
        "dependencies": ["kore-gateway-api"],
        "timeout": "10m",
        "readiness":
          [
            "deployment/gatekeeper-controller-manager",
            "deployment/gatekeeper-audit"
          ]
      },
      {
        "name": "policy-controller",
        "phase": "bootstrap",
        "namespace": "cosign-system",
        "kind": "helm",
        "repository": "https://sigstore.github.io/helm-charts",
        "chart": "policy-controller",
        "version": "policy-controller",
        "ownsCRDs":
          [
            "clusterimagepolicies.policy.sigstore.dev",
            "trustroots.policy.sigstore.dev"
          ],
        "dependencies": ["kore-gateway-api"],
        "timeout": "10m",
        "values": ["infra/environments/common/values/policy-controller.yaml"],
        "readiness": ["deployment/policy-controller-webhook"]
      },
      {
        "name": "istio-base",
        "phase": "bootstrap",
        "namespace": "istio-system",
        "kind": "helm",
        "repository": "https://blob.istio.io/istio-release/charts",
        "chart": "base",
        "version": "istio",
        "ownsCRDs":
          [
            "authorizationpolicies.security.istio.io",
            "peerauthentications.security.istio.io"
          ],
        "dependencies": ["kore-gateway-api"],
        "timeout": "10m",
        "readiness":
          [
            "crd/authorizationpolicies.security.istio.io",
            "crd/peerauthentications.security.istio.io"
          ]
      },
      {
        "name": "istiod",
        "phase": "core",
        "namespace": "istio-system",
        "kind": "helm",
        "repository": "https://blob.istio.io/istio-release/charts",
        "chart": "istiod",
        "version": "istio",
        "ownsCRDs": [],
        "dependencies": ["istio-base"],
        "timeout": "10m",
        "values": ["infra/environments/common/values/istiod.yaml"],
        "readiness": ["deployment/istiod"]
      },
      {
        "name": "istio-cni",
        "phase": "core",
        "namespace": "istio-system",
        "kind": "helm",
        "repository": "https://blob.istio.io/istio-release/charts",
        "chart": "cni",
        "version": "istio",
        "ownsCRDs": [],
        "dependencies": ["istiod"],
        "timeout": "10m",
        "values": ["infra/environments/common/values/istio-cni.yaml"],
        "readiness": ["daemonset/istio-cni-node"]
      },
      {
        "name": "ztunnel",
        "phase": "core",
        "namespace": "istio-system",
        "kind": "helm",
        "repository": "https://blob.istio.io/istio-release/charts",
        "chart": "ztunnel",
        "version": "istio",
        "ownsCRDs": [],
        "dependencies": ["istio-cni"],
        "timeout": "10m",
        "readiness": ["daemonset/ztunnel"]
      },
      {
        "name": "crossplane",
        "phase": "bootstrap",
        "namespace": "crossplane-system",
        "kind": "helm",
        "repository": "https://charts.crossplane.io/stable",
        "chart": "crossplane",
        "version": "crossplane",
        "ownsCRDs":
          ["compositeresourcedefinitions.apiextensions.crossplane.io"],
        "dependencies": ["kore-gateway-api"],
        "timeout": "10m",
        "readiness":
          ["deployment/crossplane", "deployment/crossplane-rbac-manager"]
      },
      {
        "name": "external-secrets",
        "phase": "core",
        "namespace": "external-secrets",
        "kind": "helm",
        "repository": "https://charts.external-secrets.io",
        "chart": "external-secrets",
        "version": "external-secrets",
        "ownsCRDs":
          [
            "externalsecrets.external-secrets.io",
            "secretstores.external-secrets.io"
          ],
        "dependencies": ["cert-manager"],
        "timeout": "10m",
        "readiness":
          ["deployment/external-secrets", "deployment/external-secrets-webhook"]
      },
      {
        "name": "cloudnative-pg",
        "phase": "core",
        "namespace": "cnpg-system",
        "kind": "helm",
        "repository": "https://cloudnative-pg.github.io/charts",
        "chart": "cloudnative-pg",
        "version": "cloudnative-pg",
        "ownsCRDs": ["clusters.postgresql.cnpg.io"],
        "dependencies": ["cert-manager"],
        "timeout": "10m",
        "readiness": ["deployment/cloudnative-pg"]
      },
      {
        "name": "opentelemetry-operator",
        "phase": "observability",
        "namespace": "opentelemetry-operator-system",
        "kind": "helm",
        "repository": "https://open-telemetry.github.io/opentelemetry-helm-charts",
        "chart": "opentelemetry-operator",
        "version": "opentelemetry-operator",
        "ownsCRDs": ["opentelemetrycollectors.opentelemetry.io"],
        "dependencies": ["cert-manager"],
        "timeout": "10m",
        "values": ["infra/observability/operator/values.yaml"],
        "readiness": ["deployment/opentelemetry-operator"]
      },
      {
        "name": "kore-observability-config",
        "phase": "observability",
        "namespace": "observability",
        "kind": "local-chart",
        "chart": "infra/observability/config",
        "version": "local",
        "ownsCRDs": [],
        "dependencies": ["kore-storage", "istiod"],
        "timeout": "2m",
        "readiness":
          [
            "configmap/kore-prometheus-rules",
            "configmap/kore-grafana-dashboards"
          ]
      },
      {
        "name": "prometheus",
        "phase": "observability",
        "namespace": "observability",
        "kind": "helm",
        "repository": "https://prometheus-community.github.io/helm-charts",
        "chart": "prometheus",
        "version": "prometheus",
        "ownsCRDs": [],
        "dependencies":
          [
            "opentelemetry-operator",
            "kore-storage",
            "kore-observability-config"
          ],
        "timeout": "15m",
        "readiness": ["deployment/prometheus-server"]
      },
      {
        "name": "loki",
        "phase": "observability",
        "namespace": "observability",
        "kind": "helm",
        "repository": "https://grafana.github.io/helm-charts",
        "chart": "loki",
        "version": "loki",
        "ownsCRDs": [],
        "dependencies": ["opentelemetry-operator", "kore-storage"],
        "timeout": "15m",
        "readiness": ["statefulset/loki"]
      },
      {
        "name": "tempo",
        "phase": "observability",
        "namespace": "observability",
        "kind": "helm",
        "repository": "https://grafana.github.io/helm-charts",
        "chart": "tempo",
        "version": "tempo",
        "ownsCRDs": [],
        "dependencies": ["opentelemetry-operator", "kore-storage"],
        "timeout": "15m",
        "readiness": ["statefulset/tempo"]
      },
      {
        "name": "grafana",
        "phase": "observability",
        "namespace": "observability",
        "kind": "helm",
        "repository": "https://grafana.github.io/helm-charts",
        "chart": "grafana",
        "version": "grafana",
        "ownsCRDs": [],
        "dependencies":
          [
            "prometheus",
            "loki",
            "tempo",
            "kore-storage",
            "kore-observability-config"
          ],
        "timeout": "10m",
        "readiness": ["deployment/grafana"]
      },
      {
        "name": "otel-collector",
        "phase": "observability",
        "namespace": "observability",
        "kind": "helm",
        "repository": "https://open-telemetry.github.io/opentelemetry-helm-charts",
        "chart": "opentelemetry-collector",
        "version": "opentelemetry-collector",
        "ownsCRDs": [],
        "dependencies": ["prometheus", "loki", "tempo"],
        "timeout": "10m",
        "values": ["infra/observability/collector/values.yaml"],
        "readiness": ["deployment/otel-collector"]
      },
      {
        "name": "otel-agent",
        "phase": "observability",
        "namespace": "observability",
        "kind": "helm",
        "repository": "https://open-telemetry.github.io/opentelemetry-helm-charts",
        "chart": "opentelemetry-collector",
        "version": "opentelemetry-collector",
        "ownsCRDs": [],
        "dependencies": ["otel-collector"],
        "timeout": "10m",
        "values": ["infra/observability/agent/values.yaml"],
        "readiness": ["daemonset/otel-agent-agent"]
      },
      {
        "name": "opa-authorizer",
        "phase": "core",
        "namespace": "opa-system",
        "kind": "local-chart",
        "chart": "infra/charts/opa-authorizer",
        "version": "local",
        "ownsCRDs": [],
        "dependencies": ["istiod"],
        "timeout": "10m",
        "readiness": ["deployment/opa-authorizer"]
      },
      {
        "name": "kore-postgresql-rbac",
        "phase": "core",
        "namespace": "crossplane-system",
        "kind": "local-chart",
        "chart": "infra/charts/crossplane-postgresql-rbac",
        "version": "local",
        "ownsCRDs": [],
        "dependencies": ["crossplane", "cloudnative-pg"],
        "timeout": "2m",
        "readiness": ["clusterrole/crossplane-postgresql-composition"]
      },
      {
        "name": "kore-crossplane-functions",
        "phase": "core",
        "namespace": "crossplane-system",
        "kind": "manifest",
        "source": "infra/apis/crossplane-functions",
        "version": "local",
        "ownsCRDs": [],
        "dependencies": ["crossplane"],
        "timeout": "10m",
        "readiness":
          [
            "function.pkg.crossplane.io/function-go-templating",
            "function.pkg.crossplane.io/function-auto-ready"
          ]
      },
      {
        "name": "kore-postgresql-api",
        "phase": "core",
        "namespace": "crossplane-system",
        "kind": "manifest",
        "source": "infra/apis/postgresql",
        "version": "local",
        "ownsCRDs": ["postgresqlinstances.platform.kore.dev"],
        "dependencies":
          [
            "crossplane",
            "kore-crossplane-functions",
            "cloudnative-pg",
            "kore-postgresql-rbac"
          ],
        "timeout": "10m",
        "readiness": ["crd/postgresqlinstances.platform.kore.dev"]
      },
      {
        "name": "kore-policy-templates",
        "phase": "configuration",
        "namespace": "gatekeeper-system",
        "kind": "manifest",
        "source": "infra/policies/gatekeeper/templates",
        "version": "local",
        "ownsCRDs":
          [
            "korecontainersecurity.constraints.gatekeeper.sh",
            "koremeshenrollment.constraints.gatekeeper.sh",
            "korerbac.constraints.gatekeeper.sh",
            "koreretention.constraints.gatekeeper.sh",
            "koresecrets.constraints.gatekeeper.sh",
            "koreworkloadidentity.constraints.gatekeeper.sh"
          ],
        "dependencies": ["gatekeeper"],
        "timeout": "5m",
        "readiness":
          [
            "constrainttemplate.templates.gatekeeper.sh/korecontainersecurity",
            "constrainttemplate.templates.gatekeeper.sh/koremeshenrollment",
            "constrainttemplate.templates.gatekeeper.sh/korerbac",
            "constrainttemplate.templates.gatekeeper.sh/koreretention",
            "constrainttemplate.templates.gatekeeper.sh/koresecrets",
            "constrainttemplate.templates.gatekeeper.sh/koreworkloadidentity",
            "crd/korecontainersecurity.constraints.gatekeeper.sh",
            "crd/koremeshenrollment.constraints.gatekeeper.sh",
            "crd/korerbac.constraints.gatekeeper.sh",
            "crd/koreretention.constraints.gatekeeper.sh",
            "crd/koresecrets.constraints.gatekeeper.sh",
            "crd/koreworkloadidentity.constraints.gatekeeper.sh"
          ]
      },
      {
        "name": "kore-policy-constraints",
        "phase": "configuration",
        "namespace": "gatekeeper-system",
        "kind": "manifest",
        "source": "infra/policies/gatekeeper/constraints",
        "version": "local",
        "ownsCRDs": [],
        "dependencies": ["gatekeeper", "kore-policy-templates"],
        "timeout": "5m",
        "readiness":
          [
            "korecontainersecurity.constraints.gatekeeper.sh/kore-container-security",
            "koremeshenrollment.constraints.gatekeeper.sh/kore-mesh-enrollment",
            "korerbac.constraints.gatekeeper.sh/kore-rbac",
            "koreretention.constraints.gatekeeper.sh/kore-retention",
            "koresecrets.constraints.gatekeeper.sh/kore-secrets",
            "koreworkloadidentity.constraints.gatekeeper.sh/kore-workload-identity"
          ]
      },
      {
        "name": "kore-local-tls",
        "phase": "configuration",
        "namespace": "kore-system",
        "kind": "local-chart",
        "chart": "infra/charts/platform-certificate",
        "version": "local",
        "ownsCRDs": [],
        "dependencies": ["cert-manager"],
        "timeout": "10m",
        "readiness": ["certificate/kore-local", "secret/kore-local-tls"]
      },
      {
        "name": "kore-platform-config",
        "phase": "configuration",
        "namespace": "kore-system",
        "kind": "local-chart",
        "chart": "infra/charts/platform-config",
        "version": "local",
        "ownsCRDs": [],
        "dependencies":
          [
            "kore-postgresql-api",
            "oci-registry",
            "external-secrets",
            "ztunnel",
            "gatekeeper",
            "opa-authorizer",
            "kore-local-tls"
          ],
        "timeout": "10m",
        "readiness": ["gateway/kore-gateway"]
      }
    ]
}
