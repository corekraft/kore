        "chart": "infra/charts/oci-registry",
        "version": "local",
        "ownsCRDs": [],
        "dependencies": ["kore-gateway-api", "cert-manager"],
        "timeout": "10m",
        "readiness": ["deployment/oci-registry", "certificate/oci-registry-tls"]
