- name: Install the agent runtime packages
  ansible.builtin.apt:
    name:
      - acl
      - build-essential
      - docker.io
      - git
      - jq
      - lsof
      - mosh
      - tmux
      - unzip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Run Docker at boot
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

# systemd-resolved sends the platform zone to the cluster's DNS and nothing
# else. The server sits on its own dummy link, scoped to the zone, rather than in
# a global DNS= in resolved.conf (see the network template for why).
- name: Create the platform DNS dummy link
  ansible.builtin.template:
    src: kore-platform-dns.netdev.j2
    dest: /etc/systemd/network/25-kore-platform-dns.netdev
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd-networkd

- name: Route the platform zone to the platform DNS link
  ansible.builtin.template:
    src: kore-platform-dns.network.j2
    dest: /etc/systemd/network/25-kore-platform-dns.network
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd-networkd

- name: Create the agent account without sudo
  register: agents_account
  ansible.builtin.user:
    name: "{{ agents_user }}"
    shell: /bin/bash
    groups: docker
    append: true
    password: "*"
    create_home: true

- name: Create the agent's SSH directory
  ansible.builtin.file:
    path: "/home/{{ agents_user }}/.ssh"
    state: directory
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0700"

- name: Authorise the controller's public keys for the agent account
  ansible.builtin.lineinfile:
    path: "/home/{{ agents_user }}/.ssh/authorized_keys"
    line: "{{ lookup('ansible.builtin.file', item).split()[:2] | join(' ') }}"
    create: true
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0600"
  loop: "{{ agents_ssh_pubkey_files }}"

- name: Install the pinned mise
  ansible.builtin.get_url:
    url: "https://github.com/jdx/mise/releases/download/v{{ agents_mise_version }}/mise-v{{ agents_mise_version }}-linux-x64"
    dest: /usr/local/bin/mise
    checksum: "sha256:{{ agents_mise_sha256 }}"
    owner: root
    group: root
    mode: "0755"

- name: Create the agent's mise config directory
  ansible.builtin.file:
    path: "/home/{{ agents_user }}/.config/mise"
    state: directory
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0755"

- name: Pin the agent's global tools
  ansible.builtin.template:
    src: mise-config.toml.j2
    dest: "/home/{{ agents_user }}/.config/mise/config.toml"
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0644"

- name: Put the agent's tools on the non-interactive PATH
  # Above Debian's interactive-only guard, so commands run over SSH (Moshi
  # starting tmux, Ansible) find hc, claude and gh.
  ansible.builtin.lineinfile:
    path: "/home/{{ agents_user }}/.bashrc"
    regexp: '^export PATH="\$HOME/\.local/'
    line: 'export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"'
    insertbefore: BOF
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0644"
    create: true

# A real link comes first on the PATH, ahead of the mise shims.
- name: Create the agent's local bin directory
  ansible.builtin.file:
    path: "/home/{{ agents_user }}/.local/bin"
    state: directory
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0755"

# herdr is no longer installed here: the agent's terminals are hc terminals, and
# the owner's own terminal is Herdr.app. A host that still holds the old link,
# shim or mise install converges by losing them.
- name: Remove the old herdr link and shim
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/home/{{ agents_user }}/.local/bin/herdr"
    - "/home/{{ agents_user }}/.local/share/mise/shims/herdr"

- name: Remove the old mise herdr install
  ansible.builtin.file:
    path: "/home/{{ agents_user }}/.local/share/mise/installs/herdr"
    state: absent

# The pinned tarball rather than install.sh piped to sh, which installs the
# latest release. install.sh's own steps for Linux are the same: unpack
# herdr-core into ~/.local/bin and link hc to it.
- name: Download the pinned herdr-core
  register: agents_herdr_core_download
  ansible.builtin.get_url:
    url: "https://releases.herdr.dev/core/{{ agents_herdr_core_version }}/herdr-core-linux-x86_64.tar.gz"
    dest: "/var/cache/herdr-core-{{ agents_herdr_core_version }}.tar.gz"
    checksum: "sha256:{{ agents_herdr_core_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Install herdr-core
  ansible.builtin.unarchive:
    src: "/var/cache/herdr-core-{{ agents_herdr_core_version }}.tar.gz"
    dest: "/home/{{ agents_user }}/.local/bin"
    remote_src: true
    include:
      - herdr-core
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0755"
  # A check run downloads nothing, so there is no tarball to unpack yet.
  when: not (ansible_check_mode and agents_herdr_core_download.changed)

- name: Link hc to herdr-core
  ansible.builtin.file:
    src: herdr-core
    dest: "/home/{{ agents_user }}/.local/bin/hc"
    state: link
    follow: false
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"

# The pinned tarball, like herdr-core: only the bd binary is unpacked into
# ~/.local/bin, so it sits ahead of the mise shims on the PATH.
- name: Download the pinned bd
  register: agents_beads_download
  ansible.builtin.get_url:
    url: "https://github.com/gastownhall/beads/releases/download/v{{ agents_beads_version }}/beads_{{ agents_beads_version }}_linux_amd64.tar.gz"
    dest: "/var/cache/beads-{{ agents_beads_version }}.tar.gz"
    checksum: "sha256:{{ agents_beads_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Install bd
  ansible.builtin.unarchive:
    src: "/var/cache/beads-{{ agents_beads_version }}.tar.gz"
    dest: "/home/{{ agents_user }}/.local/bin"
    remote_src: true
    include:
      - bd
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0755"
  # A check run downloads nothing, so there is no tarball to unpack yet.
  when: not (ansible_check_mode and agents_beads_download.changed)

- name: Activate mise in the agent's shells
  ansible.builtin.lineinfile:
    path: "/home/{{ agents_user }}/.bashrc"
    line: 'eval "$(/usr/local/bin/mise activate bash)"'
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0644"
    create: true

- name: Install the agent's tools
  ansible.builtin.command: /usr/local/bin/mise install --yes
  become: true
  become_user: "{{ agents_user }}"
  args:
    chdir: "/home/{{ agents_user }}"
  register: agents_mise_install
  changed_when: "'installed 0 tools' not in agents_mise_install.stderr"

# kore local up runs `mkcert -install` as the agent, which asks sudo for the
# system store, and the agent has no sudo. The pinned mkcert runs here as root
# instead: it creates the agent's CA in the agent's home and adds it to the
# system store. Afterwards its own check finds the CA trusted and skips sudo.
# Root created the CA files, so the agent gets them back: kore reads the key to
# build the cluster's CA secret, and the key never leaves this VM.
- name: Create the agent's mkcert CA directory
  ansible.builtin.file:
    path: "/home/{{ agents_user }}/.local/share/mkcert"
    state: directory
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0700"

- name: Create the agent's local CA and trust it in the system store
  ansible.builtin.command:
    argv:
      - "/home/{{ agents_user }}/.local/share/mise/installs/mkcert/{{ agents_tools.mkcert }}/mkcert"
      - -install
  environment:
    CAROOT: "/home/{{ agents_user }}/.local/share/mkcert"
    TRUST_STORES: system
  register: agents_mkcert_install
  changed_when: "'now installed in the system trust store' in agents_mkcert_install.stderr"
  when: not ansible_check_mode

- name: Hand the agent's mkcert CA certificate to the agent
  ansible.builtin.file:
    path: "/home/{{ agents_user }}/.local/share/mkcert/rootCA.pem"
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0644"
  when: not ansible_check_mode

- name: Hand the agent's mkcert CA key to the agent
  ansible.builtin.file:
    path: "/home/{{ agents_user }}/.local/share/mkcert/rootCA-key.pem"
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0600"
  when: not ansible_check_mode

- name: Let the agent's user services run without a login
  ansible.builtin.command: loginctl enable-linger {{ agents_user }}
  args:
    creates: "/var/lib/systemd/linger/{{ agents_user }}"

- name: Create the agent's Claude Code directory
  ansible.builtin.file:
    path: "/home/{{ agents_user }}/.claude"
    state: directory
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0700"

# Moshi was removed from this VM. These tasks take out what earlier runs
# installed: its Claude Code hooks, its pairing, its user service, the binary
# and its state, and the phone's key in authorized_keys.
- name: Look for moshi-hook
  ansible.builtin.stat:
    path: /usr/local/bin/moshi-hook
  register: agents_moshi_hook

- name: Remove Moshi's hooks from Claude Code
  ansible.builtin.command: /usr/local/bin/moshi-hook uninstall --target claude
  become: true
  become_user: "{{ agents_user }}"
  when: agents_moshi_hook.stat.exists
  changed_when: true

- name: Remove the Moshi pairing
  ansible.builtin.command: /usr/local/bin/moshi-hook unpair
  become: true
  become_user: "{{ agents_user }}"
  when: agents_moshi_hook.stat.exists
  changed_when: true

- name: Stop and remove the moshi-hook user service
  ansible.builtin.command: /usr/local/bin/moshi-hook service uninstall
  become: true
  become_user: "{{ agents_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ agents_account.uid }}"
  when: agents_moshi_hook.stat.exists
  changed_when: true

- name: Remove moshi-hook and its files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/moshi-hook
    - /var/cache/moshi-hook-v0.4.60.tar.gz
    - "/home/{{ agents_user }}/.config/moshi"
    - "/home/{{ agents_user }}/.local/state/moshi"
    - "/home/{{ agents_user }}/.config/systemd/user/moshi-hook.service"
    - "/home/{{ agents_user }}/.config/systemd/user/moshi-hook.service.d"
    - "/home/{{ agents_user }}/.claude/moshi-plugin"

- name: Remove the Moshi phone's key from the agent account
  ansible.builtin.lineinfile:
    path: "/home/{{ agents_user }}/.ssh/authorized_keys"
    regexp: " moshi-pair:"
    state: absent

# `gh auth setup-git` writes the helper with gh's versioned install path, which
# breaks on the next gh upgrade. The shim follows the pinned version. The empty
# first entry clears any helper inherited from the system config.
- name: Read the agent's git credential helpers
  ansible.builtin.command:
    argv:
      [git, config, --global, --get-all, "credential.https://{{ item }}.helper"]
  become: true
  become_user: "{{ agents_user }}"
  register: agents_git_helpers
  changed_when: false
  failed_when: agents_git_helpers.rc not in [0, 1]
  check_mode: false
  loop: [github.com, gist.github.com]

- name: Point git's GitHub credential helper at the gh shim
  ansible.builtin.shell:
    cmd: |
      set -eu
      git config --global --unset-all "credential.https://{{ item.item }}.helper" || true
      git config --global --add "credential.https://{{ item.item }}.helper" ""
      git config --global --add "credential.https://{{ item.item }}.helper" "{{ agents_gh_helper }}"
    executable: /bin/bash
  become: true
  become_user: "{{ agents_user }}"
  changed_when: true
  when: item.stdout_lines != ["", agents_gh_helper]
  loop: "{{ agents_git_helpers.results }}"
  loop_control:
    label: "{{ item.item }}"
