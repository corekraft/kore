# The unprivileged account herdr and Claude Code run as. It has Docker (for
# throwaway `kore local up` profiles) and no sudo; the VM is the boundary.
agents_user: agent

# mise itself, from its signed GitHub release, checked against this checksum.
agents_mise_version: "2026.11.10"
agents_mise_sha256: "b603a4f48563fc379a794d9ea2cf9f709ed276c9141068604cb0c59fa3e674a9"

# The agent's global tools. A kore checkout's own .mise.toml pins the rest
# (herdr and node are repeated here so they work outside a checkout; keep them
# equal to the repository's pins).
agents_tools:
  node: "26.13.0"
  herdr: "0.9.5"
  gh: "2.105.0"
  # The native release binary through aqua, which checks its checksum.
  claude: "2.1.330"
  neovim: "0.12.6"
  # The CA tool kore local up uses; the agent's mkcert is installed from this pin.
  mkcert: "1.4.4"
  # The Pi coding agent CLI (the `pi` command), from npm, pinned exactly.
  "npm:@earendil-works/pi-coding-agent": "1.6.0"

# herdr-core (hc), the newer herdr without the TUI, from its release tarball
# checked against the checksum in the release's manifest.json. It lives
# beside herdr, as ~/.local/bin/herdr-core with an `hc` link.
agents_herdr_core_version: "0.1.21"
agents_herdr_core_sha256: "78424755c10a40dde38a0bdb55c20ac19706e9ae05ed68fc2acf1fcff0d941c1"

# Public keys allowed to log in as the agent account, read on the controller at
# run time and never committed.
agents_ssh_pubkey_files:
  - ~/.ssh/id_ed25519.pub
  - ~/.ssh/id_rsa.pub

# git's credential helper for GitHub, through the mise shim so a gh upgrade
# does not leave it pointing at a removed install.
agents_gh_helper: "!/home/{{ agents_user }}/.local/share/mise/shims/gh auth git-credential"

# The platform DNS the cluster publishes on the host (the platform-dns feature's
# port mapping in infra/environments/local/environment.yaml). Only names under
# the zones go there; every other name keeps the host's own resolvers.
# The zones the platform DNS answers: the local domain (ADR 0176 removed the former
# kore.local alias). Each gets a routing-only domain on the link.
agents_platform_dns_zones:
  - platform.kore.internal
agents_platform_dns_address: 127.0.0.1
agents_platform_dns_port: 1053
# The dummy link that carries that server. Interface names are 15 characters or fewer.
agents_platform_dns_link: kore-dns
# The address that lets systemd-resolved use that link: it opens a DNS scope only on a
# link with a routable address. A /128 from the private ULA prefix routes nothing else.
agents_platform_dns_link_address: "fd4b:6f72:6500::1/128"
