# Pinned to the repository's kubectl minor (.mise.toml). The installer is
# pinned by checksum and itself checks the k3s binary against the release's
# sha256sum file.
k3s_version: v1.37.2+k3s1
k3s_installer_sha256: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b

# k3s data (images, containerd, local volumes) on its own volume, so it cannot
# fill the root filesystem.
k3s_data_lv: k3s
k3s_data_size: 300g
k3s_data_path: /var/lib/rancher

# The persistent cluster outranks the agents VM for CPU and disk time on the
# shared cores and HDDs (systemd's default weight is 100).
k3s_cpu_weight: 400
k3s_io_weight: 400

# The vps environment overlay is the one owner of the registry address and of
# the flag below; the role reads them and holds no second copy.
k3s_vps_environment: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../environments/vps/environment.yaml') | from_yaml }}"

# The in-cluster registry's address. It is a ClusterIP, so the node's
# containerd reaches it and the CA below is the only trust it needs.
k3s_registry_address: "{{ k3s_vps_environment.registry.address }}"

# Dark launch: with the overlay's k3s-registry-trust flag off (it is, until a
# live run on kore-vps and harness flag activate), the role manages no registry
# trust and a run changes nothing here.
k3s_registry_trust: "{{ k3s_vps_environment.features['k3s-registry-trust'] | default(false) }}"

# The registry's public CA (ca.crt only, never a key), exported on the
# controller outside the repository.
k3s_registry_ca_source: ~/.kube/kore-vps-registry-ca.crt
k3s_registry_ca_path: /etc/rancher/k3s/registry-ca.crt

# Where the controller keeps the kubeconfig, outside the repository.
k3s_controller_kubeconfig: ~/.kube/kore-vps.yaml
k3s_context: kore-vps
