- name: Install the Tailscale apt signing key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    checksum: "sha256:{{ tailscale_keyring_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Add the Tailscale apt repository
  ansible.builtin.copy:
    content: |
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian trixie main
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: "0644"

- name: Install the pinned Tailscale version
  ansible.builtin.apt:
    name: "tailscale={{ tailscale_version }}"
    state: present
    update_cache: true
    allow_downgrade: false

- name: Run tailscaled at boot
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Read the Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  check_mode: false

# An auth key from the controller's environment joins a fresh machine without
# opening a browser. The key streams through stdin and is never logged or
# written to disk. Tags stay with OpenTofu (infra/tofu/stacks/tailnet), the
# single owner of machine tags, so the key itself needs none.
- name: Join the tailnet with an auth key from the controller
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - --auth-key=file:/dev/stdin
      - "--hostname={{ inventory_hostname }}"
      - "--ssh={{ tailscale_ssh | lower }}"
    stdin: "{{ tailscale_auth_key }}"
  no_log: true
  changed_when: true
  when:
    - (tailscale_status.stdout | from_json).BackendState != "Running"
    - tailscale_auth_key | length > 0

- name: Read the Tailscale backend state after joining
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  check_mode: false

- name: Require the host to be signed in to the tailnet
  ansible.builtin.assert:
    that: (tailscale_status.stdout | from_json).BackendState == "Running"
    fail_msg: >-
      Tailscale is not signed in on this host. Export TAILSCALE_AUTH_KEY on
      the controller and run the playbook again, or run
      `sudo tailscale up --ssh --hostname={{ inventory_hostname }}` on the host
      and open the link it prints. The network role closes public SSH
      and must not run before the tailnet works.
    quiet: true

- name: Read the Tailscale preferences
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_prefs
  changed_when: false
  check_mode: false

- name: Set Tailscale SSH on or off
  ansible.builtin.command: tailscale set --ssh={{ tailscale_ssh | lower }}
  when: (tailscale_prefs.stdout | from_json).RunSSH != tailscale_ssh
  changed_when: true
