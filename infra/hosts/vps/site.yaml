- name: Converge the kore VPS host
  hosts: kore-vps
  # The host's own addresses, read from its facts. The firewall and the
  # cluster's address ConfigMap read this one copy; neither address is written
  # into the repository.
  vars:
    kore_host_addresses:
      public: "{{ ansible_facts['default_ipv4']['address'] }}"
      tailnet: "{{ ansible_facts['tailscale0']['ipv4']['address'] }}"
  roles:
    - base
    - tailscale
    - sshd
    - network
    - neovim
    - incus
    - k3s

- name: Converge the agents VM
  hosts: kore-agents
  roles:
    - base
    - sshd
    - agents
    # Last: it turns Tailscale SSH off once sshd and the keys are in place.
    - tailscale
