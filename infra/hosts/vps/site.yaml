- name: Converge the kore VPS host
  hosts: kore-vps
  # The host's own addresses, read from its facts. The firewall and the
  # cluster's address ConfigMap read this one copy; neither address is written
  # into the repository.
  vars:
    kore_host_addresses:
      public: "{{ ansible_facts['default_ipv4']['address'] }}"
      tailnet: "{{ ansible_facts['tailscale0']['ipv4']['address'] }}"
    # The overlay's flag. Off, the firewall and the ConfigMap are left as they are.
    kore_host_ports_flag: >-
      {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../environments/vps/environment.yaml')
      | from_yaml).features['host-published-ports'] | default(false) }}
  roles:
    - base
    - tailscale
    - sshd
    - network
    - neovim
    - incus
    - k3s
    # The OpenBao static seal key (ADR 0168), placed only while the vps overlay's
    # openbao flag is on. Last: the node's cluster is converged before the key lands.
    - openbao

- name: Converge the agents VM
  hosts: kore-agents
  roles:
    - base
    - sshd
    - agents
    # Last: it turns Tailscale SSH off once sshd and the keys are in place.
    - tailscale
