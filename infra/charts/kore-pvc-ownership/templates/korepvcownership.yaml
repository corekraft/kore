# Audit first (AGENTS.md, ADR 0072): dryrun until a recorded zero-violation audit promotes it.
# Application namespaces only; the promotion steps are in docs/operations/pvc-ownership-admission.md.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: KorePVCOwnership
metadata: { name: kore-pvc-ownership }
spec:
  enforcementAction: dryrun
  match:
    kinds: [{ apiGroups: [""], kinds: [PersistentVolumeClaim] }]
    # Application namespaces only: namespaces bootstrap has activated (ADR 0054).
    # Platform namespaces are not application data and are never checked.
    namespaceSelector:
      matchExpressions:
        - { key: platform.kore.dev/activation-generation, operator: Exists }
  parameters:
    exemptNamespaces:
      [
        kube-system,
        cert-manager,
        gatekeeper-system,
        istio-system,
        cosign-system,
        crossplane-system,
        external-secrets,
        cnpg-system,
        opentelemetry-operator-system
      ]
