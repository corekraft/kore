apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: organization-local
  labels: { platform.kore.dev/provider: local }
spec:
  compositeTypeRef:
    { apiVersion: platform.kore.dev/v1alpha1, kind: Organization }
  mode: Pipeline
  pipeline:
{{- $features := .Values.features | default dict }}
{{- if index $features "platform-portal" }}
    # With platform-portal on, the Organization owns the platform Keycloak's
    # realm and the groups that mirror it (ADR 0113), so membership has one
    # owner. The only Organization is `platform`, so the realm and the
    # organization's group are named for it, and the operators group Argo CD
    # binds its role to (ADR 0043) is nested under that group. The realm holds
    # users, so deleting the Organization never deletes it: its management
    # policies leave out Delete. Groups are only a mirror and go with it. The
    # provider config `keycloak` is rendered by platform-keycloak.
    - step: compose-keycloak-realm
      functionRef: { name: function-go-templating }
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            ---
            apiVersion: realm.keycloak.m.crossplane.io/v1alpha1
            kind: Realm
            metadata:
              name: platform
              namespace: keycloak
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: realm
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: keycloak
              forProvider:
                realm: platform
                displayName: Kore platform
                enabled: true
                # Hardened explicitly, so no Keycloak default decides. No
                # self-registration; TLS required for every client outside
                # private networks; five-minute access tokens; sessions idle out
                # after 30 minutes and end after 10 hours, which bounds refresh
                # tokens; each refresh token is single use. No user, client,
                # redirect URI or web origin is composed here: each OIDC client
                # sets its own exact ones (a later item).
                registrationAllowed: false
                sslRequired: external
                accessTokenLifespan: 5m
                ssoSessionIdleTimeout: 30m
                ssoSessionMaxLifespan: 10h
                revokeRefreshToken: true
                refreshTokenMaxReuse: 0
            ---
            apiVersion: group.keycloak.m.crossplane.io/v1alpha1
            kind: Group
            metadata:
              name: platform
              namespace: keycloak
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: group-platform
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: keycloak
              forProvider:
                name: platform
                realmIdRef:
                  name: platform
            ---
            apiVersion: group.keycloak.m.crossplane.io/v1alpha1
            kind: Group
            metadata:
              name: platform-operators
              namespace: keycloak
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: group-platform-operators
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: keycloak
              forProvider:
                name: platform-operators
                realmIdRef:
                  name: platform
                parentIdRef:
                  name: platform
{{- end }}
{{- if index $features "suborg-tenancy" }}
    # With suborg-tenancy on (ADR 0165, issue 1550), a suborg is the namespace,
    # quota and trust boundary of its services. This step is the one owner of the
    # suborg's Namespace, every label on it, and its ResourceQuota and LimitRange;
    # nothing else creates them. Only an Organization with a parent is a suborg, so
    # the platform tenant root composes no namespace. The quota has no default (the
    # XRD requires it), so the LimitRange is derived from it: a container may ask no
    # more than the suborg's whole requests, and a claim no more than its storage.
    # The shared-gateway label follows platform-shared-gateway (ADR 0134). The Go
    # template is wrapped in a Helm raw string so Helm leaves it for Crossplane to
    # evaluate; the feature flags alone are spliced in by Helm.
    - step: compose-suborg-namespace
      functionRef: { name: function-go-templating }
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{`{{- $suborg := .observed.composite.resource }}
            {{- $quota := $suborg.spec.quota }}
            {{- with $suborg.spec.parent }}
            ---
            apiVersion: v1
            kind: Namespace
            metadata:
              name: {{ $suborg.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: namespace
              labels:
                platform.kore.dev/tenant: {{ . }}
                platform.kore.dev/organization: {{ $suborg.metadata.name }}
                pod-security.kubernetes.io/enforce: restricted
                istio.io/dataplane-mode: ambient
                policy.sigstore.dev/include: "true"`}}{{ if index $features "platform-shared-gateway" }}
                platform.kore.dev/shared-gateway: "true"{{ end }}{{`
            ---
            apiVersion: v1
            kind: ResourceQuota
            metadata:
              name: suborg-quota
              namespace: {{ $suborg.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: quota
            spec:
              hard:
                requests.cpu: {{ $quota.requests.cpu | quote }}
                requests.memory: {{ $quota.requests.memory | quote }}
                requests.storage: {{ $quota.storage | quote }}
                pods: {{ $quota.pods | int | quote }}
            ---
            apiVersion: v1
            kind: LimitRange
            metadata:
              name: suborg-limits
              namespace: {{ $suborg.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: limits
            spec:
              limits:
                - type: Container
                  max:
                    cpu: {{ $quota.requests.cpu | quote }}
                    memory: {{ $quota.requests.memory | quote }}
                - type: PersistentVolumeClaim
                  max:
                    storage: {{ $quota.storage | quote }}
            {{- end }}`}}
{{- $net := .Values.suborgNetwork | default dict }}
{{- $serviceCidr := required "suborgNetwork.serviceCidr is required while suborg-tenancy is on: pass the cluster's service range from the environment (cluster.serviceCidr, or k3d.serviceCidr on k3d)" $net.serviceCidr }}
{{- $podCidr := $net.podCidr | default "10.42.0.0/16" }}
{{- $excluded := concat (list $podCidr $serviceCidr) ($net.apiServerCidrs | default (list)) }}
    # With suborg-tenancy on (ADR 0165, issue 1552) the suborg is the trust boundary of
    # its services, so this step is the one owner of its two NetworkPolicies. The
    # default-deny ingress admits only pods of the same suborg, the shared gateway,
    # platform telemetry, kubelet probes (Istio ambient SNATs them to 169.254.7.127)
    # and DNS on port 53; a grant opens more, in the Service composition. The egress
    # policy reaches only the same suborg and DNS, and open internet addresses outside
    # the pod range, the service range and any recorded API address: that is the v1
    # open-egress default the owner confirmed. The ranges are passed by the environment
    # and fail closed when the service range is missing.
    - step: compose-suborg-network-policies
      functionRef: { name: function-go-templating }
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{`{{- $suborg := .observed.composite.resource }}
            {{- with $suborg.spec.parent }}
            ---
            apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: suborg-default-deny-ingress
              namespace: {{ $suborg.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: default-deny-ingress
            spec:
              podSelector: {}
              policyTypes: [Ingress]
              ingress:
                - from:
                    - podSelector: {}
                - from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: kore-system
                      podSelector:
                        matchLabels:
                          gateway.networking.k8s.io/gateway-name: kore-gateway
                - from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: observability
                - from:
                    - ipBlock:
                        cidr: 169.254.7.127/32
                - from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: kube-system
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: kore-dns
                  ports:
                    - port: 53
                      protocol: UDP
                    - port: 53
                      protocol: TCP
            ---
            apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: suborg-egress
              namespace: {{ $suborg.metadata.name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: egress
            spec:
              podSelector: {}
              policyTypes: [Egress]
              egress:
                - to:
                    - podSelector: {}
                - to:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: kube-system
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: kore-dns
                  ports:
                    - port: 53
                      protocol: UDP
                    - port: 53
                      protocol: TCP
                - to:
                    - ipBlock:
                        cidr: 0.0.0.0/0
                        except:`}}
{{- range $cidr := $excluded }}
                          - {{ $cidr }}
{{- end }}
            {{`{{- end }}`}}
{{- end }}
    - step: mark-ready
      functionRef: { name: function-auto-ready }
