# Cluster scope: ADR 0115 (the namespace composition creates cluster-scoped Namespaces).
# metadata.name is the base of every name derived from a Service. The longest
# derived label is the Argo Application golden-path-<service>, 12 characters
# longer: Argo CD's default label tracking copies the Application's name into
# the app.kubernetes.io/instance label, and a label value is at most 63
# characters. So the name is at most 51 characters (63 - 12) and starts with a
# letter (a Kubernetes Service name is a DNS-1035 label). The other derived
# names are the workload <service>-frontend (9 characters longer, 60 at the
# cap), the workload <service>-bff, the certificate secret <service>-tls, the
# Gateway routes named <service>, the namespace <service>--<environment> (at
# most 63, checked per environment below), and the host label <service> in
# <service>.<organization>.<platform domain>.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: services.platform.kore.dev
spec:
  scope: Cluster
  group: platform.kore.dev
  names:
    kind: Service
    plural: services
  defaultCompositionRef:
    name: service-local
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: "self.metadata.name.matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$')"
              message: "metadata.name must be a single DNS label (lowercase letters, digits and hyphens, at most 63 characters, no dots): the default host is <service>.<organization>.<platform domain>"
            - rule: "self.metadata.name.matches('^[a-z]')"
              message: "metadata.name must start with a lowercase letter (a Kubernetes Service name cannot start with a digit); rename it to start with a letter"
            - rule: "self.metadata.name.size() <= 51"
              message: "metadata.name must be at most 51 characters, because the longest derived label, the Argo Application golden-path-<service>, adds 12 characters to fit 63; shorten it"
            - rule: "!self.metadata.name.contains('--')"
              message: "metadata.name must not contain a double hyphen: the namespace is <service>--<environment>"
            - rule: "self.spec.environments.all(e, !e.contains('--'))"
              message: "spec.environments must not contain a double hyphen: the namespace is <service>--<environment>"
            - rule: "self.spec.environments.all(e, self.metadata.name.size() + 2 + e.size() <= 63)"
              message: "the namespace name <service>--<environment> must be at most 63 characters; shorten metadata.name or spec.environments"
            - rule: "!self.metadata.name.startsWith('kube-') && !self.metadata.name.startsWith('kore-')"
              message: "metadata.name must not use a reserved prefix (kube-, kore-): it would collide with a namespace owned elsewhere"
          properties:
            spec:
              type: object
              required: [organization, environments]
              properties:
                organization: { type: string, enum: [platform] }
                environments:
                  type: array
                  minItems: 1
                  maxItems: 16
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    maxLength: 61
                    pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"
                # The app record fields (ADR 0166). Every one is optional, so a
                # Service without them, and the legacy infra/services directory,
                # still validate. Image digests, the source commit and flag state
                # are not here: only the ServiceRelease file carries them.
                repository:
                  {
                    type: string,
                    description: "the application's source repository, for example example.org/leads/checkout"
                  }
                path:
                  {
                    type: string,
                    description: "the directory of the service inside its repository"
                  }
                components:
                  type: object
                  description: "frontend, bff or both: a service with neither is refused"
                  minProperties: 1
                  additionalProperties: false
                  properties:
                    frontend:
                      type: object
                      additionalProperties: false
                      properties:
                        resources:
                          type: object
                          additionalProperties: false
                          properties:
                            requests:
                              type: object
                              additionalProperties: false
                              properties:
                                cpu: { type: string }
                                memory: { type: string }
                    bff:
                      type: object
                      additionalProperties: false
                      properties:
                        resources:
                          type: object
                          additionalProperties: false
                          properties:
                            requests:
                              type: object
                              additionalProperties: false
                              properties:
                                cpu: { type: string }
                                memory: { type: string }
                gateway:
                  type: string
                  enum: [internal, external]
                  default: internal
                  description: "internal by default; external is accepted here, and the ingress work enforces it"
                # Reserved for their own decisions: the ingress decision owns the
                # hostnames shape, the backup decision owns backup, and the access
                # decision owns allowFrom. Loose placeholders until then.
                hostnames:
                  {
                    type: array,
                    items: { type: string },
                    description: "reserved: the ingress decision owns the shape"
                  }
                backup:
                  {
                    type: object,
                    x-kubernetes-preserve-unknown-fields: true,
                    description: "reserved: the backup decision owns the shape"
                  }
                allowFrom:
                  {
                    type: array,
                    items: { type: string },
                    description: "reserved: the names of the grantees; the access decision owns the shape"
                  }
                secrets:
                  type: array
                  description: "secret names only; secret values never enter git"
                  items:
                    type: string
                    pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"
            status:
              type: object
              properties:
                defaultHost: { type: string }
                conditions:
                  { type: array, x-kubernetes-preserve-unknown-fields: true }
                phase: { type: string }
