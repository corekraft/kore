# Cluster scope: ADR 0115 (the namespace composition creates cluster-scoped Namespaces).
{{- $features := .Values.features | default dict }}
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: organizations.platform.kore.dev
spec:
  scope: Cluster
  group: platform.kore.dev
  names:
    kind: Organization
    plural: organizations
  defaultCompositionRef:
    name: organization-local
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: "self.metadata.name == 'platform'"
              message: "only the platform organization is supported"
          properties:
            spec:
              type: object
              required: [tenant]
              properties:
                tenant:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"
                parent:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"
{{- if index $features "platform-hostname-ownership" }}
                # The zone the organization owns (ADR 0042): the one place the
                # hostname-ownership constraint reads it, with no parameter list
                # beside it. It defaults to the environment's default zone,
                # <organizationId>.<platformDomain>, from the one environment field.
                zone:
                  type: string
                  default: {{ printf "%s.%s" (required "platformOrganizationId is required while platform-hostname-ownership is on" .Values.platformOrganizationId) .Values.platformDomain | quote }}
                  maxLength: 253
                  pattern: "^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\\.)+[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"
{{- end }}
            status:
              type: object
              properties:
                conditions:
                  { type: array, x-kubernetes-preserve-unknown-fields: true }
                phase: { type: string }
