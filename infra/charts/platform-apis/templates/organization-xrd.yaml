# Cluster scope: ADR 0115 (the namespace composition creates cluster-scoped Namespaces).
{{- $features := .Values.features | default dict }}
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: organizations.platform.kore.dev
spec:
  scope: Cluster
  group: platform.kore.dev
  names:
    kind: Organization
    plural: organizations
  defaultCompositionRef:
    name: organization-local
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          # A suborg is an Organization one level below the tenant root `platform` (ADR 0165).
          # Its name is its namespace, so it is a DNS label of at most 54 characters
          # (<suborg>--preview fits 63), with no double hyphen; its quota has no default,
          # so an unbounded suborg cannot be written. Reserved names are refused by
          # kore validate, which holds the platform namespaces (ADR 0165).
          x-kubernetes-validations:
            - rule: "self.metadata.name.matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$')"
              message: "metadata.name must be a single DNS label (lowercase letters, digits and hyphens, at most 63 characters, no dots)"
            - rule: "self.metadata.name == 'platform' || self.metadata.name.size() <= 54"
              message: "metadata.name must be at most 54 characters, so <suborg>--preview fits 63; shorten it"
            - rule: "!self.metadata.name.contains('--')"
              message: "metadata.name must not contain a double hyphen: the suborg namespace is <suborg> and its preview is <suborg>--preview; rename it"
            - rule: "self.metadata.name != 'platform' || !has(self.spec.parent)"
              message: "the platform organization is the tenant root and has no parent; remove spec.parent"
            - rule: "self.metadata.name == 'platform' || has(self.spec.parent)"
              message: 'spec.parent is required for a suborg; set it to "platform", the tenant root'
            - rule: "!has(self.spec.parent) || self.spec.parent == 'platform'"
              message: 'spec.parent must be "platform", the tenant root: v1 places a suborg one level below it; set it to "platform"'
            - rule: "self.metadata.name == 'platform' || has(self.spec.quota)"
              message: "spec.quota is required for a suborg, and has no default: set requests.cpu, requests.memory, pods and storage"
{{- if index $features "platform-hostname-ownership" }}
            # A suborg's default zone is <suborg>.<platform domain> (ADR 0042, ADR 0163). An
            # OpenAPI default cannot depend on the name, so a suborg that does not state that
            # zone is refused rather than given the platform's zone by the default below.
            - rule: {{ printf "self.metadata.name == 'platform' || (has(self.spec.zone) && self.spec.zone == self.metadata.name + '.%s')" .Values.platformDomain | quote }}
              message: {{ printf "spec.zone must be the suborg's default zone, <suborg>.%s: the platform zone default is for the platform organization only" .Values.platformDomain | quote }}
            # The internal zone (spec #1612) sits beside the public zone: an explicit value is inside
            # the internal domain, a suborg's is its own name under it, and with an external Gateway
            # the two zones of one organization never coincide.
            - rule: {{ printf "!has(self.spec.internalZone) || self.spec.internalZone.endsWith('.%s')" .Values.platformInternalDomain | quote }}
              message: {{ printf "spec.internalZone must be inside the internal domain %s: set it to <suborg>.%s" .Values.platformInternalDomain .Values.platformInternalDomain | quote }}
            - rule: {{ printf "self.metadata.name == 'platform' || (has(self.spec.internalZone) && self.spec.internalZone == self.metadata.name + '.%s')" .Values.platformInternalDomain | quote }}
              message: {{ printf "spec.internalZone must be the suborg's default internal zone, <suborg>.%s: the platform internal zone default is for the platform organization only" .Values.platformInternalDomain | quote }}
{{- if ne .Values.platformInternalDomain .Values.platformDomain }}
            - rule: "!has(self.spec.internalZone) || self.spec.internalZone != self.spec.zone"
              message: "spec.internalZone must differ from spec.zone: the two zones of one organization never coincide on a platform with an external Gateway"
{{- end }}
{{- end }}
          # No object here sets additionalProperties beside properties: Crossplane cannot
          # render that into a CRD ("additionalProperties and properties are mutual
          # exclusive"), and the XRD still reads Established (#2047). kore validate closes
          # every object that has properties, so an unknown field is refused there.
          properties:
            spec:
              type: object
              required: [tenant]
              properties:
                tenant:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"
                parent:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"
                # The quota of a suborg: requests for cpu and memory, a pod count and the
                # storage it may request. Required for a suborg by the rules above, with no
                # default; the platform organization carries none.
                quota:
                  type: object
                  required: [requests, pods, storage]
                  properties:
                    requests:
                      type: object
                      required: [cpu, memory]
                      properties:
                        cpu: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?m?$" }
                        memory: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?(Mi|Gi|Ti)$" }
                    pods: { type: integer, minimum: 1 }
                    storage: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?(Gi|Ti)$" }
{{- if index $features "platform-hostname-ownership" }}
                # The zone the organization owns (ADR 0042): the one place the
                # hostname-ownership constraint reads it, with no parameter list
                # beside it. It defaults to the environment's default zone,
                # <organizationId>.<platformDomain>, from the one environment field.
                zone:
                  type: string
                  default: {{ printf "%s.%s" (required "platformOrganizationId is required while platform-hostname-ownership is on" .Values.platformOrganizationId) .Values.platformDomain | quote }}
                  maxLength: 253
                  pattern: "^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\\.)+[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"
                # The internal zone (spec #1612): the name the organization owns under the internal
                # domain, beside its zone. It defaults to <platformOrganizationId>.<platformInternalDomain>;
                # a suborg states its own, under the rules above.
                internalZone:
                  type: string
                  default: {{ printf "%s.%s" (required "platformOrganizationId is required while platform-hostname-ownership is on" .Values.platformOrganizationId) (required "platformInternalDomain is required while platform-hostname-ownership is on" .Values.platformInternalDomain) | quote }}
                  maxLength: 253
                  pattern: "^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\\.)+[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"
{{- end }}
            status:
              type: object
              properties:
                conditions:
                  { type: array, x-kubernetes-preserve-unknown-fields: true }
                phase: { type: string }
