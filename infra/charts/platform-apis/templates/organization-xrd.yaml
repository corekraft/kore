apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: organizations.platform.kore.dev
spec:
  scope: Cluster
  group: platform.kore.dev
  names:
    kind: Organization
    plural: organizations
  defaultCompositionRef:
    name: organization-local
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: "self.metadata.name == 'platform'"
              message: "only the platform organization is supported"
          properties:
            spec:
              type: object
              required: [tenant]
              properties:
                tenant:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"
                parent:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"
            status:
              type: object
              properties:
                conditions:
                  { type: array, x-kubernetes-preserve-unknown-fields: true }
                phase: { type: string }
