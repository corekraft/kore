{{- $features := .Values.features | default dict }}
{{- if and (index $features "suborg-tenancy") (index $features "suborg-secret-store") }}
# Cluster-wide: the Organization composition creates each suborg's ClusterSecretStore, which is
# cluster-scoped, so Crossplane needs write access to ClusterSecretStores, and the read verbs
# its watch of the kinds it composes needs (ADR 0167, issue 1555). This is the only grant on
# that kind.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-suborg-secret-stores
  labels: { app.kubernetes.io/managed-by: Helm }
rules:
  - apiGroups: [external-secrets.io]
    resources: [clustersecretstores]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-suborg-secret-stores
  labels: { app.kubernetes.io/managed-by: Helm }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-suborg-secret-stores
subjects:
  - kind: ServiceAccount
    name: crossplane
    namespace: crossplane-system
{{- end }}
