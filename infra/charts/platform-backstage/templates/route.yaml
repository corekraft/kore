{{- /*
  HTTPS for the portal host (ADR 0042, ADR 0111, ADR 0133). kore passes
  backstageHostname, the one host the portal is served at: the shared platform
  Gateway's organization host, backstage.<organizationId>.<domain>, while
  platform-shared-gateway is on, and backstage.<domain> while it is off. The
  portal's base URL, its sign-in redirect and the Keycloak client's redirect URIs
  take the same value, so none names a host of its own.

  While platform-shared-gateway is on, kore also passes sharedGateway, and the
  route attaches to the platform Gateway in kore-system, which owns the listener
  and the certificate for that host (ADR 0133). The chart's own Gateway,
  certificate and route are then dropped: their routes have moved, so keeping
  them would leave a second owner for the same host.

  While the flag is off, the chart keeps its own Gateway, certificate and route
  for the bare platform domain, as it rendered before. Nothing renders until kore
  passes the gateway class.
*/ -}}
{{- if and .Values.gatewayClassName (not .Values.sharedGateway) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: backstage
  namespace: {{ $.Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName | quote }}
  listeners:
    - name: https
      hostname: {{ $.Values.backstageHostname | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: backstage-tls}
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: backstage-tls
  namespace: {{ $.Release.Namespace }}
spec:
  secretName: backstage-tls
  dnsNames:
    - {{ $.Values.backstageHostname | quote }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ $.Values.issuer }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - kind: Gateway
      name: backstage
  hostnames:
    - {{ $.Values.backstageHostname | quote }}
  rules:
    - backendRefs:
        - name: backstage
          port: 80
{{- end }}
{{- with .Values.sharedGateway }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage-shared
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - kind: Gateway
      name: {{ .name }}
      namespace: {{ .namespace }}
  hostnames:
    - {{ $.Values.backstageHostname | quote }}
  rules:
    - backendRefs:
        - name: backstage
          port: 80
{{- end }}
