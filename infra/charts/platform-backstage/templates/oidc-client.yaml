# Backstage's client in the platform realm (ADR 0113), owned by the Crossplane
# Keycloak provider. It replaces the Keycloak operator's KeycloakOIDCClient,
# which needed the client-admin-api:v2 preview feature and its own Secret label
# (issue 1730). The client secret is read by reference from the Secret kore
# streams into this namespace (ADR 0034), so no credential is in git. The realm
# is composed by the platform Organization; until it is Ready the Client stays
# not Ready, and the platform-backstage readiness names that reason.
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: backstage
  namespace: backstage
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: keycloak
  forProvider:
    realmId: platform
    clientId: backstage
    name: Backstage
    enabled: true
    accessType: CONFIDENTIAL
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    pkceCodeChallengeMethod: S256
    rootUrl: https://{{ .Values.backstageHostname }}
    baseUrl: https://{{ .Values.backstageHostname }}
    validRedirectUris:
      - https://{{ .Values.backstageHostname }}/oauth2/callback
      - https://{{ .Values.backstageHostname }}/api/auth/oidc/handler/frame
    clientSecretSecretRef:
      name: backstage-oidc
      key: client-secret
---
# The groups claim the sign-in resolver reads (images/backstage/src/signin.js):
# the user's Keycloak group paths, such as /platform/platform-operators, which
# become group entity refs for the operators-only permission policy. Without it
# a signed-in operator has no group and the policy denies every read.
apiVersion: openidgroup.keycloak.m.crossplane.io/v1alpha1
kind: GroupMembershipProtocolMapper
metadata:
  name: backstage-groups
  namespace: backstage
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: keycloak
  forProvider:
    realmId: platform
    clientIdRef:
      name: backstage
    name: groups
    claimName: groups
    fullPath: true
    addToIdToken: true
    addToAccessToken: true
    addToUserinfo: true
