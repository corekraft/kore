# Backstage's catalog provider lists the platform Organization and Service
# objects with the pod's own token (ADR 0111). The role can only get and list
# those two resources. The Kubernetes plugin reads the Argo CD view with this
# account too, through its own read-only role below (ADR 0180).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kore-backstage-catalog
rules:
  - apiGroups: ["platform.kore.dev"]
    resources: ["organizations", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kore-backstage-catalog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kore-backstage-catalog
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: {{ .Release.Namespace }}
---
# The Argo CD sync and rollout view (ADR 0111, ADR 0180). The Kubernetes plugin
# reads with the backstage service account's long-lived token below, and the
# permission policy lets only the platform-operators group ask. Read-only: get
# and list on Applications and Deployments, nothing else, no wildcards.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kore-backstage-argocd-view
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kore-backstage-argocd-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kore-backstage-argocd-view
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: {{ .Release.Namespace }}
---
# A long-lived token for the backstage service account, which the Kubernetes
# plugin sends as the cluster's service account token (K8S_SA_TOKEN). Bound pod
# tokens expire and Backstage reads its config once, so the token is a Secret
# the control plane fills in and does not rotate.
apiVersion: v1
kind: Secret
metadata:
  name: backstage-sa-token
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: backstage
type: kubernetes.io/service-account-token
