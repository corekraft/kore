# The platform organization's Backstage (ADR 0111) behind a sign-in proxy that
# authenticates against the platform realm (ADR 0113). Backstage binds loopback
# only, so the sole way in is the proxy, which refuses a request with no
# session; the Service names only the proxy's port. With Keycloak or the realm
# not ready the proxy cannot discover the issuer, never becomes ready, and the
# Service has no endpoint: the portal never runs open. Both secrets are read
# from the Secret kore streams (ADR 0034).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
    spec:
      serviceAccountName: backstage
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: {{ .Values.proxy.image | quote }}
          args:
            - --provider=keycloak-oidc
            - --client-id=backstage
            - --oidc-issuer-url=https://{{ required "set keycloakHostname, which kore passes from the environment's platform field" .Values.keycloakHostname }}/realms/platform
            - --redirect-url=https://backstage.{{ .Values.platformDomain }}/oauth2/callback
            - --upstream=http://127.0.0.1:7007
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --code-challenge-method=S256
            - --reverse-proxy=true
            - --pass-access-token=true
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
{{- if .Values.localCa }}
            # Keycloak's certificate comes from the local CA (ADR 0132); this adds
            # it to the roots the proxy verifies the issuer with.
            - --provider-ca-file=/etc/kore/local-ca/ca.crt
{{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-oidc
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-oidc
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
{{- if .Values.localCa }}
          volumeMounts:
            - name: local-ca
              mountPath: /etc/kore/local-ca
              readOnly: true
{{- end }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            # The image's user is the numeric 65532 (checked in its config), so
            # the kubelet can verify runAsNonRoot against it.
            runAsUser: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        - name: backstage
          image: {{ .Values.backstage.image | quote }}
          env:
            - name: APP_CONFIG_backend_listen
              value: 127.0.0.1:7007
            # The Kore image's config names localhost as its own URLs. These set
            # the portal host, which the OIDC callback and Keycloak's registered
            # redirect use.
            - name: APP_CONFIG_app_baseUrl
              value: https://backstage.{{ .Values.platformDomain }}
            - name: APP_CONFIG_backend_baseUrl
              value: https://backstage.{{ .Values.platformDomain }}
            # In-app sign-in (ADR 0113). The proxy stays in front until a live
            # run proves it; the client secret is the same Secret reference.
            - name: OIDC_METADATA_URL
              value: https://{{ required "set keycloakHostname, which kore passes from the environment's platform field" .Values.keycloakHostname }}/realms/platform/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              value: backstage
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-oidc
                  key: client-secret
            # The catalog provider calls the API server, whose certificate the
            # cluster CA signed. Node reads one extra file, so with the local CA
            # mounted it is the bundle of the local CA and the cluster CA, which
            # also lets the backend verify Keycloak behind the shared Gateway.
            - name: NODE_EXTRA_CA_CERTS
{{- if .Values.localCa }}
              value: /etc/kore/local-ca/bundle.crt
{{- else }}
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
{{- end }}
            # The Kore image's config names no database connection; these set it
            # from the database the PostgreSQL API claimed (ADR 0111).
            - name: APP_CONFIG_backend_database_connection_host
              value: backstage-db-rw
            - name: APP_CONFIG_backend_database_connection_port
              value: "5432"
            - name: APP_CONFIG_backend_database_connection_user
              valueFrom:
                secretKeyRef:
                  name: backstage-db-app
                  key: username
            - name: APP_CONFIG_backend_database_connection_password
              valueFrom:
                secretKeyRef:
                  name: backstage-db-app
                  key: password
            # One database, one schema per plugin. Backstage's default is a
            # database per plugin, which the role the claim gives it may not
            # create (issue 1700); the database is the one the PostgreSQL API
            # provisioned, and its owner may create the schemas in it.
            - name: APP_CONFIG_backend_database_pluginDivisionMode
              value: schema
            - name: APP_CONFIG_backend_database_ensureSchemaExists
              value: "true"
            - name: APP_CONFIG_backend_database_connection_database
              valueFrom:
                secretKeyRef:
                  name: backstage-db-connection
                  key: database
          # The port is loopback-only, which the kubelet cannot reach over the
          # pod address, so readiness runs inside the container. The distroless
          # image's PATH has no node: its entrypoint, /nodejs/bin/node, is named.
          readinessProbe:
            exec:
              command:
                - /nodejs/bin/node
                - -e
                - fetch("http://127.0.0.1:7007/.backstage/health/v1/readiness").then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))
            periodSeconds: 10
            timeoutSeconds: 5
{{- if .Values.localCa }}
          volumeMounts:
            - name: local-ca
              mountPath: /etc/kore/local-ca
              readOnly: true
{{- end }}
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            # The Kore-built image runs as the numeric 65532 (its Dockerfile's
            # USER), so the kubelet can verify runAsNonRoot against it.
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
{{- if .Values.localCa }}
      volumes:
        # Only the two public certificates are projected.
        - name: local-ca
          configMap:
            name: {{ .Values.localCa.configMap }}
            items:
              - key: ca.crt
                path: ca.crt
              - key: bundle.crt
                path: bundle.crt
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: backstage
  ports:
    - name: http
      port: 80
      targetPort: 4180
