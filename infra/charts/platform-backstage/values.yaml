# The database claim's portable inputs (infra/apis/postgresql). The images come
# from infra/environments/common/values/platform-backstage.yaml, so the chart
# names none.
database:
  storageSize: 1Gi
  compatibilityVersion: 17
# The GatewayClass of the portal's route is set by kore from the ingress
# feature flag, so it has no default here. The issuer is the ClusterIssuer that
# signs the portal host's certificate.
issuer: kore-local-ca
# Set by kore only while platform-keycloak-wait is on: the pod waits for the
# Keycloak realm's discovery before its proxy starts (issue 1788).
keycloakWait: false
