apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kore-gateway
  namespace: kore-system
  labels: {app.kubernetes.io/managed-by: Helm}
spec:
{{- if .Values.gateway.service.type }}
  infrastructure:
{{- if eq .Values.gateway.className "istio" }}
    parametersRef: {group: "", kind: ConfigMap, name: kore-gateway-service}
{{- else if eq .Values.gateway.className "agentgateway" }}
    parametersRef: {group: agentgateway.dev, kind: AgentgatewayParameters, name: kore-gateway-service}
{{- end }}
{{- end }}
  gatewayClassName: {{ required "set gateway.className, or render through kore, which derives it from the ingress-agentgateway feature flag" .Values.gateway.className }}
  listeners:
    - name: https
      hostname: {{ .Values.gateway.hostname | quote }}
      port: {{ .Values.gateway.port }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: {{ .Values.gateway.certificateSecret }}}
      allowedRoutes:
        namespaces: {from: All}
