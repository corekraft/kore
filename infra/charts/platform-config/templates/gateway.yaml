apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kore-gateway
  namespace: kore-system
  labels: {app.kubernetes.io/managed-by: Helm}
spec:
{{- if or .Values.gateway.service.type (include "platform-config.agentgatewayEnrolled" .) }}
  infrastructure:
{{- end }}
{{- if include "platform-config.agentgatewayEnrolled" . }}
    # Enrols only the data-plane pod in the ambient mesh (ADR 0081): agentgateway
    # copies Gateway infrastructure labels onto the generated pod, and the pod
    # runs as the ServiceAccount named after the Gateway.
    labels: {istio.io/dataplane-mode: ambient}
{{- end }}
{{- if .Values.gateway.service.type }}
{{- if eq .Values.gateway.className "istio" }}
    parametersRef: {group: "", kind: ConfigMap, name: kore-gateway-service}
{{- else if eq .Values.gateway.className "agentgateway" }}
    parametersRef: {group: agentgateway.dev, kind: AgentgatewayParameters, name: kore-gateway-service}
{{- end }}
{{- end }}
  gatewayClassName: {{ required "set gateway.className, or render through kore, which derives it from the ingress-agentgateway feature flag" .Values.gateway.className }}
  listeners:
    - name: https
      hostname: {{ required "set gateway.hostname, or render through kore, which derives it from the environment's platform.domain" .Values.gateway.hostname | quote }}
      port: {{ .Values.gateway.port }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: {{ .Values.gateway.certificateSecret }}}
      allowedRoutes:
        namespaces: {{ include "platform-config.routeNamespaces" . }}
{{- if .Values.gateway.deprecatedAlias }}
    # The former domain stays a listener beside the platform domain, on the same
    # port and with the same certificate, until a contract ticket removes it (ADR 0132).
    - name: https-alias
      hostname: {{ .Values.gateway.deprecatedAlias | quote }}
      port: {{ .Values.gateway.port }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: {{ .Values.gateway.certificateSecret }}}
      allowedRoutes:
        namespaces: {{ include "platform-config.routeNamespaces" . }}
{{- end }}
{{- if include "platform-config.sharedGateway" . }}
    # A listener holds one hostname, so the platform organization's wildcard is a
    # second HTTPS listener on the same port, with its own certificate (ADR 0132).
    - name: https-platform
      hostname: {{ required "set gateway.platformHostname, or render through kore, which derives it from the environment's platform field" .Values.gateway.platformHostname | quote }}
      port: {{ .Values.gateway.port }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: {{ .Values.gateway.platformCertificateSecret }}}
      allowedRoutes:
        namespaces: {{ include "platform-config.routeNamespaces" . }}
{{- end }}
{{- if include "platform-config.databaseRoutes" . }}
    # A TLS passthrough listener for databases reached by name: the database
    # keeps its own certificate, and a TLSRoute in the database's namespace picks
    # the backend by the name the client sends. It sits on its own port, so it
    # never shares one with the HTTPS listeners.
    - name: {{ include "platform-config.databasePortName" . }}
      hostname: {{ required "set gateway.platformHostname, or render through kore, which derives it from the environment's platform field" .Values.gateway.platformHostname | quote }}
      port: {{ .Values.gateway.database.port }}
      protocol: TLS
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces: {{ include "platform-config.routeNamespaces" . }}
{{- end }}
{{- if include "platform-config.registryByName" . }}
    # The registry keeps its own certificate, authentication and end-to-end
    # verification (ADR 0058): the Gateway never terminates its TLS. Routing is by
    # the SNI name, on the same port as the HTTPS listeners (agentgateway serves
    # both on one port, issue 1218).
    - name: {{ include "platform-config.registryListenerName" . }}
      hostname: {{ include "platform-config.registryHostname" . | quote }}
      port: {{ .Values.gateway.port }}
      protocol: TLS
      tls:
        mode: Passthrough
      allowedRoutes:
        kinds: [{kind: TLSRoute}]
        namespaces: {{ include "platform-config.routeNamespaces" . }}
{{- end }}
