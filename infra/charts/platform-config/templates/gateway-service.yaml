{{- if and .Values.gateway.service.type (eq .Values.gateway.className "istio") }}
# Istio generates the Gateway's Service and merges this overlay into it. The
# environment decides how the Service is published (an overlay that reaches the
# Gateway through a node port, say); the chart names no provider.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kore-gateway-service
  namespace: kore-system
  labels: {app.kubernetes.io/managed-by: Helm}
data:
  service: |
    spec:
      type: {{ .Values.gateway.service.type }}
      {{- if .Values.gateway.service.nodePort }}
      ports:
        - port: {{ .Values.gateway.port }}
          nodePort: {{ .Values.gateway.service.nodePort }}
      {{- end }}
{{- end }}
{{- if and .Values.gateway.service.type (eq .Values.gateway.className "agentgateway") }}
---
# agentgateway generates the Gateway's Service and merges this overlay into it,
# the same settings the Istio ConfigMap above carries, so the environment still
# decides how the Service is published.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: kore-gateway-service
  namespace: kore-system
  labels: {app.kubernetes.io/managed-by: Helm}
spec:
  service:
    spec:
      type: {{ .Values.gateway.service.type }}
      {{- if .Values.gateway.service.nodePort }}
      ports:
        - port: {{ .Values.gateway.port }}
          nodePort: {{ .Values.gateway.service.nodePort }}
      {{- end }}
{{- end }}
