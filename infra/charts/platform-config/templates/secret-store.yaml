apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secrets.storeName }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.secrets.sourceNamespace }}
      server:
        url: https://kubernetes.default.svc
        caProvider: {type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: {{ .Values.secrets.sourceNamespace }}}
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets

