gateway:
  certificateSecret: kore-local-tls
issuer:
  name: kore-local-ca
# Kore passes the environment's flags here (ADR 0077). in-cluster-ca makes
# cert-manager create the root CA the issuer above signs with, inside the
# cluster (ADR 0142). Off, the issuer and its CA Secret come from elsewhere:
# kore trust install creates local's from the mkcert root.
features:
  in-cluster-ca: false
  # acme-dns01 (ADR 0161, vps only): renders the Let's Encrypt ClusterIssuers below.
  acme-dns01: false
  # acme-issuers (ADR 0157, vps only, needs acme-dns01): adds an HTTP-01 solver to the
  # same two issuers, through the external Gateway's port 80 listener.
  acme-issuers: false
# The two ACME ClusterIssuers, rendered only while acme-dns01 is on. kore passes
# zone as the platform domain, so each issuer selects that one zone and no other.
# The token is the consumer's own cloudflare-token Secret in cert-manager, applied
# by kore secrets tokens (ADR 0161, #1969); this chart renders no Secret. No ACME
# account email is set: none is committed, so the issuers carry none.
acmeIssuers:
  # The HTTP-01 solver (ADR 0157): a Certificate that carries this label is solved
  # through the external Gateway's HTTP listener on port 80, the one route the public
  # reaches. The label is the only selector, so the solver is chosen by it.
  http01:
    labelKey: platform.kore.dev/acme-challenge
    labelValue: http01
    gateway:
      name: kore-gateway-external
      namespace: kore-system
      sectionName: http
# suborgs is the list kore reads from the Organization records; while acme-dns01 is
# on, each name renders a platform and an internal wildcard Certificate (two issuances
# per suborg, against Let's Encrypt's 50 new certificates per registered domain per 7
# days, ADR 0161). certificateIssuer is the issuer those Certificates reference: staging
# first, and production only by a later change to this value after staging is Ready.
# foreignNames is the list kore reads from the service records: each name under a domain
# the platform does not own, claimed on the external Gateway. While acme-dns01 is on, each
# renders one Certificate for that name alone, proven over HTTP-01 (ADR 0157, issue 1678).
acmeDns01:
  zone: ""
  suborgs: []
  foreignNames: []
  certificateIssuer: letsencrypt-staging
  tokenSecretName: cloudflare-token
  tokenKey: api-token
  issuers:
    - name: letsencrypt-staging
      server: https://acme-staging-v02.api.letsencrypt.org/directory
      accountKeySecretName: letsencrypt-staging-account-key
    - name: letsencrypt-production
      server: https://acme-v02.api.letsencrypt.org/directory
      accountKeySecretName: letsencrypt-production-account-key
ca:
  selfSignedIssuerName: kore-local-selfsigned
  namespace: cert-manager
  secretName: kore-local-ca-key-pair
  commonName: kore-local-ca
  # Ten years: the root outlives every certificate it signs, and trust copies
  # of its public certificate go stale when it is re-issued.
  duration: 87600h
