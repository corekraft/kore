# The platform organization's Keycloak (ADR 0113), run by the Keycloak operator.
# The image is the operator's pinned server digest, so none is set here. The
# database credentials and the bootstrap admin are read from Secrets by
# reference: kore streams the admin Secret (ADR 0034) and the platform API
# creates the database Secret, so no credential is in git. The host is the one
# kore hands the portal too, and it is advertised as an https URL: the platform
# Gateway terminates TLS and forwards plain HTTP, so Keycloak's issuer must name
# https whatever the forwarded headers say (ADR 0133). route.yaml serves the host.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-db-rw
    port: 5432
    database: app
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
  bootstrapAdmin:
    user:
      secret: keycloak-admin
  hostname:
    hostname: https://{{ required "set keycloakHostname, which kore passes from the environment's platform field" .Values.keycloakHostname }}
  http:
    httpEnabled: true
  proxy:
    headers: xforwarded
{{- $features := .Values.features | default dict }}
{{- if index $features "platform-portal" }}
  # client-admin-api:v2 is a preview feature in Keycloak 26.8.2. The operator
  # needs it to create the Backstage KeycloakOIDCClient (ADR 0113, issue 1730).
  features:
    enabled:
      - client-admin-api:v2
{{- end }}
  ingress:
    enabled: false
