# The trust authority is owned by the environment overlay
# (infra/environments/<env>/values/image-policy.yaml); kore validate checks it.
trust: {}
# Passed by kore from the environment's registry.address (ADR 0031); the policy
# glob is "<address>/**" and is never written in an overlay.
platform:
  registry:
    address: ""
  # Passed by kore from the environment's platformMirror when it declares one
  # (ADR 0044): the repository prefix of the signed platform image mirror.
  mirror:
    repository: ""
# Upstream repositories Kore deploys into application namespaces (ADR 0032):
# the Istio waypoint proxy, the CloudNativePG instance image, and the
# CloudNativePG operator image that runs as each database pod's
# bootstrap-controller init container. Exact repositories only; the chart owns this list, overlays do not.
upstreamImages:
  - "index.docker.io/istio/proxyv2**"
  - "ghcr.io/cloudnative-pg/postgresql**"
  - "ghcr.io/cloudnative-pg/cloudnative-pg**"
# The golden-path template images (ADR 0045, ADR 0046): the kore-template-images
# policy admits only this repository's images, and only under the release
# identity, while golden-path-template-admission is on. The chart owns it.
templates:
  repository: "ghcr.io/corekraft/kore/templates"
# Platform namespaces whose images the kore-upstream-images static pass covers
# (ADR 0032): istio-system runs the Istio proxy image, cnpg-system the
# CloudNativePG operator image. Each needs an entry in
# infra/catalog/gatekeeper-exemptions.yaml; kore validate checks it. The
# templates do not read this list.
staticPassNamespaces: [istio-system, cnpg-system]
