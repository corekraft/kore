# The trust authority is owned by the environment overlay
# (infra/environments/<env>/values/image-policy.yaml); kore validate checks it.
trust: {}
# Passed by kore from the environment's registry.address (ADR 0031); the policy
# glob is "<address>/**" and is never written in an overlay.
platform:
  registry:
    address: ""
# Upstream repositories Kore deploys into application namespaces (ADR 0032):
# the Istio waypoint proxy and the CloudNativePG instance image. Exact
# repositories only; the chart owns this list, overlays do not.
upstreamImages:
  - "index.docker.io/istio/proxyv2**"
  - "ghcr.io/cloudnative-pg/postgresql**"
