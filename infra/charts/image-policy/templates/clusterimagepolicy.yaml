{{- /*
One policy covers every pod container kind: the Policy Controller evaluates
containers, initContainers, and ephemeralContainers of the matched resources.
There is deliberately no spec.match: the webhook evaluates Pods and also
Deployments, Jobs, and the other pod-template kinds, and a match limited to pods
leaves those unmatched, so they are rejected as "no matching policies".
An image that matches no ClusterImagePolicy is rejected, and webhook, registry,
or signature errors deny admission (webhook failurePolicy: Fail). Namespaces are
only evaluated when carrying the Policy Controller include label; kore app up
enrolls application namespaces (ADR 0032), this chart never does. spec.mode
comes from the environment (warn first: audit before enforce).
*/ -}}
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: kore-platform-images
  labels: {app.kubernetes.io/managed-by: Helm}
spec:
  mode: {{ required "trust.mode is required (warn or enforce)" .Values.trust.mode }}
  images:
    - glob: {{ printf "%s/**" (required "platform.registry.address is required; kore passes it from registry.address" .Values.platform.registry.address) | quote }}
  authorities:
    {{- if eq .Values.trust.type "keyless" }}
    - name: release-workflow
      keyless:
        url: https://fulcio.sigstore.dev
        identities:
          {{- range .Values.trust.subjects }}
          - issuer: {{ $.Values.trust.issuer | quote }}
            subject: {{ . | quote }}
          {{- end }}
      ctlog:
        url: https://rekor.sigstore.dev
    {{- else }}
    - name: local-signing-key
      key:
        secretRef:
          name: {{ .Values.trust.keyRef.name | quote }}
          namespace: {{ .Values.trust.keyRef.namespace | quote }}
    {{- end }}
