{{- /*
The golden-path template images (ADR 0045, ADR 0046) are signed keylessly by the
release workflow and never by the environment's signing key. The policy has its
own keyless authority, templates.trust (issue 1884), separate from the platform's
trust, so a platform on key trust (local) still renders it. Its identities are
templates.trust.subjects: the exact release subjects that signed the template
lock, which kore validates (ADR 0181, image-trust.ts).

The policy exists only while the golden-path-template-admission feature flag is
on, and it starts in templates.trust.mode (warn while auditing, enforce after a
recorded live outcome). Its glob is the template repository and nothing else, so
no other image matches it.

The authority reads Sigstore bundles (signatureFormat: bundle, issue 1884): cosign
3 stores the release signature as an OCI-referrer bundle and writes no legacy
sha256-<digest>.sig tag, which the default format would look for. Policy
Controller v0.13.1 verifies a bundle only for a keyless authority.
*/ -}}
{{- $features := .Values.features | default dict }}
{{- $template := .Values.templates.trust | default dict }}
{{- if and (eq $template.type "keyless") (index $features "golden-path-template-admission") }}
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: kore-template-images
  labels: {app.kubernetes.io/managed-by: Helm}
spec:
  mode: {{ required "templates.trust.mode is required (warn or enforce)" $template.mode }}
  images:
    - glob: {{ printf "%s/**" .Values.templates.repository | quote }}
  authorities:
    - name: release-workflow
      signatureFormat: bundle
      keyless:
        url: https://fulcio.sigstore.dev
        identities:
          {{- range $template.subjects }}
          - issuer: {{ $template.issuer | quote }}
            subject: {{ . | quote }}
          {{- end }}
      ctlog:
        url: https://rekor.sigstore.dev
      {{- with $template.signaturePullSecret }}
      source:
        - signaturePullSecrets:
            - name: {{ . | quote }}
      {{- end }}
{{- end }}
