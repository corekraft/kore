apiVersion: v1
kind: Service
metadata:
  name: oci-registry
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/managed-by: Helm}
spec:
  type: NodePort
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . | quote }}
  {{- end }}
  selector: {app.kubernetes.io/name: oci-registry}
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: {{ .Values.service.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-registry
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/name: oci-registry, app.kubernetes.io/managed-by: Helm}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: oci-registry}
  template:
    metadata:
      labels: {app.kubernetes.io/name: oci-registry}
    spec:
      serviceAccountName: default
      containers:
        - name: registry
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            httpGet: {path: /v2/, port: registry}
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: oci-registry}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oci-registry
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/managed-by: Helm, platform.kore.dev/retention: Delete}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: kore-standard
  resources:
    requests: {storage: {{ .Values.storage.size }}}
