apiVersion: v1
kind: Service
metadata:
  name: oci-registry
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/managed-by: Helm}
spec:
  # Cluster-internal only: nodes and pods reach the pinned ClusterIP, and kore
  # reaches it through a port-forward (ADR 0034).
  type: ClusterIP
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . | quote }}
  {{- end }}
  selector: {app.kubernetes.io/name: oci-registry}
  ports:
    - name: registry
      port: {{ .Values.service.port }}
      targetPort: registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oci-registry
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/name: oci-registry, app.kubernetes.io/managed-by: Helm}
# Neither the registry nor the proxy calls the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-registry
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/name: oci-registry, app.kubernetes.io/managed-by: Helm}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: oci-registry}
  template:
    metadata:
      labels: {app.kubernetes.io/name: oci-registry}
      annotations:
        # nginx does not reload and a subPath mount never refreshes, so a changed
        # proxy configuration must replace the pod.
        checksum/proxy-config: {{ include (print $.Template.BasePath "/proxy-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: oci-registry
      automountServiceAccountToken: false
      {{- if index (.Values.features | default dict) "data-path-priority-class" }}
      priorityClassName: {{ .Values.priorityClass.name }}
      {{- end }}
      containers:
        # The registry listens on loopback only; the proxy is the sole way in
        # and enforces who may read and who may write (ADR 0034).
        - name: registry
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: REGISTRY_HTTP_ADDR, value: "127.0.0.1:5080"}
            # The stock config runs a debug server on :5001 on every interface;
            # keep it on loopback so /metrics never bypasses the proxy.
            - {name: REGISTRY_HTTP_DEBUG_ADDR, value: "127.0.0.1:5081"}
            {{- if index .Values.features "registry-tag-pruning" }}
            # Manifest deletes, so `kore local up` can prune old per-run tags
            # (ADR 0094). Only kore-push passes the proxy's method rules.
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
            {{- end }}
          readinessProbe:
            exec: {command: [nc, -z, 127.0.0.1, "5080"]}
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 2
          resources:
            {{- if index (.Values.features | default dict) "data-path-guaranteed-qos" }}
            requests: {cpu: {{ required "guaranteed.registry.cpu must be set in the environment's values, for example 250m, while data-path-guaranteed-qos is on" .Values.guaranteed.registry.cpu }}, memory: {{ required "guaranteed.registry.memory must be set in the environment's values, for example 512Mi, while data-path-guaranteed-qos is on" .Values.guaranteed.registry.memory }}}
            limits: {cpu: {{ .Values.guaranteed.registry.cpu }}, memory: {{ .Values.guaranteed.registry.memory }}}
            {{- else }}
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 512Mi}
            {{- end }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
        - name: proxy
          image: {{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}@{{ .Values.proxy.image.digest }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: registry
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          # A TCP check stays bounded and independent of the 401 that /v2/
          # returns without credentials.
          readinessProbe:
            tcpSocket: {port: registry}
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 2
          resources:
            {{- if index (.Values.features | default dict) "data-path-guaranteed-qos" }}
            requests: {cpu: {{ required "guaranteed.proxy.cpu must be set in the environment's values, for example 250m, while data-path-guaranteed-qos is on" .Values.guaranteed.proxy.cpu }}, memory: {{ required "guaranteed.proxy.memory must be set in the environment's values, for example 128Mi, while data-path-guaranteed-qos is on" .Values.guaranteed.proxy.memory }}}
            limits: {cpu: {{ .Values.guaranteed.proxy.cpu }}, memory: {{ .Values.guaranteed.proxy.memory }}}
            {{- else }}
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
            {{- end }}
          volumeMounts:
            - {name: proxy-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: auth, mountPath: /etc/nginx/auth, readOnly: true}
            - {name: tls, mountPath: /etc/nginx/tls, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: oci-registry}
        - name: proxy-config
          configMap: {name: oci-registry-proxy}
        # Hashes only; kore generates it and streams it through stdin.
        - name: auth
          secret: {secretName: oci-registry-auth}
        # Issued by cert-manager from the kore-owned CA (ADR 0058); the pod
        # waits here until the certificate exists, so it never serves plain HTTP.
        - name: tls
          secret: {secretName: oci-registry-tls}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oci-registry
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/managed-by: Helm, platform.kore.dev/retention: Delete}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: kore-standard
  resources:
    requests: {storage: {{ .Values.storage.size }}}
