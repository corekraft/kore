apiVersion: v1
kind: ConfigMap
metadata:
  name: oci-registry-proxy
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/managed-by: Helm}
data:
  default.conf: |
    # Authentication is HTTP basic against the Secret's htpasswd. Authorization
    # is by method: any authenticated identity may GET or HEAD, only kore-push
    # may write. $remote_user is read from the same Authorization header that
    # auth_basic verifies, so a claimed name still needs its password.
    # An empty user is deliberately not forbidden here: it must reach
    # auth_basic so clients get the 401 challenge they need to log in.
    map $request_method $kore_write {
      default 1;
      GET     0;
      HEAD    0;
    }
    map "$kore_write:$remote_user" $kore_forbidden {
      default 0;
      "~^1:(?!kore-push$).+$" 1;
    }
    server {
      listen 5000;
      server_tokens off;
      client_max_body_size 0;
      chunked_transfer_encoding on;

      if ($kore_forbidden) { return 403; }

      auth_basic "Kore registry";
      auth_basic_user_file /etc/nginx/auth/htpasswd;

      location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
      }
    }
