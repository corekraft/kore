image:
  repository: registry
  tag: 3.1.2
  digest: sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
proxy:
  # Authenticating reverse proxy in front of the registry (ADR 0034).
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.31.7-alpine3.24
    digest: sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
service:
  # Kore derives both from the environment's registry.address (ADR 0031); never
  # set them in an environment overlay. A fixed ClusterIP is pinned only when the
  # address is an in-cluster IP, because nodes cannot resolve cluster DNS.
  clusterIP: ""
  port: 5000
platform:
  registry:
    address: ""
storage:
  size: 10Gi
# The sizes each container requests and limits while data-path-guaranteed-qos is on
# (ADR 0152, issue 1593): the request equals the limit, so the pod is Guaranteed.
# An environment's values may set them; a flag-on render refuses one that omits them.
guaranteed:
  registry: { cpu: 250m, memory: 512Mi }
  proxy: { cpu: 250m, memory: 128Mi }
# The kore-owned PriorityClass this release creates, and the registry pod names,
# while data-path-priority-class is on (ADR 0152, issue 1531). The value sits below
# the built-in system classes and above the default of 0 that apps keep.
priorityClass:
  name: kore-platform-critical
  value: 1000000
tls:
  # Lifetime of the CA and the serving certificate (ADR 0058). The proxy reads
  # its certificate at start, so renewal needs a pod restart; ten years keeps
  # rotation a deliberate, documented act rather than a surprise outage.
  duration: 87600h
registryRoute:
  # Kore passes these while registry-by-name is on (ADR 0132); never set them in an
  # environment overlay. The name and the shared Gateway the route attaches to
  # come from the environment's platform field and gateway.
  hostname: ""
  gateway:
    name: ""
    namespace: ""
  # The platform-config chart's passthrough listener for the registry's name.
  sectionName: tls-registry
features:
  # Kore passes the environment's flags here (ADR 0077). Off renders the registry
  # exactly as before: it refuses manifest deletes, and no route or name is added.
  registry-tag-pruning: false
  registry-by-name: false
