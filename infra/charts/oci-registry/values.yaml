image:
  repository: registry
  tag: 3.1.2
  digest: sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
proxy:
  # Authenticating reverse proxy in front of the registry (ADR 0034).
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.31.7-alpine3.24
    digest: sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
service:
  # Kore derives both from the environment's registry.address (ADR 0031); never
  # set them in an environment overlay. A fixed ClusterIP is pinned only when the
  # address is an in-cluster IP, because nodes cannot resolve cluster DNS.
  clusterIP: ""
  port: 5000
platform:
  registry:
    address: ""
storage:
  size: 10Gi
tls:
  # Lifetime of the CA and the serving certificate (ADR 0058). The proxy reads
  # its certificate at start, so renewal needs a pod restart; ten years keeps
  # rotation a deliberate, documented act rather than a surprise outage.
  duration: 87600h
