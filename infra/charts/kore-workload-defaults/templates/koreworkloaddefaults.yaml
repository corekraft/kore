# Audit first (AGENTS.md, ADR 0072): dryrun until a recorded zero-violation audit promotes it.
# The PodDisruptionBudget rule is not here; see docs/operations/workload-defaults-admission.md.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: KoreWorkloadDefaults
metadata: { name: kore-workload-defaults }
spec:
  enforcementAction: dryrun
  match:
    kinds:
      [
        {
          apiGroups: [apps, batch],
          kinds: [Deployment, StatefulSet, DaemonSet, Job, CronJob]
        }
      ]
    # Application workloads only: namespaces bootstrap has activated (ADR 0054).
    # Platform charts are not application workloads.
    namespaceSelector:
      matchExpressions:
        - { key: platform.kore.dev/activation-generation, operator: Exists }
  parameters:
    exemptNamespaces:
      [
        kube-system,
        cert-manager,
        gatekeeper-system,
        istio-system,
        cosign-system,
        crossplane-system,
        external-secrets,
        cnpg-system,
        opentelemetry-operator-system
      ]
