# One Application per Service registration in git (ADR 0043). The sync owns the
# workload: kore installs this ApplicationSet and never applies what it
# generates. The namespace has one owner: Argo CD, through CreateNamespace,
# creates <service>--<environment> only when it is absent, so a fresh profile,
# where nothing else has made it, still syncs, and a namespace that already
# exists is left as it is. Nothing applies a registration's Service to the
# cluster, so the Service composition creates no namespace for it.
#
# With serviceRecords on (ADR 0166) the records Application applies each Service,
# so the Service composition is the one owner of the namespace and the sync sets
# no CreateNamespace. The sync still creates nothing else.
{{- /*
With templateAdmission on (golden-path-template-admission, ADR 0181)
the sync labels each namespace it creates with the admission enrolment label, so
the golden-path namespaces are enrolled by their creator. The Service composition
labels the namespaces it creates the same way. This is a template comment, so the
flag-off render is byte-identical to before.
*/ -}}
{{- $frontend := index .Values.templateImages "static-frontend" }}
{{- $bff := index .Values.templateImages "kotlin-bff" }}
{{- if and .Values.signin (not .Values.ingress) }}
{{- fail "signin needs ingress: the Keycloak client's redirect URI is the Service's HTTPS host, which the ingress parameters set" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: golden-path-services
  namespace: {{ .Values.namespace }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ .Values.repoURL | quote }}
        revision: {{ .Values.revision | quote }}
        files:
          - path: {{ .Values.registrationsPath | quote }}
  template:
    metadata:
      name: 'golden-path-{{`{{ .metadata.name }}`}}'
      labels:
        platform.kore.dev/service: '{{`{{ .metadata.name }}`}}'
        app.kubernetes.io/part-of: '{{`{{ .metadata.name }}`}}'
    spec:
      project: {{ .Values.project | quote }}
      source:
        repoURL: {{ .Values.repoURL | quote }}
        targetRevision: {{ .Values.revision | quote }}
        path: {{ .Values.workloadPath | quote }}
        helm:
          parameters:
            - name: service
              value: '{{`{{ .metadata.name }}`}}'
            - name: frontend.image
              value: {{ printf "%s@%s" $frontend.image $frontend.digest | quote }}
            - name: bff.image
              value: {{ printf "%s@%s" $bff.image $bff.digest | quote }}
            {{- if .Values.autoscaling }}
            - name: autoscaling.enabled
              value: "true"
            {{- end }}
            {{- if .Values.safetyDefaults }}
            - name: safetyDefaults
              value: "true"
            {{- end }}
            {{- if .Values.serviceIdentity }}
            - name: serviceIdentity
              value: "true"
            {{- end }}
            {{- with .Values.ingress }}
            - name: ingress.host
              value: '{{`{{ .metadata.name }}`}}.{{`{{ .spec.organization }}`}}.{{ .platformDomain }}'
            - name: ingress.gatewayClassName
              value: {{ .gatewayClassName | quote }}
            - name: ingress.issuer
              value: {{ .issuer | default "kore-local-ca" | quote }}
            {{- with .sharedGateway }}
            - name: ingress.sharedGateway.name
              value: {{ .name | quote }}
            - name: ingress.sharedGateway.namespace
              value: {{ .namespace | quote }}
            - name: ingress.sharedGateway.domain
              value: {{ .domain | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.signin }}
            - name: signin.enabled
              value: "true"
            - name: signin.issuerUri
              value: {{ .issuerUri | quote }}
            {{- end }}
            {{- if .Values.appDelivery }}
            {{- /* The release file sits at the repository root, so the path climbs out of the workload chart once per segment of workloadPath (ADR 0172). A missing release is ignored: the lock images stay. */}}
            {{- $up := "" }}
            {{- range splitList "/" .Values.workloadPath }}
            {{- $up = printf "%s../" $up }}
            {{- end }}
          ignoreMissingValueFiles: true
          valueFiles:
            - "{{ $up }}infra/environments/{{ .Values.environment }}/services/{{`{{ .metadata.name }}`}}.release.json"
            {{- end }}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{`{{ .metadata.name }}`}}--{{ .Values.environment }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        {{- if not .Values.serviceRecords }}
        syncOptions:
          - CreateNamespace=true
        {{- end }}
        {{- if or .Values.sharedGateway .Values.templateAdmission }}
        managedNamespaceMetadata:
          labels:
            {{- if .Values.sharedGateway }}
            platform.kore.dev/shared-gateway: "true"
            {{- end }}
            {{- if .Values.templateAdmission }}
            policy.sigstore.dev/include: "true"
            {{- end }}
        {{- end }}
