# The git repository and the exact commit the sync follows. There is no default
# for either: the render fails until both are set.
# repoURL: https://github.com/corekraft/kore.git
# revision: <40-character commit sha>

# The Kore environment this cluster serves; a Service's workload runs in the
# namespace <service>--<environment> that the Service composition creates.
environment: local

# Where the Service registrations live in git: one file per Service, a manifest
# of kind Service (platform.kore.dev/v1alpha1) from the platform-apis chart.
registrationsPath: infra/services/*.yaml

# The directory of those same files, which the records Application syncs to the
# cluster while serviceRecords is on (ADR 0166).
recordsPath: infra/services

# The chart each Application renders, from the same commit.
workloadPath: infra/charts/golden-path-workload

# Argo CD namespace and AppProject. The AppProject limited to operators comes
# with the hand-over; until then the built-in project is named here.
namespace: argocd
project: default

# Set by kore only while autoscaling-defaults is on (ADR 0047). The sync then
# sets autoscaling.enabled on each workload, so the workload chart renders its
# HorizontalPodAutoscaler and no replica count.
# autoscaling: true

# Set by kore only while golden-path-safety-defaults is on (ADR 0154). The sync
# then passes safetyDefaults=true to each workload, so its chart renders two
# replicas, an explicit rolling update, a PodDisruptionBudget and its own
# readiness endpoint. Off, the sync sets no such parameter.
# safetyDefaults: true

# Set by kore only while platform-portal, platform-organization-service-apis and
# platform-argocd-delivery are all on (ADR 0166). The sync then also applies each
# registration's Service record to the cluster, and the Service composition, not
# the sync, creates each app namespace. Off, the sync creates the namespace itself
# and applies no records.
# serviceRecords: true

# Set by kore only while app-delivery is on (ADR 0166, ADR 0172). The sync then gives each
# Application its service's release file, infra/environments/<environment>/services/<service>.release.json,
# as an optional values file: the workload deploys the release's digest for each component
# that has one, and a service with no release keeps its lock images. Off, the sync sets no values file.
# appDelivery: true

# Set by kore only while platform-shared-gateway is on. The sync then labels each
# app namespace it creates with the platform-owned shared-gateway label (ADR
# 0133). Off by default, so the sync sets no namespace metadata.
# sharedGateway: true

# Set by kore only while golden-path-template-admission is on (ADR 0181).
# The sync then labels each app namespace it creates with the admission enrolment
# label (ADR 0032), so the golden-path namespaces are enrolled by their creator.
# Off, no such label.
# templateAdmission: true

# The `entries` of the release's template-images.lock.json (ADR 0045), passed
# whole, for example --set-json templateImages="$(jq .entries lock.json)".
# Both entries are required and each is deployed by digest.
# templateImages:
#   static-frontend: {image: ghcr.io/..., digest: sha256:...}
#   kotlin-bff: {image: ghcr.io/..., digest: sha256:...}

# HTTPS for each Service's default host <service>.<organization>.<platformDomain>
# (ADR 0042), the same host the Service composition reports in
# status.defaultHost. Unset, the Applications carry no ingress parameter.
# ingress:
#   platformDomain: kore.internal
#   gatewayClassName: agentgateway
#   issuer: kore-local-ca   # the ClusterIssuer, default kore-local-ca
#   sharedGateway:          # kore passes it only while platform-shared-gateway is on
#     name: kore-gateway
#     namespace: kore-system
#     domain: platform.kore.internal   # <organizationId>.<platformDomain>

# Set by kore only while golden-path-signin is on (issue 1746). The sync then
# passes each workload signin.enabled and this issuer, the platform realm's OIDC
# issuer. The workload needs the ingress parameters above for its redirect URI.
# signin:
#   issuerUri: https://keycloak.kore.internal/realms/platform
