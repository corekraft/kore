apiVersion: v1
kind: ServiceAccount
metadata: {name: opa-authorizer}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa-authorizer
  labels:
    app.kubernetes.io/name: opa-authorizer
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: opa-authorizer}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opa-authorizer
        platform.kore.dev/service-account: opa-authorizer
    spec:
      serviceAccountName: opa-authorizer
      automountServiceAccountToken: false
      containers:
        - name: opa
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            - --server
            - "--addr=0.0.0.0:8181"
            - "--diagnostic-addr=0.0.0.0:8282"
            - "--set=plugins.envoy_ext_authz_grpc.addr=:9191"
            - "--set=plugins.envoy_ext_authz_grpc.path=envoy/authz/allow"
            - /policies/policy.rego
          ports:
            - {name: grpc-authz, containerPort: 9191}
            - {name: health, containerPort: 8282}
          readinessProbe:
            httpGet: {path: /health, port: health}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: health}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: policies, mountPath: /policies, readOnly: true}]
      volumes:
        - name: policies
          configMap: {name: opa-authorizer-policy}
---
apiVersion: v1
kind: Service
metadata: {name: opa-authorizer}
spec:
  selector: {app.kubernetes.io/name: opa-authorizer}
  ports:
    - {name: grpc-authz, port: 9191, targetPort: grpc-authz}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: opa-authorizer-policy}
data:
  policy.rego: |
    package envoy.authz
    default allow := false
    allow if {
      input.attributes.request.http.path == "/api/protected"
      startswith(input.attributes.source.principal, "spiffe://cluster.local/ns/reference/sa/reference-frontend")
      input.attributes.destination.principal == "spiffe://cluster.local/ns/reference/sa/reference-api"
      input.attributes.request.http.headers["x-kore-role"] == "developer"
    }
