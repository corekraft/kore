{{- /*
Default alerts for every registered Service, as one Prometheus rule file. This
chart is the only owner of these rules (ADR 0128). They are notify-only (ADR
0114): the thresholds are not measured yet, so each rule carries
enforcement: notify-only, which means the alert only tells an operator and never
blocks, rolls back or scales anything. The label does not decide delivery: the
metrics store forwards every fired alert to Grafana, and Grafana's root policy
emails it to the platform contact point when an address is set at run time.
Set, the contact point name is carried as a contact_point label for the reader.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kore-service-rules
  namespace: {{ .Release.Namespace }}
data:
  services.yaml: |
{{- if not .Values.services }}
    groups: []
{{- else }}
    groups:
{{- range .Values.services }}
{{- $namespace := printf "%s--%s" . $.Values.environment }}
      - name: kore.service.{{ . }}
        rules:
          - alert: ServiceUnavailable
            expr: sum(kube_deployment_status_replicas_available{namespace="{{ $namespace }}"}) == 0
            for: 5m
            labels:
              severity: critical
              service: {{ . }}
              enforcement: notify-only
              {{- with $.Values.alerts }}{{ with .destination }}
              contact_point: {{ . }}
              {{- end }}{{ end }}
            annotations:
              summary: Service {{ . }} has no available replica
          - alert: ServiceHighErrorRatio
            expr: sum(rate(istio_requests_total{destination_service_namespace="{{ $namespace }}",response_code=~"5.."}[5m])) / sum(rate(istio_requests_total{destination_service_namespace="{{ $namespace }}"}[5m])) > 0.05
            for: 10m
            labels:
              severity: warning
              service: {{ . }}
              enforcement: notify-only
              {{- with $.Values.alerts }}{{ with .destination }}
              contact_point: {{ . }}
              {{- end }}{{ end }}
            annotations:
              summary: Service {{ . }} answers more than 5 percent of requests with a server error
          - alert: ServiceRestartLoop
            expr: sum(increase(kube_pod_container_status_restarts_total{namespace="{{ $namespace }}"}[15m])) > 3
            for: 5m
            labels:
              severity: warning
              service: {{ . }}
              enforcement: notify-only
              {{- with $.Values.alerts }}{{ with .destination }}
              contact_point: {{ . }}
              {{- end }}{{ end }}
            annotations:
              summary: Containers of service {{ . }} restarted more than 3 times in 15 minutes
{{- end }}
{{- end }}
