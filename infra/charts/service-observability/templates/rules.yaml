{{- /*
Default alerts for every registered Service, as one Grafana alerting provisioning
file (ADR 0177). This chart is the only owner of these rules. Grafana evaluates
each rule over the Prometheus datasource and routes what fires to its one contact
point. They are notify-only (ADR 0114): the thresholds are not measured yet, so
each rule carries enforcement: notify-only, which means the alert only tells an
operator and never blocks, rolls back or scales anything. Set, the contact point
name is carried as a contact_point label for the reader. The file is JSON, which
Grafana reads as YAML, so the document is built as a value and never hand-quoted.
*/}}
{{- $groups := list }}
{{- range .Values.services }}
{{- $service := . }}
{{- $namespace := printf "%s--%s" . $.Values.environment }}
{{- $alerts := list }}
{{- /* Every expression reads a recorded series (services.yaml, ADR 0174). The error alert compares the recorded ratio with the recorded five percent cap: it fires when the ratio is above zero after the cap is taken away. */}}
{{- $alerts = append $alerts (dict "name" "ServiceUnavailable" "severity" "critical" "for" "5m" "type" "lt" "params" (list 1) "expr" (printf "kore:namespace_available_replicas{namespace=\"%s\"}" $namespace) "summary" (printf "Service %s has no available replica" $service)) }}
{{- $alerts = append $alerts (dict "name" "ServiceHighErrorRatio" "severity" "warning" "for" "10m" "type" "gt" "params" (list 0) "expr" (printf "kore:namespace_error_ratio_5m{namespace=\"%s\"} - on() group_left() kore:error_ratio_cap" $namespace) "summary" (printf "Service %s answers more than 5 percent of requests with a server error" $service)) }}
{{- $alerts = append $alerts (dict "name" "ServiceRestartLoop" "severity" "warning" "for" "5m" "type" "gt" "params" (list 3) "expr" (printf "kore:namespace_restarts_increase15m{namespace=\"%s\"}" $namespace) "summary" (printf "Containers of service %s restarted more than 3 times in 15 minutes" $service)) }}
{{- $rules := list }}
{{- range $alerts }}
{{- $labels := dict "severity" .severity "service" $service "enforcement" "notify-only" }}
{{- with $.Values.alerts }}{{- with .destination }}{{- $_ := set $labels "contact_point" . }}{{- end }}{{- end }}
{{- $uid := printf "kore-%s" (printf "%s/%s" $service .name | sha256sum | trunc 32) }}
{{- $query := dict "refId" "A" "relativeTimeRange" (dict "from" 600 "to" 0) "datasourceUid" "prometheus" "model" (dict "refId" "A" "expr" .expr "instant" true "intervalMs" 1000 "maxDataPoints" 43200) }}
{{- $threshold := dict "refId" "C" "relativeTimeRange" (dict "from" 0 "to" 0) "datasourceUid" "__expr__" "model" (dict "refId" "C" "type" "threshold" "expression" "A" "conditions" (list (dict "evaluator" (dict "type" .type "params" .params)))) }}
{{- $rules = append $rules (dict "uid" $uid "title" .name "condition" "C" "data" (list $query $threshold) "noDataState" "OK" "execErrState" "Error" "for" .for "labels" $labels "annotations" (dict "summary" .summary)) }}
{{- end }}
{{- $groups = append $groups (dict "orgId" 1 "name" (printf "kore.service.%s" $service) "folder" "Kore" "interval" "1m" "rules" $rules) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kore-service-rules
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_alert: "1"
data:
  services.yaml: |
{{ dict "apiVersion" 1 "groups" $groups | toPrettyJson | indent 4 }}
