# The Kore environment this cluster serves; a Service's workload runs in the
# namespace <service>--<environment> that the Service composition creates.
environment: local

# The names of the Services this environment serves: the registrations in
# infra/services/*.yaml (one Service manifest each) and the spec files in the
# environment's infra/environments/<env>/services (ADR 0166), each name once.
# One dashboard and one alert group are rendered for each.
services: []

# alerts.destination is the name of the platform contact point, set by kore only
# when platform-portal is on and an alert address is supplied at run time. It is
# carried as a contact_point label; this chart routes nothing, and the address
# itself is never a chart value. Unset, the rules show only in Grafana.
# alerts:
#   destination: <contact point name>
