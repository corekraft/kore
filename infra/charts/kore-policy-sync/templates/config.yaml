# Gatekeeper replication for the hostname-ownership constraint (ADR 0042). It syncs
# only what the constraint reads: HTTPRoutes, to find other claims on a host, and
# Namespaces, to read each route's organization label. It changes what the cluster
# runs (watches and an in-memory cache), not what admission decides.
apiVersion: config.gatekeeper.sh/v1alpha1
kind: Config
metadata: { name: config, namespace: gatekeeper-system }
spec:
  sync:
    syncOnly:
      - { group: gateway.networking.k8s.io, version: v1, kind: HTTPRoute }
      - { group: "", version: v1, kind: Namespace }
