{{- /*
  HTTPS for the service's default host (ADR 0042). The sync owns all three
  resources, in the service namespace: the Gateway holds the one listener for
  the host, cert-manager issues its Secret into the same namespace, and the
  route sends the BFF path to the BFF and the rest to the frontend. While
  golden-path-signin is on (signin.enabled), the BFF also gets /oauth2 and
  /login/oauth2, the paths its sign-in flow uses, and the route sets
  X-Forwarded-Proto to https, because the Gateway terminates TLS and the BFF
  builds its redirect URI from that header. The

  platform owns the Gateway in kore-system, its listeners and its certificate
  (ADR 0133). Nothing renders without ingress.host, which only the
  ApplicationSet sets.

  With platform-shared-gateway on, the ApplicationSet also sets
  ingress.sharedGateway, and a host under its domain gets a route that attaches
  to the shared Gateway (ADR 0133). That route replaces this chart's own
  Gateway, certificate and route for the host: the chart renders none of them.
  A host outside the domain, which the shared listener does not serve, keeps
  its own Gateway, certificate and route. Off, the chart renders what it
  rendered before.
*/ -}}
{{- $signinRoutes := .Values.signin.enabled }}
{{- with .Values.ingress }}
{{- $ingress := . }}
{{- $sharedRoute := false }}
{{- with .sharedGateway }}
{{- if hasSuffix (printf ".%s" .domain) $ingress.host }}
{{- $sharedRoute = true }}
{{- end }}
{{- end }}
{{- if not $sharedRoute }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $.Values.service }}
  labels:
    app.kubernetes.io/part-of: {{ $.Values.service }}
spec:
  gatewayClassName: {{ required "ingress.gatewayClassName is required with ingress.host" .gatewayClassName | quote }}
  listeners:
    - name: https
      hostname: {{ .host | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: {{ $.Values.service }}-tls}
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $.Values.service }}-tls
  labels:
    app.kubernetes.io/part-of: {{ $.Values.service }}
spec:
  secretName: {{ $.Values.service }}-tls
  dnsNames:
    - {{ .host | quote }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .issuer | default "kore-local-ca" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Values.service }}
  labels:
    app.kubernetes.io/part-of: {{ $.Values.service }}
spec:
  parentRefs:
    - kind: Gateway
      name: {{ $.Values.service }}
  hostnames:
    - {{ .host | quote }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
        {{- if $signinRoutes }}
        - path: {type: PathPrefix, value: /oauth2}
        - path: {type: PathPrefix, value: /login/oauth2}
        {{- end }}
      {{- if $signinRoutes }}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - {name: X-Forwarded-Proto, value: https}
      {{- end }}
      backendRefs:
        - {name: {{ $.Values.service }}-bff, port: 80}
    - backendRefs:
        - {name: {{ $.Values.service }}-frontend, port: 80}
{{- end }}
{{- with .sharedGateway }}
{{- if hasSuffix (printf ".%s" .domain) $ingress.host }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Values.service }}-shared
  labels:
    app.kubernetes.io/part-of: {{ $.Values.service }}
spec:
  parentRefs:
    - kind: Gateway
      name: {{ .name }}
      namespace: {{ .namespace }}
  hostnames:
    - {{ $ingress.host | quote }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
        {{- if $signinRoutes }}
        - path: {type: PathPrefix, value: /oauth2}
        - path: {type: PathPrefix, value: /login/oauth2}
        {{- end }}
      {{- if $signinRoutes }}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - {name: X-Forwarded-Proto, value: https}
      {{- end }}
      backendRefs:
        - {name: {{ $.Values.service }}-bff, port: 80}
    - backendRefs:
        - {name: {{ $.Values.service }}-frontend, port: 80}
{{- end }}
{{- end }}
{{- end }}
