{{- /* The PreSync migration hook (ADR 0171, ADR 0024; issue 1570). Argo CD runs the Job before the rollout on every sync, so the migrate command must be idempotent (the contract in values.yaml). The Job runs the BFF image the workload deploys, with its release digest when there is one, because the BFF is the component that carries the database. It reads only the DDL credential (#1584); no workload container mounts it. Off, nothing renders. */}}
{{- $migration := .Values.migration }}
{{- if $migration.enabled }}
{{- if not .Values.bff }}
{{- fail "migration needs a bff: the migration runs the BFF image, the component that carries the database; add bff.image or set migration.enabled=false" }}
{{- end }}
{{- if not $migration.command }}
{{- fail "migration.enabled needs migration.command: the migrate command the Job runs, for example [\"node\", \"--experimental-strip-types\", \"src/migrate-main.ts\"]" }}
{{- end }}
{{- if not (($migration.credentialSecret | default dict).name) }}
{{- fail "migration.enabled needs migration.credentialSecret.name: the DDL migration credential Secret that #1584 emits" }}
{{- end }}
{{- $image := .Values.bff.image }}
{{- with .Values.spec }}{{- with .components }}{{- with .bff }}{{- with .digest }}
{{- $image = printf "%s@%s" (splitList "@" $.Values.bff.image | first) . }}
{{- end }}{{- end }}{{- end }}{{- end }}
{{- $credential := $migration.credentialSecret.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Values.service }}-migrate
  labels:
    app.kubernetes.io/name: {{ $.Values.service }}-migrate
    app.kubernetes.io/part-of: {{ $.Values.service }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Values.service }}-migrate
  labels:
    app.kubernetes.io/name: {{ $.Values.service }}-migrate
    app.kubernetes.io/part-of: {{ $.Values.service }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ $migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $.Values.service }}-migrate
        app.kubernetes.io/part-of: {{ $.Values.service }}
    spec:
      serviceAccountName: {{ $.Values.service }}-migrate
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ $image | quote }}
          command: {{ toJson $migration.command }}
          env:
            - {name: PGHOST, valueFrom: {secretKeyRef: {name: {{ $credential }}, key: host}}}
            - {name: PGPORT, valueFrom: {secretKeyRef: {name: {{ $credential }}, key: port}}}
            - {name: PGDATABASE, valueFrom: {secretKeyRef: {name: {{ $credential }}, key: database}}}
            - {name: PGUSER, valueFrom: {secretKeyRef: {name: {{ $credential }}, key: username}}}
            - {name: PGSSLMODE, valueFrom: {secretKeyRef: {name: {{ $credential }}, key: sslmode}}}
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: {{ $credential }}, key: password}}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
{{- end }}
