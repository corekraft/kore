{{- /* Probe paths: the frontend's /healthz (templates/static-frontend/nginx.conf) and the BFF's actuator health. Both listen on 8080. The startupProbe allows up to 5 minutes (periodSeconds 5 x failureThreshold 60) for a slow JVM start, so liveness cannot restart a container that has not yet started. */}}
{{- $autoscaling := .Values.autoscaling }}
{{- $signin := .Values.signin }}
{{- $safety := .Values.safetyDefaults }}
{{- $rollout := .Values.rolloutDefaults }}
{{- if $safety }}
{{- if le (int $rollout.terminationGracePeriodSeconds) (int $rollout.preStopSleepSeconds) }}
{{- fail "rolloutDefaults.terminationGracePeriodSeconds must be longer than rolloutDefaults.preStopSleepSeconds, so a pod is not killed during its preStop sleep; raise terminationGracePeriodSeconds" }}
{{- end }}
{{- end }}
{{- if $signin.enabled }}
{{- if not .Values.ingress }}
{{- fail "signin.enabled needs ingress.host: the Keycloak client's redirect URI is the Service's HTTPS host; the golden-path ApplicationSet sets it from the registration" }}
{{- end }}
{{- if not $signin.issuerUri }}
{{- fail "signin.enabled needs signin.issuerUri, the platform realm's OIDC issuer; kore passes it while golden-path-signin is on" }}
{{- end }}
{{- end }}
{{- if $autoscaling.enabled }}
{{- if lt (int $autoscaling.minReplicas) 2 }}
{{- fail "autoscaling.minReplicas must be at least 2 so one pod can be lost or drained without an outage; raise it or set autoscaling.enabled=false" }}
{{- end }}
{{- if lt (int $autoscaling.maxReplicas) (int $autoscaling.minReplicas) }}
{{- fail "autoscaling.maxReplicas must not be below autoscaling.minReplicas; raise maxReplicas" }}
{{- end }}
{{- if not ((.Values.resources.requests | default dict).cpu) }}
{{- fail "autoscaling.enabled needs resources.requests.cpu: the autoscaler computes CPU utilisation against the request; set resources.requests.cpu (for example 100m) or set autoscaling.enabled=false" }}
{{- end }}
{{- end }}
{{- range $name, $path := dict "frontend" "/healthz" "bff" "/actuator/health" }}
{{- $workload := index $.Values $name }}
{{- /* The BFF keeps its sign-in session in memory, so a callback that lands on another pod loses it. While sign-in is on the BFF runs as one pod with no autoscaler, until a shared session store lands; the frontend keeps its autoscaling. */}}
{{- $singleBff := and $signin.enabled (eq $name "bff") }}
{{- /* With safetyDefaults the BFF's probes read its own readiness and liveness health groups (ADR 0154); the frontend keeps its health path for both. */}}
{{- $readinessPath := $path }}
{{- $livenessPath := $path }}
{{- if and $safety (eq $name "bff") }}
{{- $readinessPath = "/actuator/health/readiness" }}
{{- $livenessPath = "/actuator/health/liveness" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Values.service }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $.Values.service }}-{{ $name }}
    app.kubernetes.io/part-of: {{ $.Values.service }}
spec:
  {{- if or (not $autoscaling.enabled) $singleBff }}
  replicas: {{ if and $safety (not $singleBff) }}2{{ else }}1{{ end }}
  {{- end }}
  {{- if $safety }}
  minReadySeconds: {{ $rollout.minReadySeconds }}
  progressDeadlineSeconds: {{ $rollout.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Values.service }}-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $.Values.service }}-{{ $name }}
        app.kubernetes.io/part-of: {{ $.Values.service }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if $safety }}
      terminationGracePeriodSeconds: {{ $rollout.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if and $signin.enabled (eq $name "bff") }}
      {{- /* The JVM does not trust the cluster's local CA, so Spring's discovery of the Keycloak issuer fails PKIX path building. A same-image init container builds a truststore of the JDK roots plus the CA into an emptyDir; only ca.crt is mounted, never tls.key. */}}
      initContainers:
        - name: truststore
          image: {{ $workload.image | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              cp "$JAVA_HOME/lib/security/cacerts" /truststore/cacerts
              chmod u+w /truststore/cacerts
              keytool -importcert -noprompt -alias kore-local-ca -file /ca/ca.crt -keystore /truststore/cacerts -storepass changeit
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: truststore, mountPath: /truststore}
            - {name: bff-ca, mountPath: /ca, readOnly: true}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $workload.image | quote }}
          ports:
            - name: http
              containerPort: 8080
          {{- if and $signin.enabled (eq $name "bff") }}
          env:
            - name: GOLDEN_PATH_SIGNIN
              value: "true"
            - name: OIDC_ISSUER_URI
              value: {{ $signin.issuerUri | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ printf "golden-path-%s" $.Values.service | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-oidc" $.Values.service }}
                  key: clientSecret
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
            - name: JAVA_TOOL_OPTIONS
              value: "-Djavax.net.ssl.trustStore=/truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
          volumeMounts:
            - {name: truststore, mountPath: /truststore, readOnly: true}
          {{- end }}
          {{- if $autoscaling.enabled }}
          resources:
            requests:
              cpu: {{ $.Values.resources.requests.cpu | quote }}
          {{- end }}
          {{- if $safety }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $rollout.preStopSleepSeconds }}
          {{- end }}
          startupProbe:
            httpGet: { path: {{ $path }}, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: {{ $readinessPath }}, port: http }
          livenessProbe:
            httpGet: { path: {{ $livenessPath }}, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      {{- if and $signin.enabled (eq $name "bff") }}
      volumes:
        - name: truststore
          emptyDir: {}
        - name: bff-ca
          secret:
            secretName: {{ $.Values.service }}-bff-ca
            items:
              - {key: ca.crt, path: ca.crt}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Values.service }}-{{ $name }}
  labels:
    app.kubernetes.io/part-of: {{ $.Values.service }}
spec:
  selector:
    app.kubernetes.io/name: {{ $.Values.service }}-{{ $name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if $safety }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $.Values.service }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $.Values.service }}-{{ $name }}
    app.kubernetes.io/part-of: {{ $.Values.service }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Values.service }}-{{ $name }}
{{- end }}
{{- if and $autoscaling.enabled (not $singleBff) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $.Values.service }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $.Values.service }}-{{ $name }}
    app.kubernetes.io/part-of: {{ $.Values.service }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $.Values.service }}-{{ $name }}}
  minReplicas: {{ $autoscaling.minReplicas }}
  maxReplicas: {{ $autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
{{- end }}
{{- if $signin.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $.Values.service }}-bff-ca
  labels:
    app.kubernetes.io/part-of: {{ $.Values.service }}
spec:
  secretName: {{ $.Values.service }}-bff-ca
  dnsNames:
    - {{ $.Values.ingress.host | quote }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ $.Values.ingress.issuer | default "kore-local-ca" }}
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: {{ printf "golden-path-%s" $.Values.service }}
  labels:
    app.kubernetes.io/part-of: {{ $.Values.service }}
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: keycloak
  forProvider:
    realmId: platform
    clientId: {{ printf "golden-path-%s" $.Values.service }}
    name: {{ printf "%s golden path" $.Values.service | quote }}
    enabled: true
    accessType: CONFIDENTIAL
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: {{ printf "https://%s" $.Values.ingress.host }}
    baseUrl: {{ printf "https://%s" $.Values.ingress.host }}
    validRedirectUris:
      - {{ printf "https://%s/login/oauth2/code/golden-path" $.Values.ingress.host }}
  writeConnectionSecretToRef:
    name: {{ printf "%s-oidc" $.Values.service }}
{{- end }}
