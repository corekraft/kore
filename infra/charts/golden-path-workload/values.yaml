# Off by default. The golden-path ApplicationSet turns it on with the
# autoscaling.enabled parameter while autoscaling-defaults is on (ADR 0047). Then
# each Deployment carries no replica count and its HorizontalPodAutoscaler is the
# only owner of it, so Argo CD needs no ignore.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# The CPU request the utilisation target is measured against. Rendered only while
# autoscaling is on, so the flag-off render is unchanged.
resources:
  requests:
    cpu: 100m

# Set by the golden-path ApplicationSet only while golden-path-signin is on
# (issue 1746). Then the BFF gets its sign-in variables, the workload renders one
# Keycloak client for its Service, and the client secret is read from the
# connection Secret that client writes. It also renders a cert-manager
# Certificate whose Secret carries the local CA and a truststore init container,
# so the BFF's JVM trusts the Keycloak issuer (issue 1824). Off, nothing of it
# renders. The BFF's sign-in session is in memory, so while sign-in is on the BFF
# runs as one pod with no autoscaler (it gives up its high availability and
# scale-out) until a shared session store lands; the frontend keeps autoscaling.
signin:
  enabled: false

# Set by the golden-path ApplicationSet only while golden-path-safety-defaults is
# on (ADR 0154). Then each workload renders two replicas (the BFF keeps one while
# sign-in is on, issue 1747), an explicit RollingUpdate with maxUnavailable 0 and
# maxSurge 1, a PodDisruptionBudget with maxUnavailable 1, the BFF's own readiness
# and liveness health groups, and the settings below. Off, every render is the
# render it was before.
safetyDefaults: false

# Set by the golden-path ApplicationSet only while golden-path-service-identity is
# on (issue 1551). Then the chart renders a Service and a ServiceAccount named
# after the service, and each Deployment runs as that account with
# automountServiceAccountToken: false. Off, every render is the render it was
# before.
serviceIdentity: false

# The numbers of the safety defaults, rendered only while safetyDefaults is on.
# They are implementation defaults, not owner decisions. minReadySeconds is how
# long a new pod must stay ready before the rollout counts it; the progress
# deadline is how long a rollout may make no progress before it is failed; the
# preStop sleep lets the gateway drop a pod's endpoint before SIGTERM, and the
# termination grace period must be longer than it.
rolloutDefaults:
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  preStopSleepSeconds: 10
  terminationGracePeriodSeconds: 30

# The PreSync migration hook (ADR 0171, issue 1570). While enabled, a Job runs the migrate
# command from the BFF image before the rollout, as the DDL credential below, so a failed
# migration fails the sync and the old pods keep serving. Nothing sets enabled yet: the
# ApplicationSet passes it when the credential Secret exists (#1584). Off, nothing renders.
migration:
  enabled: false
  # The migrate command, the Job's entrypoint. Required while enabled; the reference app
  # runs ["node", "--experimental-strip-types", "src/migrate-main.ts"].
  command: []
  # The DDL migration credential Secret (#1584). The Job reads the connection keys host,
  # port, database, username and sslmode, and the password from password, of this Secret.
  credentialSecret:
    name: ""
  activeDeadlineSeconds: 600
  # The contract every migrate command holds (ADR 0024, ADR 0171): the run takes an advisory
  # lock and records its ids in schema_migrations, so a rerun or a concurrent run is safe.
  # The schema pins both values.
  contract:
    advisoryLock: true
    migrationsTable: schema_migrations

# The spec of the service's release file (ADR 0166, ADR 0172), passed as an optional values
# file by the golden-path ApplicationSet only while app-delivery is on. A component with a
# digest here deploys that digest on its lock image's repository; a component without one,
# and a service with no release, keep the lock image. The release file is the source; do not
# set this by hand. Off, no release is passed and nothing here is read.
# spec: {}
