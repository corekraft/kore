# The AppProject for the configuration-phase releases (ADR 0043). It admits only
# the platform registry's charts, each by its oci:// URL exactly as its
# Application names it, and the namespaces those releases live in. Only the
# platform operators' group may change it or its Applications.
{{- $repos := dict }}
{{- $spaces := dict }}
{{- range $name, $entry := .Values.charts }}
{{- $_ := set $repos (printf "oci://%s" $entry.chart) true }}
{{- $_ := set $spaces (required (printf "namespaces.%s is required" $name) (index $.Values.namespaces $name)) true }}
{{- end }}
{{- /* cert-manager's cluster resource namespace holds the CA Secret and CA Certificate that kore-local-tls renders with in-cluster-ca on (ADR 0142). */}}
{{- $_ := set $spaces "cert-manager" true }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.project }}
  namespace: {{ .Values.namespace }}
spec:
  description: Platform configuration handed over from Helm, delivered by chart digest
  sourceRepos:
    {{- range $repo := keys $repos | sortAlpha }}
    - {{ $repo | quote }}
    {{- end }}
  destinations:
    {{- range $space := keys $spaces | sortAlpha }}
    - server: https://kubernetes.default.svc
      namespace: {{ $space | quote }}
    {{- end }}
  # Exactly the cluster-scoped kinds the argocd-owned components render with
  # every flag on (an integration spec renders them and fails when one is
  # missing or a wildcard appears). A new
  # cluster-scoped kind in a handed-over chart is added here deliberately.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: apiextensions.crossplane.io
      kind: CompositeResourceDefinition
    - group: apiextensions.crossplane.io
      kind: Composition
    - group: templates.gatekeeper.sh
      kind: ConstraintTemplate
    {{- range $kind := list "KoreContainerSecurity" "KoreHostnameOwnership" "KoreImageDigest" "KoreMeshEnrollment" "KoreRBAC" "KoreRetention" "KoreSecrets" "KoreWorkloadIdentity" }}
    - group: constraints.gatekeeper.sh
      kind: {{ $kind }}
    {{- end }}
  roles:
    - name: operators
      description: Platform operators change and sync the configuration
      groups:
        - {{ .Values.operatorsGroup | quote }}
      policies:
        - p, proj:{{ .Values.project }}:operators, applications, *, {{ .Values.project }}/*, allow
