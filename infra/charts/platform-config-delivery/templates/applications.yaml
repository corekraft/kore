# One Application per handed-over release (ADR 0043). Each renders the release's
# chart as an OCI source from the platform registry at the digest the chart lock
# records (Argo CD accepts a digest as an oci:// targetRevision, but not as a
# Helm chart's semver constraint), with the Helm release's own name and
# namespace, so Argo CD adopts the resources Helm created. The handover deletes
# nothing: no prune, no cascade finalizer (deleting an Application leaves its
# resources), no replace. The namespace has one owner: Argo CD, through
# CreateNamespace, creates a release's namespace only when it is absent, so a
# namespace Helm already made is left as it is, and kore never creates a
# namespace for a handed-over release. Helm's release secret stays as an inert
# record; kore never uninstalls it and, with the flag on, never runs Helm on
# these releases again.
#
# Each release takes the environment values the Helm path gives it
# (releaseValues.<release>: the text of its values files in order, which kore
# reads from the repository). Helm parses and merges them here, a later file
# overriding an earlier one key by key, and the Application carries the result
# as helm.valuesObject, so Argo CD renders the chart as `helm upgrade --values`
# would. The values are desired state in the repository: no secret is among
# them, and kore passes none. The gateway class and the platform domain stay
# parameters, which Argo CD applies over the values.
{{- range $name, $entry := .Values.charts }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    platform.kore.dev/release: {{ $name }}
spec:
  project: {{ $.Values.project | quote }}
  source:
    repoURL: {{ printf "oci://%s" $entry.chart | quote }}
    path: "."
    targetRevision: {{ $entry.digest | quote }}
    helm:
      releaseName: {{ $name | quote }}
      {{- with index ($.Values.releaseValues | default dict) $name }}
      {{- $merged := dict }}
      {{- range $position, $text := . }}
      {{- $parsed := fromYaml $text }}
      {{- if hasKey $parsed "Error" }}
      {{- fail (printf "releaseValues.%s[%d] is not valid YAML: %s" $name $position $parsed.Error) }}
      {{- end }}
      {{- $merged = mergeOverwrite $merged $parsed }}
      {{- end }}
      valuesObject: {{ toJson $merged }}
      {{- end }}
      {{- if eq $name "kore-platform-config" }}
      parameters:
        - name: "gateway.className"
          value: {{ $.Values.gatewayClassName | quote }}
        - name: "gateway.hostname"
          value: {{ $.Values.platformDomain | quote }}
        - name: "gateway.platformHostname"
          value: {{ $.Values.platformHostname | quote }}
      {{- else if eq $name "kore-local-tls" }}
      parameters:
        - name: "gateway.hostname"
          value: {{ $.Values.platformDomain | quote }}
      {{- else if and (eq $name "kore-postgresql-api") (or $.Values.databaseRoutes $.Values.serviceClassInstances $.Values.databaseRoleSplit) }}{{- /* With databaseRoleSplit on, the composition declares the DDL and DML roles beside the app role (ADR 0171); the comment below is unchanged so the render without it stays byte-identical. */}}
      # With database-routes on, the composition's derived host, certificate and
      # route need the flag, the platform domain, the organization identifier and
      # the Gateway the routes attach to (ADR 0137, ADR 0139). With
      # serviceClassInstances on, the composition derives its instances and sizing
      # from the claim's serviceClass (ADR 0154).
      parameters:
        {{- if $.Values.databaseRoutes }}
        - name: "databaseRoutes"
          value: "true"
        - name: "platformDomain"
          value: {{ $.Values.platformDomain | quote }}
        - name: "organizationId"
          value: {{ $.Values.organizationId | quote }}
        - name: "gateway.name"
          value: {{ required "set gatewayName, which kore passes from the environment's gateway, to route databases by name" $.Values.gatewayName | quote }}
        - name: "gateway.namespace"
          value: {{ required "set gatewayNamespace, which kore passes from the environment's gateway, to route databases by name" $.Values.gatewayNamespace | quote }}
        {{- end }}
        {{- if $.Values.serviceClassInstances }}
        - name: "serviceClassInstances"
          value: "true"
        {{- end }}
        {{- if $.Values.databaseRoleSplit }}
        - name: "databaseRoleSplit"
          value: "true"
        {{- end }}
      {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ required (printf "namespaces.%s is required" $name) (index $.Values.namespaces $name) | quote }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
{{- end }}
