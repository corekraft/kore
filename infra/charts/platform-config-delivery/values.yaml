# The `entries` of the release's platform-charts.lock.json (ADR 0044), passed
# whole, for example --set-json charts="$(jq .entries platform-charts.lock.json)".
# There is no default: the render fails until every handed-over release has an
# entry, and each is deployed by its signed digest, never by version or tag.
# charts:
#   opa-authorizer: {chart: ghcr.io/corekraft/kore/charts/opa-authorizer, version: ..., digest: sha256:...}

# The namespace of each release, read from the catalog by the caller, so the
# catalog stays the one owner of where a release lives. No default.
# namespaces:
#   opa-authorizer: opa-system

# The GatewayClass kore-platform-config renders, which kore derives from the
# ingress feature flag and so passes in. No default.
# gatewayClassName: istio

# The environment's platform domain (platform.domain), which kore passes in. The
# delivered kore-platform-config and kore-local-tls take it as gateway.hostname
# because their charts hold no default. No default.
# platformDomain: kore.local

# The text of each release's environment values files, in order, which kore
# reads from the repository so Argo CD renders a release with the values the
# Helm path gives it. Optional: a release with none takes the chart's defaults.
# releaseValues:
#   kore-platform-config: ["gateway:\n  port: 8443\n"]

# Argo CD namespace, the AppProject, and the Keycloak group that alone may
# change it (ADR 0043).
namespace: argocd
project: platform-configuration
operatorsGroup: platform-operators
