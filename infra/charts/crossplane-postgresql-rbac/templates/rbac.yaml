# Cluster-wide: composing CloudNativePG Clusters needs no Secret access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-postgresql-composition
  labels: {app.kubernetes.io/managed-by: Helm}
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters/status]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-postgresql-composition
  labels: {app.kubernetes.io/managed-by: Helm}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-postgresql-composition
subjects:
  - kind: ServiceAccount
    name: crossplane
    namespace: crossplane-system
---
# The Secret permission set only. It is deliberately never bound here: kore app
# up binds it with a RoleBinding in each application namespace it activates, so
# Crossplane cannot read Secrets in kore-system (ADR 0061).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-postgresql-secrets
  labels: {app.kubernetes.io/managed-by: Helm}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, patch, delete]
