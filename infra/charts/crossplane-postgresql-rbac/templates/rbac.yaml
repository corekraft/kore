# Cluster-wide: composing CloudNativePG Clusters needs no Secret access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-postgresql-composition
  labels: {app.kubernetes.io/managed-by: Helm}
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters/status]
    verbs: [get]
{{- if .Values.databaseRoutes }}
  # With database-routes on, the composition asks the local CA for each
  # database's server certificate (ADR 0137). No Secret rule: cert-manager writes
  # that Secret and CloudNativePG reads it in the database's own namespace.
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch, create, update, patch, delete]
  # And it composes one TLS route per database in the database's own namespace
  # (ADR 0139). No ReferenceGrant rule: a route reaches its own namespace only.
  - apiGroups: [gateway.networking.k8s.io]
    resources: [tlsroutes]
    verbs: [get, list, watch, create, update, patch, delete]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-postgresql-composition
  labels: {app.kubernetes.io/managed-by: Helm}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-postgresql-composition
subjects:
  - kind: ServiceAccount
    name: crossplane
    namespace: crossplane-system
---
# The Secret permission set only. It is deliberately never bound here: kore app
# up binds it with a RoleBinding in each application namespace it activates, so
# Crossplane cannot read Secrets in kore-system (ADR 0061).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-postgresql-secrets
  labels: {app.kubernetes.io/managed-by: Helm}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, patch, delete]
