# Secret access is bound per application namespace by `kore app up`, so the chart
# takes no Secret value. databaseRoutes is set by kore only while database-routes
# is on (ADR 0137); off, the composition role keeps its CloudNativePG rules alone.
databaseRoutes: false
# databaseRoleSplit is set by kore only while database-role-split is on (ADR 0171): the
# composition then creates each role's password generator and ExternalSecret.
databaseRoleSplit: false
