apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgresqlinstance-local
  labels: { platform.kore.dev/provider: local }
spec:
  compositeTypeRef:
    { apiVersion: platform.kore.dev/v1alpha1, kind: PostgreSQLInstance }
  mode: Pipeline
  pipeline:
    - step: compose-cloudnative-pg
      functionRef: { name: function-go-templating }
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $images := dict "16" "ghcr.io/cloudnative-pg/postgresql:16.4@sha256:99be063781d171d3971089b49c992706bdab9ccbd2b57cdf126c7542773aedfe" "17" "ghcr.io/cloudnative-pg/postgresql:17.4@sha256:3c0ba08ea353c9705a755c113e4ae395be76553e0ed68076e5410cb09b9d17d9" "18" "ghcr.io/cloudnative-pg/postgresql:18.4@sha256:6138f19539304b585c6cafd1af82ca407f184139459a8e06f0880df4556d3588" }}
            apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: database
              labels:
                platform.kore.dev/retention: {{ .observed.composite.resource.spec.retentionPolicy }}
            spec:
              instances: 1
              inheritedMetadata:
                labels:
                  platform.kore.dev/retention: {{ .observed.composite.resource.spec.retentionPolicy }}
                  istio.io/dataplane-mode: none
              imageName: {{ index $images (.observed.composite.resource.spec.compatibilityVersion | int | toString) }}
              storage:
                size: {{ .observed.composite.resource.spec.storageSize }}
                storageClass: {{ if eq .observed.composite.resource.spec.retentionPolicy "Retain" }}kore-retained{{ else }}kore-standard{{ end }}
              bootstrap: {initdb: {database: app, owner: app}}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ .observed.composite.resource.spec.connectionSecretName }}
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                app.kubernetes.io/part-of: {{ .observed.composite.resource.metadata.namespace }}
            type: Opaque
            stringData:
              host: {{ .observed.composite.resource.metadata.name }}-rw
              port: "5432"
              database: app
              username: app
              passwordSecretRef: {{ .observed.composite.resource.metadata.name }}-app
              sslmode: require
    - step: project-status
      functionRef: { name: function-go-templating }
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $phase := "" }}
            {{- $reason := "" }}
            {{- with .observed.resources }}{{ with .database }}{{ with .resource.status }}
            {{- $phase = .phase | default "" }}
            {{- $reason = .phaseReason | default "" }}
            {{- end }}{{ end }}{{ end }}
            apiVersion: platform.kore.dev/v1alpha1
            kind: PostgreSQLInstance
            status:
              phase: {{ $phase | quote }}
              failureReason: {{ $reason | quote }}
              host: {{ .observed.composite.resource.metadata.name }}-rw
              port: 5432
              endpoint: {{ .observed.composite.resource.metadata.name }}-rw:5432
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: DatabaseHealthy
                status: {{ if eq $phase "Cluster in healthy state" }}"True"{{ else }}"False"{{ end }}
                reason: {{ if eq $phase "Cluster in healthy state" }}Healthy{{ else if $reason }}Failed{{ else }}Provisioning{{ end }}
                message: {{ $reason | default $phase | quote }}
                target: CompositeAndClaim
    - step: mark-ready
      functionRef: { name: function-auto-ready }
