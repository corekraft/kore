# The PostgreSQL platform API. Off, the chart renders the definition and the local
# composition exactly as they were (compositions/local.yaml). database-routes sets
# the three values below; kore passes them only while that flag is on (ADR 0137).
databaseRoutes: false
# Whether the composition derives each database's CloudNativePG instances and sizing
# from its serviceClass: standard two instances with the disruption budget, development
# one without; switchover; a memory request equal to the limit (ADR 0154). kore sets it
# only while postgresql-service-class-instances is on; off renders one instance as before.
serviceClassInstances: false
# Whether the composition declares a DDL and a DML role beside the app role, their passwords
# generated and refreshed by External Secrets and reloaded by CloudNativePG (ADR 0171). kore sets
# it only while database-role-split is on; off renders the composition as before.
databaseRoleSplit: false
# The rotation period of each role's generated password. External Secrets regenerates the
# password at this period and CloudNativePG reloads the role. Used only with databaseRoleSplit.
databaseRoles:
  rotationPeriod: 720h
# The environment's platform.domain and platform.organizationId, which kore passes.
# No default: a database route needs them, and the chart refuses to render without.
platformDomain: ""
organizationId: ""
# The ClusterIssuer that signs each database's server certificate: the local CA.
issuer: { name: kore-local-ca }
# The Gateway a database's TLS route attaches to, which kore passes from the
# environment's gateway while database-routes is on. No default for the name and
# namespace: the route needs them, and the chart refuses to render without. The
# section is the listener the platform's Gateway names for databases (ADR 0136).
gateway: { name: "", namespace: "", sectionName: postgres }
