kind: Suite
apiVersion: test.gatekeeper.sh/v1alpha1
tests:
  - name: rbac
    template: ../templates/korerbac.yaml
    constraint: ../constraints/korerbac.yaml
    cases:
      - {name: rejects-wildcard-verbs, object: objects/rbac-wildcard-verbs.yaml, assertions: [{violations: 1}]}
      - {name: rejects-wildcard-resources, object: objects/rbac-wildcard-resources.yaml, assertions: [{violations: 1}]}
      - {name: accepts-scoped-role, object: objects/rbac-scoped.yaml, assertions: [{violations: 0}]}
      - {name: exempts-system-namespace-roles, object: objects/rbac-wildcard-exempt.yaml, assertions: [{violations: 0}]}
      - {name: rejects-cluster-admin-clusterrolebinding-to-service-account, object: objects/rbac-crb-admin-sa.yaml, assertions: [{violations: 1}]}
      - {name: rejects-cluster-admin-rolebinding-to-service-account, object: objects/rbac-rb-admin-sa.yaml, assertions: [{violations: 1}]}
      - {name: accepts-view-binding-to-service-account, object: objects/rbac-crb-view-sa.yaml, assertions: [{violations: 0}]}
      - {name: ignores-cluster-admin-bound-to-users, object: objects/rbac-crb-admin-user.yaml, assertions: [{violations: 0}]}
      - {name: exempts-system-service-account-bindings, object: objects/rbac-crb-admin-exempt-sa.yaml, assertions: [{violations: 0}]}
      - {name: rejects-signing-namespace-role-reading-all-secrets, object: objects/rbac-signing-role-secrets-all.yaml, assertions: [{violations: 1, message: signing key}]}
      - {name: rejects-role-naming-the-signing-key, object: objects/rbac-signing-role-named.yaml, assertions: [{violations: 1, message: signing key}]}
      - {name: accepts-the-signing-path-role, object: objects/rbac-signing-role-allowed.yaml, assertions: [{violations: 0}]}
      - {name: accepts-signing-namespace-role-for-another-secret, object: objects/rbac-signing-role-other-secret.yaml, assertions: [{violations: 0}]}
      - {name: rejects-clusterrole-reading-secrets-when-bound-cluster-wide-to-a-developer, object: objects/rbac-clusterrole-secrets.yaml, inventory: [objects/inv-crb-dev-secrets-user.yaml], assertions: [{violations: 1, message: signing key}]}
      - {name: accepts-allowlisted-controller-clusterrole, object: objects/rbac-clusterrole-secrets-allowed.yaml, assertions: [{violations: 0}]}
      - {name: accepts-clusterrole-without-secret-access, object: objects/rbac-clusterrole-pods.yaml, assertions: [{violations: 0}]}
      - {name: accepts-secret-reading-role-outside-the-signing-namespace, object: objects/rbac-role-secrets-app-namespace.yaml, assertions: [{violations: 0}]}
      - {name: rejects-secret-reading-builtin-role-in-signing-namespace-for-developers, object: objects/rbac-rb-edit-signing-namespace-user.yaml, assertions: [{violations: 1, message: signing key}]}
      - {name: accepts-bootstrap-group-binding-in-signing-namespace, object: objects/rbac-rb-edit-signing-namespace-bootstrap.yaml, assertions: [{violations: 0}]}
      - {name: accepts-edit-binding-in-an-application-namespace, object: objects/rbac-rb-edit-app-namespace.yaml, assertions: [{violations: 0}]}
      - {name: rejects-cluster-wide-edit-binding-for-developers, object: objects/rbac-crb-edit-user.yaml, assertions: [{violations: 1, message: signing key}]}
      - {name: accepts-crossplane-secret-role-bound-per-application-namespace, object: objects/rbac-crossplane-secrets-clusterrole.yaml, assertions: [{violations: 0}]}
      - {name: accepts-crossplane-rolebinding-in-an-application-namespace, object: objects/rbac-crossplane-rb-app-namespace.yaml, assertions: [{violations: 0}]}
      - {name: rejects-crossplane-secret-role-bound-cluster-wide, object: objects/rbac-crossplane-crb-secrets.yaml, assertions: [{violations: 1, message: signing key}]}
      - {name: rejects-crossplane-secret-role-bound-in-the-signing-namespace, object: objects/rbac-crossplane-rb-signing-namespace.yaml, assertions: [{violations: 1, message: signing key}]}
      - {name: accepts-crossplane-cluster-wide-composition-binding, object: objects/rbac-crossplane-crb-composition.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-cert-manager-cainjector, object: objects/rbac-excluded-cert-manager-cainjector.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-cert-manager-controller-issuers, object: objects/rbac-excluded-cert-manager-controller-issuers.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-cert-manager-controller-clusterissuers, object: objects/rbac-excluded-cert-manager-controller-clusterissuers.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-cert-manager-controller-certificates, object: objects/rbac-excluded-cert-manager-controller-certificates.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-cert-manager-controller-orders, object: objects/rbac-excluded-cert-manager-controller-orders.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-cert-manager-controller-challenges, object: objects/rbac-excluded-cert-manager-controller-challenges.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-cloudnative-pg, object: objects/rbac-excluded-cloudnative-pg.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-crossplane-system-aggregate-to-crossplane, object: objects/rbac-excluded-crossplane-system-aggregate-to-crossplane.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-crossplane-aggregate-to-admin, object: objects/rbac-excluded-crossplane-aggregate-to-admin.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-crossplane-aggregate-to-edit, object: objects/rbac-excluded-crossplane-aggregate-to-edit.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-gatekeeper-manager-role, object: objects/rbac-excluded-gatekeeper-manager-role.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-istiod-clusterrole-istio-system, object: objects/rbac-excluded-istiod-clusterrole-istio-system.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-istio-reader-clusterrole-istio-system, object: objects/rbac-excluded-istio-reader-clusterrole-istio-system.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-policy-controller-webhook, object: objects/rbac-excluded-policy-controller-webhook.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-cluster-admin, object: objects/rbac-excluded-cluster-admin.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-admin, object: objects/rbac-excluded-admin.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-edit, object: objects/rbac-excluded-edit.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-system-node, object: objects/rbac-excluded-system-node.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-system-kube-controller-manager, object: objects/rbac-excluded-system-kube-controller-manager.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-system-controller-generic-garbage-collector, object: objects/rbac-excluded-system-controller-generic-garbage-collector.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-system-controller-namespace-controller, object: objects/rbac-excluded-system-controller-namespace-controller.yaml, assertions: [{violations: 0}]}
      - {name: accepts-upstream-system-controller-resourcequota-controller, object: objects/rbac-excluded-system-controller-resourcequota-controller.yaml, assertions: [{violations: 0}]}
      - {name: accepts-wildcard-resources-in-a-non-core-api-group, object: objects/rbac-clusterrole-wildcard-other-group.yaml, assertions: [{violations: 0}]}
      - {name: rejects-wildcard-resources-in-every-api-group-when-bound-to-a-developer, object: objects/rbac-clusterrole-wildcard-all-groups.yaml, inventory: [objects/inv-crb-all-groups-user.yaml], assertions: [{violations: 1, message: signing key}]}
      - {name: accepts-an-unbound-secret-reading-clusterrole, object: objects/rbac-clusterrole-secrets.yaml, assertions: [{violations: 0}]}
      - {name: accepts-an-aggregation-source-role-nothing-binds-directly, object: objects/rbac-clusterrole-aggregate-source.yaml, assertions: [{violations: 0}]}
      - {name: accepts-secret-reading-clusterrole-bound-only-to-the-bootstrap-group, object: objects/rbac-clusterrole-secrets.yaml, inventory: [objects/inv-crb-dev-secrets-bootstrap.yaml], assertions: [{violations: 0}]}
      - {name: accepts-secret-reading-clusterrole-bound-only-in-an-application-namespace, object: objects/rbac-clusterrole-secrets.yaml, inventory: [objects/inv-rb-dev-secrets-app-namespace.yaml], assertions: [{violations: 0}]}
      - {name: rejects-secret-reading-clusterrole-bound-in-the-signing-namespace-to-a-developer, object: objects/rbac-clusterrole-secrets.yaml, inventory: [objects/inv-rb-dev-secrets-signing-namespace.yaml], assertions: [{violations: 1, message: signing key}]}
      - {name: accepts-crossplane-clusterrole-bound-to-its-own-controller-service-account, object: objects/rbac-clusterrole-crossplane.yaml, inventory: [objects/inv-crb-crossplane-sa.yaml], assertions: [{violations: 0}]}
      - {name: rejects-a-developer-binding-an-existing-secret-reading-clusterrole-cluster-wide, object: objects/inv-crb-dev-secrets-user.yaml, inventory: [objects/rbac-clusterrole-secrets.yaml], assertions: [{violations: 1, message: signing key}]}
      - {name: rejects-a-developer-binding-an-existing-secret-reading-clusterrole-in-the-signing-namespace, object: objects/inv-rb-dev-secrets-signing-namespace.yaml, inventory: [objects/rbac-clusterrole-secrets.yaml], assertions: [{violations: 1, message: signing key}]}
      - {name: accepts-the-bootstrap-group-binding-an-existing-secret-reading-clusterrole, object: objects/inv-crb-dev-secrets-bootstrap.yaml, inventory: [objects/rbac-clusterrole-secrets.yaml], assertions: [{violations: 0}]}
      - {name: accepts-a-developer-binding-a-clusterrole-that-reads-no-secrets, object: objects/inv-crb-dev-secrets-user.yaml, inventory: [objects/rbac-clusterrole-pods-dev-secrets.yaml], assertions: [{violations: 0}]}
      - {name: accepts-a-developer-binding-an-existing-secret-reading-clusterrole-in-an-application-namespace, object: objects/inv-rb-dev-secrets-app-namespace.yaml, inventory: [objects/rbac-clusterrole-secrets.yaml], assertions: [{violations: 0}]}
