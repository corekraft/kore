kind: Suite
apiVersion: test.gatekeeper.sh/v1alpha1
tests:
  - name: secrets
    template: ../templates/koresecrets.yaml
    constraint: ../constraints/koresecrets.yaml
    cases:
      - {name: rejects-literal-password-env, object: objects/sec-env-literal-password.yaml, assertions: [{violations: 1}]}
      - {name: accepts-secret-key-ref-env, object: objects/sec-env-secret-ref.yaml, assertions: [{violations: 0}]}
      - {name: accepts-non-sensitive-literal-env, object: objects/sec-env-plain-literal.yaml, assertions: [{violations: 0}]}
      - {name: rejects-literal-token-in-init-container, object: objects/sec-init-literal-token.yaml, assertions: [{violations: 1}]}
      - {name: exempts-system-namespaces, object: objects/sec-literal-exempt.yaml, assertions: [{violations: 0}]}
      - {name: rejects-handmade-opaque-secret, object: objects/sec-secret-handmade.yaml, assertions: [{violations: 1}]}
      - {name: accepts-externalsecret-owned-secret, object: objects/sec-secret-external.yaml, assertions: [{violations: 0}]}
      - {name: ignores-typed-secrets, object: objects/sec-secret-tls.yaml, assertions: [{violations: 0}]}
