kind: Suite
apiVersion: test.gatekeeper.sh/v1alpha1
tests:
  - name: secrets
    template: ../templates/koresecrets.yaml
    constraint: ../constraints/koresecrets.yaml
    cases:
      - {name: rejects-literal-password-env, object: objects/sec-env-literal-password.yaml, assertions: [{violations: 1}]}
      - {name: accepts-secret-key-ref-env, object: objects/sec-env-secret-ref.yaml, assertions: [{violations: 0}]}
      - {name: accepts-non-sensitive-literal-env, object: objects/sec-env-plain-literal.yaml, assertions: [{violations: 0}]}
      - {name: rejects-literal-token-in-init-container, object: objects/sec-init-literal-token.yaml, assertions: [{violations: 1}]}
      - {name: exempts-system-namespaces, object: objects/sec-literal-exempt.yaml, assertions: [{violations: 0}]}
      - {name: rejects-handmade-opaque-secret, object: objects/sec-secret-handmade.yaml, assertions: [{violations: 1}]}
      - {name: accepts-externalsecret-owned-secret, object: objects/sec-secret-external.yaml, assertions: [{violations: 0}]}
      - {name: ignores-typed-secrets, object: objects/sec-secret-tls.yaml, assertions: [{violations: 0}]}
      - {name: accepts-labelled-secret-in-source-namespace, object: objects/sec-source-valid.yaml, assertions: [{violations: 0}]}
      - {name: rejects-unlabelled-secret-in-source-namespace, object: objects/sec-source-unlabelled.yaml, assertions: [{violations: 1}]}
      - {name: rejects-source-label-outside-source-namespace, object: objects/sec-source-wrong-namespace.yaml, assertions: [{violations: 1}]}
      - {name: rejects-source-label-not-true, object: objects/sec-source-label-false.yaml, assertions: [{violations: 1}]}
      - {name: accepts-cnpg-controller-owned-secret, object: objects/sec-cnpg-ca.yaml, assertions: [{violations: 0}]}
      - {name: rejects-lookalike-owner-group, object: objects/sec-cnpg-wrong-group.yaml, assertions: [{violations: 1}]}
      - {name: rejects-non-controller-owner, object: objects/sec-cnpg-not-controller.yaml, assertions: [{violations: 1}]}
      - {name: accepts-crossplane-composed-connection-secret, object: objects/sec-crossplane-connection.yaml, assertions: [{violations: 0}]}
      - {name: rejects-crossplane-owner-of-other-kind, object: objects/sec-crossplane-wrong-kind.yaml, assertions: [{violations: 1}]}
      - {name: accepts-public-only-signing-secret, object: objects/sec-signing-pub.yaml, assertions: [{violations: 0}]}
      - {name: rejects-signing-secret-without-labels, object: objects/sec-signing-pub-unlabelled.yaml, assertions: [{violations: 1}]}
      - {name: rejects-signing-secret-carrying-private-material, object: objects/sec-signing-pub-private-material.yaml, assertions: [{violations: 1}]}
      - {name: rejects-signing-secret-outside-image-policy-namespace, object: objects/sec-signing-pub-wrong-namespace.yaml, assertions: [{violations: 1}]}
      - {name: keeps-local-private-signing-key-visible, object: objects/sec-signing-private-key.yaml, assertions: [{violations: 1}]}
      - {name: keeps-grafana-admin-secret-visible, object: objects/sec-grafana-admin.yaml, assertions: [{violations: 1}]}
