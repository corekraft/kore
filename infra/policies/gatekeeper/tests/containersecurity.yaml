kind: Suite
apiVersion: test.gatekeeper.sh/v1alpha1
tests:
  - name: container-security
    template: ../templates/korecontainersecurity.yaml
    constraint: ../constraints/korecontainersecurity.yaml
    cases:
      - {name: rejects-privileged-container, object: objects/cs-privileged.yaml, assertions: [{violations: 1, message: must not be privileged}]}
      - {name: rejects-missing-requests-and-probe, object: objects/cs-no-requests-no-probe.yaml, assertions: [{violations: 2}]}
      - {name: accepts-compliant-container, object: objects/cs-compliant.yaml, assertions: [{violations: 0}]}
      # Platform namespaces hold third-party controllers whose upstream charts set no CPU request or readiness probe. Each is exempt by name; see ADR 0066.
      - {name: exempts-kube-system, object: objects/cs-exempt-kube-system.yaml, assertions: [{violations: 0}]}
      - {name: exempts-cert-manager, object: objects/cs-exempt-cert-manager.yaml, assertions: [{violations: 0}]}
      - {name: exempts-gatekeeper-system, object: objects/cs-exempt-gatekeeper-system.yaml, assertions: [{violations: 0}]}
      - {name: exempts-istio-system, object: objects/cs-exempt-istio-system.yaml, assertions: [{violations: 0}]}
      - {name: exempts-crossplane-system, object: objects/cs-exempt-crossplane-system.yaml, assertions: [{violations: 0}]}
      - {name: exempts-external-secrets, object: objects/cs-exempt-external-secrets.yaml, assertions: [{violations: 0}]}
      - {name: exempts-cnpg-system, object: objects/cs-exempt-cnpg-system.yaml, assertions: [{violations: 0}]}
      - {name: exempts-opentelemetry-operator-system, object: objects/cs-exempt-opentelemetry-operator-system.yaml, assertions: [{violations: 0}]}
      - {name: exempts-observability, object: objects/cs-exempt-observability.yaml, assertions: [{violations: 0}]}
      # Namespaces owned by kore's own charts stay covered.
      - {name: covers-kore-system, object: objects/cs-covered-kore-system.yaml, assertions: [{violations: 2}]}
      - {name: covers-kore-registry, object: objects/cs-covered-kore-registry.yaml, assertions: [{violations: 2}]}
      - {name: covers-opa-system, object: objects/cs-covered-opa-system.yaml, assertions: [{violations: 2}]}
      - {name: covers-cosign-system, object: objects/cs-covered-cosign-system.yaml, assertions: [{violations: 2}]}
