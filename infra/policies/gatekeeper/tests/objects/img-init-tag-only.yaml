spec:
  template:
    spec:
      initContainers:
        - {name: migrate, image: "registry.example/migrate:latest"}
      containers:
        - {name: app, image: "registry.example/app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}
