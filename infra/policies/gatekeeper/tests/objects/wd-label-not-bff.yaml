# The label alone is not enough: the name must end in -bff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-frontend
  namespace: app
  labels: { platform.kore.dev/single-replica: sign-in-bff }
spec:
  replicas: 1
  strategy:
    { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    spec:
      containers:
        - name: frontend
          image: invalid
          resources: { requests: { memory: 128Mi }, limits: { memory: 128Mi } }
