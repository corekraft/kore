apiVersion: apps/v1
kind: Deployment
metadata: { name: orders, namespace: app }
spec:
  strategy:
    { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    spec:
      containers:
        - name: orders
          image: invalid
          resources: { requests: { memory: 256Mi }, limits: { memory: 256Mi } }
