# The same BFF as wd-bff-labelled.yaml, without the chart's label: it is refused.
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-bff, namespace: app }
spec:
  replicas: 1
  strategy:
    { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    spec:
      containers:
        - name: bff
          image: invalid
          resources: { requests: { memory: 512Mi }, limits: { memory: 512Mi } }
