# The labelled BFF is exempt from the replica rule alone: the rollout rule still applies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-bff
  namespace: app
  labels: { platform.kore.dev/single-replica: sign-in-bff }
spec:
  replicas: 1
  strategy:
    { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 1 } }
  template:
    spec:
      containers:
        - name: bff
          image: invalid
          resources: { requests: { memory: 512Mi }, limits: { memory: 512Mi } }
