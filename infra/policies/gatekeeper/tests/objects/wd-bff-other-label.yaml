apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-bff
  namespace: app
  labels: { platform.kore.dev/single-replica: orders }
spec:
  replicas: 1
  strategy:
    { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    spec:
      containers:
        - name: bff
          image: invalid
          resources: { requests: { memory: 512Mi }, limits: { memory: 512Mi } }
