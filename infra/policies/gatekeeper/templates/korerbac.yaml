apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata: { name: korerbac }
spec:
  crd:
    spec:
      names: { kind: KoreRBAC }
      validation:
        openAPIV3Schema:
          type: object
          properties:
            exemptNamespaces: { type: array, items: { type: string } }
            signingNamespace: { type: string }
            signingKeySecret: { type: string }
            allowedSecretRoles: { type: array, items: { type: string } }
            bootstrapGroups: { type: array, items: { type: string } }
            namespaceBoundSecretRoles: { type: array, items: { type: string } }
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package kore.rbac
        import future.keywords.in
        exempt { input.review.object.metadata.namespace in input.parameters.exemptNamespaces }
        violation[{"msg": msg}] {
          input.review.kind.kind == "Role"
          not exempt
          rule := input.review.object.rules[_]
          "*" in rule.verbs
          msg := sprintf("role %s must not grant wildcard verbs", [input.review.object.metadata.name])
        }
        violation[{"msg": msg}] {
          input.review.kind.kind == "Role"
          not exempt
          rule := input.review.object.rules[_]
          "*" in rule.resources
          msg := sprintf("role %s must not grant wildcard resources", [input.review.object.metadata.name])
        }
        violation[{"msg": msg}] {
          input.review.kind.kind in {"RoleBinding", "ClusterRoleBinding"}
          input.review.object.roleRef.name == "cluster-admin"
          subject := input.review.object.subjects[_]
          subject.kind == "ServiceAccount"
          not subject.namespace in input.parameters.exemptNamespaces
          msg := sprintf("ServiceAccount %s/%s must not be bound to cluster-admin", [subject.namespace, subject.name])
        }
        # The local signing key (ADR 0015) may be read only by the signing path and
        # bootstrap automation (ADR 0054). Reading Secrets is granted by a Role in
        # the key's namespace, by any ClusterRole, or through the built-in
        # admin/edit roles; each is refused unless it is the named signing-path
        # role, an allowlisted controller role, or bound only to bootstrap groups.
        # Secrets are a core-group resource, so only a rule that covers the core
        # group ("" or "*") reads them; a wildcard inside another API group does not.
        reads_secrets(rule) {
          rule.apiGroups[_] in {"", "*"}
          rule.resources[_] in {"secrets", "*"}
          rule.verbs[_] in {"get", "list", "watch", "*"}
        }
        reaches_signing_key(rule) {
          reads_secrets(rule)
          not rule.resourceNames
        }
        reaches_signing_key(rule) {
          reads_secrets(rule)
          rule.resourceNames[_] == input.parameters.signingKeySecret
        }
        # A ClusterRole is a risk only when bound so that a subject other than
        # bootstrap automation or a platform controller can use it cluster-wide or in
        # the signing namespace (ADR 0080). Bindings come from Gatekeeper's sync
        # cache (the Config in constraints/sync); an unbound or aggregation-only role
        # grants nothing by itself, and the built-in admin and edit roles that
        # aggregate into it are governed where they are bound. Without the cache no
        # binding is visible, so the sync Config is part of this policy.
        allowed_subject(subject) {
          bootstrap_subject(subject)
        }
        allowed_subject(subject) {
          subject.kind == "ServiceAccount"
          subject.namespace in input.parameters.exemptNamespaces
        }
        rbac := "rbac.authorization.k8s.io/v1"
        exposed(role) {
          binding := data.inventory.cluster[rbac].ClusterRoleBinding[_]
          binding.roleRef.kind == "ClusterRole"
          binding.roleRef.name == role
          subject := binding.subjects[_]
          not allowed_subject(subject)
        }
        exposed(role) {
          binding := data.inventory.namespace[input.parameters.signingNamespace][rbac].RoleBinding[_]
          binding.roleRef.kind == "ClusterRole"
          binding.roleRef.name == role
          subject := binding.subjects[_]
          not allowed_subject(subject)
        }
        violation[{"msg": msg}] {
          input.review.kind.kind == "ClusterRole"
          not input.review.object.metadata.name in input.parameters.allowedSecretRoles
          not input.review.object.metadata.name in input.parameters.namespaceBoundSecretRoles
          rule := input.review.object.rules[_]
          reaches_signing_key(rule)
          exposed(input.review.object.metadata.name)
          msg := sprintf("ClusterRole %s can read the local signing key %s/%s through a binding to a subject that is not bootstrap automation or a platform controller; scope it with resourceNames or remove the binding", [input.review.object.metadata.name, input.parameters.signingNamespace, input.parameters.signingKeySecret])
        }
        violation[{"msg": msg}] {
          input.review.kind.kind == "Role"
          input.review.object.metadata.namespace == input.parameters.signingNamespace
          not input.review.object.metadata.name in input.parameters.allowedSecretRoles
          not input.review.object.metadata.name in input.parameters.namespaceBoundSecretRoles
          rule := input.review.object.rules[_]
          reaches_signing_key(rule)
          msg := sprintf("Role %s can read the local signing key %s/%s; only the signing path and bootstrap automation may (scope it with resourceNames)", [input.review.object.metadata.name, input.parameters.signingNamespace, input.parameters.signingKeySecret])
        }
        # The other direction: a binding that makes an existing secret-reading
        # ClusterRole reachable is refused when it names a subject that is not allowed.
        violation[{"msg": msg}] {
          input.review.kind.kind in {"ClusterRoleBinding", "RoleBinding"}
          binding_reaches_signing_namespace
          input.review.object.roleRef.kind == "ClusterRole"
          role := input.review.object.roleRef.name
          not role in input.parameters.allowedSecretRoles
          not role in input.parameters.namespaceBoundSecretRoles
          rule := data.inventory.cluster[rbac].ClusterRole[role].rules[_]
          reaches_signing_key(rule)
          subject := input.review.object.subjects[_]
          not allowed_subject(subject)
          msg := sprintf("%s %s binds %s, which can read the local signing key %s/%s, to %s %s; only bootstrap automation and platform controllers may hold it", [input.review.kind.kind, input.review.object.metadata.name, role, input.parameters.signingNamespace, input.parameters.signingKeySecret, subject.kind, subject.name])
        }
        binding_reaches_signing_namespace { input.review.kind.kind == "ClusterRoleBinding" }
        binding_reaches_signing_namespace {
          input.review.kind.kind == "RoleBinding"
          input.review.object.metadata.namespace == input.parameters.signingNamespace
        }
        # A ClusterRole in namespaceBoundSecretRoles is a permission set that may
        # be bound only by RoleBinding in application namespaces (ADR 0061); a
        # cluster-wide binding or one in the signing namespace would reach the key.
        violation[{"msg": msg}] {
          input.review.kind.kind == "ClusterRoleBinding"
          input.review.object.roleRef.name in input.parameters.namespaceBoundSecretRoles
          msg := sprintf("ClusterRoleBinding %s binds %s cluster-wide, which reaches the local signing key %s/%s; bind it with a RoleBinding in an application namespace", [input.review.object.metadata.name, input.review.object.roleRef.name, input.parameters.signingNamespace, input.parameters.signingKeySecret])
        }
        violation[{"msg": msg}] {
          input.review.kind.kind == "RoleBinding"
          input.review.object.metadata.namespace == input.parameters.signingNamespace
          input.review.object.roleRef.name in input.parameters.namespaceBoundSecretRoles
          msg := sprintf("RoleBinding %s binds %s in %s, which reaches the local signing key %s", [input.review.object.metadata.name, input.review.object.roleRef.name, input.parameters.signingNamespace, input.parameters.signingKeySecret])
        }
        secret_reading_builtin { input.review.object.roleRef.name in {"admin", "edit"} }
        violation[{"msg": msg}] {
          input.review.kind.kind == "ClusterRoleBinding"
          secret_reading_builtin
          subject := input.review.object.subjects[_]
          not bootstrap_subject(subject)
          msg := sprintf("%s %s grants %s, which reads the local signing key %s/%s, to %s %s; only bootstrap groups may hold it cluster-wide", [input.review.kind.kind, input.review.object.metadata.name, input.review.object.roleRef.name, input.parameters.signingNamespace, input.parameters.signingKeySecret, subject.kind, subject.name])
        }
        violation[{"msg": msg}] {
          input.review.kind.kind == "RoleBinding"
          input.review.object.metadata.namespace == input.parameters.signingNamespace
          secret_reading_builtin
          subject := input.review.object.subjects[_]
          not bootstrap_subject(subject)
          msg := sprintf("RoleBinding %s grants %s in %s, which reads the local signing key %s, to %s %s; only bootstrap groups may hold it", [input.review.object.metadata.name, input.review.object.roleRef.name, input.parameters.signingNamespace, input.parameters.signingKeySecret, subject.kind, subject.name])
        }
        bootstrap_subject(subject) {
          subject.kind == "Group"
          subject.name in input.parameters.bootstrapGroups
        }
