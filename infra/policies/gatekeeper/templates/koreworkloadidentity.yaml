apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata: {name: koreworkloadidentity}
spec:
  crd:
    spec:
      names: {kind: KoreWorkloadIdentity}
      validation:
        openAPIV3Schema:
          type: object
          properties: {exemptNamespaces: {type: array, items: {type: string}}}
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package kore.workloadidentity
        import future.keywords.in
        exempt { input.review.object.metadata.namespace in input.parameters.exemptNamespaces }
        workload { input.review.kind.kind in {"Deployment", "StatefulSet", "DaemonSet", "Job", "CronJob"} }
        podspec = input.review.object.spec.template.spec { input.review.kind.kind != "CronJob" }
        podspec = input.review.object.spec.jobTemplate.spec.template.spec { input.review.kind.kind == "CronJob" }
        automount_disabled { podspec.automountServiceAccountToken == false }
        violation[{"msg": msg}] {
          workload
          not exempt
          not podspec.serviceAccountName
          msg := "a dedicated serviceAccountName is required"
        }
        violation[{"msg": msg}] {
          workload
          not exempt
          podspec.serviceAccountName == "default"
          msg := "the default ServiceAccount is forbidden"
        }
        violation[{"msg": msg}] {
          workload
          not exempt
          not automount_disabled
          msg := "automountServiceAccountToken must be explicit and false unless reviewed"
        }

