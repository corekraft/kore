apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata: {name: koresecrets}
spec:
  crd:
    spec:
      names: {kind: KoreSecrets}
      validation:
        openAPIV3Schema:
          type: object
          properties: {exemptNamespaces: {type: array, items: {type: string}}}
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package kore.secrets
        import future.keywords.in
        sensitive := "(?i)(password|passwd|secret|token|api[_-]?key|private[_-]?key|credential)"
        workload { input.review.kind.kind in {"Pod", "Deployment", "StatefulSet", "DaemonSet", "Job", "CronJob"} }
        exempt { input.review.object.metadata.namespace in input.parameters.exemptNamespaces }
        podspec = input.review.object.spec { input.review.kind.kind == "Pod" }
        podspec = input.review.object.spec.template.spec { input.review.kind.kind in {"Deployment", "StatefulSet", "DaemonSet", "Job"} }
        podspec = input.review.object.spec.jobTemplate.spec.template.spec { input.review.kind.kind == "CronJob" }
        containers[c] { c := podspec.containers[_] }
        containers[c] { c := podspec.initContainers[_] }
        violation[{"msg": msg}] {
          workload
          not exempt
          container := containers[_]
          env := container.env[_]
          env.value
          regex.match(sensitive, env.name)
          msg := sprintf("container %s sets %s as a literal; use valueFrom.secretKeyRef on an ExternalSecret-managed Secret", [container.name, env.name])
        }
        external { input.review.object.metadata.ownerReferences[_].kind == "ExternalSecret" }
        violation[{"msg": msg}] {
          input.review.kind.kind == "Secret"
          not exempt
          input.review.object.type == "Opaque"
          not external
          msg := sprintf("Secret %s must be created by an ExternalSecret, not by hand", [input.review.object.metadata.name])
        }
