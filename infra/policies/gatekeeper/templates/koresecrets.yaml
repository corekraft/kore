apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata: {name: koresecrets}
spec:
  crd:
    spec:
      names: {kind: KoreSecrets}
      validation:
        openAPIV3Schema:
          type: object
          properties:
            exemptNamespaces: {type: array, items: {type: string}}
            sourceNamespaces: {type: array, items: {type: string}}
            signingPublicNamespaces: {type: array, items: {type: string}}
            webhookCertNamespaces: {type: array, items: {type: string}}
            registryNamespaces: {type: array, items: {type: string}}
            signingKeyNamespaces: {type: array, items: {type: string}}
            signingKeyNames: {type: array, items: {type: string}}
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package kore.secrets
        import future.keywords.in
        sensitive := "(?i)(password|passwd|secret|token|api[_-]?key|private[_-]?key|credential)"
        workload { input.review.kind.kind in {"Pod", "Deployment", "StatefulSet", "DaemonSet", "Job", "CronJob"} }
        exempt { input.review.object.metadata.namespace in input.parameters.exemptNamespaces }
        podspec = input.review.object.spec { input.review.kind.kind == "Pod" }
        podspec = input.review.object.spec.template.spec { input.review.kind.kind in {"Deployment", "StatefulSet", "DaemonSet", "Job"} }
        podspec = input.review.object.spec.jobTemplate.spec.template.spec { input.review.kind.kind == "CronJob" }
        containers[c] { c := podspec.containers[_] }
        containers[c] { c := podspec.initContainers[_] }
        violation[{"msg": msg}] {
          workload
          not exempt
          container := containers[_]
          env := container.env[_]
          env.value
          regex.match(sensitive, env.name)
          msg := sprintf("container %s sets %s as a literal; use valueFrom.secretKeyRef on an ExternalSecret-managed Secret", [container.name, env.name])
        }
        external { input.review.object.metadata.ownerReferences[_].kind == "ExternalSecret" }
        meta := input.review.object.metadata
        # Local source Secrets are the inputs kore streams in; they are only legitimate in the secret source namespace.
        source_secret {
          meta.namespace in input.parameters.sourceNamespaces
          meta.labels["platform.kore.dev/secret-source"] == "true"
        }
        # Controller-owned Secrets are written by CloudNativePG or by Crossplane for the PostgreSQLInstance composite, not by hand.
        controller_owned {
          owner := meta.ownerReferences[_]
          owner.controller == true
          owner.kind == "Cluster"
          startswith(owner.apiVersion, "postgresql.cnpg.io/")
        }
        controller_owned {
          owner := meta.ownerReferences[_]
          owner.controller == true
          owner.kind == "PostgreSQLInstance"
          startswith(owner.apiVersion, "platform.kore.dev/")
        }
        # The local signer publishes only the public key; any other key in the Secret disqualifies it.
        signing_public {
          meta.namespace in input.parameters.signingPublicNamespaces
          meta.labels["app.kubernetes.io/managed-by"] == "kore-signing"
          meta.labels["app.kubernetes.io/part-of"] == "kore-image-policy"
          keys := {k | input.review.object.data[k]} | {k | input.review.object.stringData[k]}
          keys == {"cosign.pub"}
        }
        # Sigstore Policy Controller ships webhook-certs empty and its controller fills in the serving certificate; match exactly that shape.
        webhook_serving {
          meta.name == "webhook-certs"
          meta.namespace in input.parameters.webhookCertNamespaces
          meta.labels["app.kubernetes.io/name"] == "policy-controller"
          meta.labels["control-plane"] == "policy-controller-webhook"
          keys := {k | input.review.object.data[k]} | {k | input.review.object.stringData[k]}
          keys == {"ca-cert.pem", "server-cert.pem", "server-key.pem"}
        }
        # kore generates the registry credentials and streams them in (ADR 0034); only these two exact Secrets, with exactly their keys, in the registry namespace.
        registry_secret_keys := {
          "oci-registry-credentials": {"push-username", "push-password", "read-username", "read-password"},
          "oci-registry-auth": {"htpasswd"},
        }
        registry_auth {
          meta.namespace in input.parameters.registryNamespaces
          meta.labels["app.kubernetes.io/managed-by"] == "kore-registry-auth"
          keys := {k | input.review.object.data[k]} | {k | input.review.object.stringData[k]}
          keys == registry_secret_keys[meta.name]
        }
        # The local signing key pair is kore's own key material (ADR 0015): cosign
        # creates it and kore labels it. Recognised only by the exact name in the
        # kore namespace, the ownership label and exactly cosign's three keys.
        signing_key {
          meta.namespace in input.parameters.signingKeyNamespaces
          meta.name in input.parameters.signingKeyNames
          meta.labels["app.kubernetes.io/managed-by"] == "kore-signing"
          keys := {k | input.review.object.data[k]} | {k | input.review.object.stringData[k]}
          keys == {"cosign.key", "cosign.password", "cosign.pub"}
        }
        violation[{"msg": msg}] {
          input.review.kind.kind == "Secret"
          not exempt
          input.review.object.type == "Opaque"
          not external
          not source_secret
          not controller_owned
          not signing_public
          not webhook_serving
          not registry_auth
          not signing_key
          msg := sprintf("Secret %s must be created by an ExternalSecret, not by hand", [input.review.object.metadata.name])
        }
