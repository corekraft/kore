apiVersion: constraints.gatekeeper.sh/v1beta1
kind: KoreMeshEnrollment
metadata: {name: kore-mesh-enrollment}
spec:
  enforcementAction: dryrun
  match: {kinds: [{apiGroups: [""], kinds: [Namespace]}]}
  # agentgateway-system holds only the controller (xDS to data planes in the Gateway namespace); it is exempt until enrolled, never from container security. Plan 13, ADR 0081.
  parameters:
    exemptNamespaces: [default, kube-public, kube-node-lease, kore-secret-source, kube-system, cert-manager, gatekeeper-system, istio-system, cosign-system, crossplane-system, external-secrets, cnpg-system, opentelemetry-operator-system, kore-system, kore-registry, observability, opa-system, agentgateway-system]
