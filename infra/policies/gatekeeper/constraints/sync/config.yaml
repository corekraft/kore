{
  "apiVersion": "config.gatekeeper.sh/v1alpha1",
  "kind": "Config",
  "metadata": { "name": "config", "namespace": "gatekeeper-system" },
  "spec":
    {
      "sync":
        {
          "syncOnly":
            [
              {
                "group": "rbac.authorization.k8s.io",
                "version": "v1",
                "kind": "ClusterRole"
              },
              {
                "group": "rbac.authorization.k8s.io",
                "version": "v1",
                "kind": "ClusterRoleBinding"
              },
              {
                "group": "rbac.authorization.k8s.io",
                "version": "v1",
                "kind": "RoleBinding"
              }
            ]
        }
    }
}
