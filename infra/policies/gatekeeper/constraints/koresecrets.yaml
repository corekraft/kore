apiVersion: constraints.gatekeeper.sh/v1beta1
kind: KoreSecrets
metadata: {name: kore-secrets}
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - {apiGroups: [""], kinds: [Pod, Secret]}
      - {apiGroups: [apps, batch], kinds: [Deployment, StatefulSet, DaemonSet, Job, CronJob]}
  parameters:
    exemptNamespaces: [kube-system, cert-manager, gatekeeper-system, istio-system, crossplane-system, external-secrets, cnpg-system, opentelemetry-operator-system]
    sourceNamespaces: [kore-secret-source]
    signingPublicNamespaces: [cosign-system]
    webhookCertNamespaces: [cosign-system]
