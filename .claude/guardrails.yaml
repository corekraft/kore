    { "rule": "coverage-threshold", "kind": "file", "mode": "enforce", "owner": "tools/harness/src/hook/guard-file.ts" },
    { "rule": "role-read-only", "kind": "bash-and-file", "mode": "enforce", "owner": "tools/harness/src/hook/guard-role.ts", "note": "Writers may edit and move hook test files, .claude/hooks/<name>.test.mjs, by the owner's approval of 2026-11-12 (#440, ADR 0100); the hook scripts, the settings, skills/bin and the .claude folder stay protected. The judge may run the read-only `harness judge diff` and `sed -n` with several semicolon-joined print ranges and escaped slashes (any w, W, e or r command or flag stays refused), by the owner's approval of 2026-11-14 (#417, ADR 0080)." },
    { "rule": "role-hc-raw", "kind": "bash", "mode": "audit", "owner": "tools/harness/src/hook/guard-role-hc.ts", "note": "Audit mode (ADR 0080): the writer's raw hc send, label, run or exec, and an HC_TERMINAL_ID prefix, warn only. Promotion to enforce is a later owner-approved guardrail activation (plan 16, Step 4; ticket #1776)." },
    { "rule": "bare-agent-start-hc", "kind": "bash", "mode": "audit", "owner": "tools/harness/src/hook/guard-agent-start.ts", "note": "Audit mode (ADR 0080): a claude launch through hc run warns only, since the owner's #408 approval covers the herdr form. Promotion to enforce is a later owner-approved guardrail activation (plan 16, Step 4; ticket #1776)." },
    { "rule": "role-no-merge", "kind": "bash", "mode": "enforce", "owner": "tools/harness/src/hook/guard-role-delivery.ts" },
    { "rule": "role-worktree", "kind": "bash-and-file", "mode": "enforce", "owner": "tools/harness/src/hook/guard-role-delivery.ts", "note": "A relative cd, git -C or written path resolves from the hook's directory and from an earlier cd in the same command, so cd ../.. back to the worktree root is allowed and anything past the root stays refused, by the owner's approval of 2026-11-14 (#417, ADR 0080)." },
    { "rule": "append-only", "kind": "bash-and-file", "mode": "audit", "owner": "tools/harness/src/hook/guard-append-only.ts" },
    { "rule": "flag-activation", "kind": "file", "mode": "audit", "owner": "tools/harness/src/hook/guard-file.ts" },
    { "rule": "vps-flag-proof", "kind": "file", "mode": "audit", "owner": "tools/harness/src/cli/flag-audit-vps.ts", "note": "Audit mode (ADR 0080, ADR 0147): `harness flag audit --vps` lists each flag on in the vps overlay with no live-run outcome as a warning and exits 0; an owner waiver never proves vps. Enforce makes that audit fail (exit 1). Promotion to enforce is a later owner-approved guardrail activation through `guardrail request` and `guardrail activate` (ticket #1493)." },
    { "rule": "image-digest", "kind": "file", "mode": "audit", "owner": "tools/harness/src/hook/guard-file.ts" },
    { "rule": "idea-outcome", "kind": "file", "mode": "audit", "owner": "tools/harness/src/hook/guard-file.ts" },
    { "rule": "idea-issue-body", "kind": "bash", "mode": "audit", "owner": "tools/harness/src/hook/guard-commands.ts" },
    { "rule": "idea-issue-close", "kind": "bash", "mode": "audit", "owner": "tools/harness/src/hook/guard-commands.ts" },
    { "rule": "bare-glob", "kind": "bash", "mode": "audit", "owner": "tools/harness/src/hook/guard-bare-glob.ts" },
    { "rule": "platform-domain-leak", "kind": "bash-and-file", "mode": "audit", "owner": "tools/harness/src/hook/guard-leak.ts", "note": "Audit mode (ADR 0164, ADR 0080): a Write, an Edit or a command that names the value of KORE_PLATFORM_DOMAIN on this machine warns, never blocks, and never echoes the value. The value is set only on a machine that runs kore against the real domain; the repository's own names (kore.internal, kore.local, example.com) never warn. Promotion to enforce is a later owner-approved guardrail activation through `guardrail request` and `guardrail activate`." },
    { "rule": "equals-word", "kind": "bash", "mode": "enforce", "owner": "tools/harness/src/hook/guard-bash.ts" },
    { "rule": "guardrail-demotion", "kind": "bash-and-file", "mode": "enforce", "owner": "tools/harness/src/hook/guard-guardrails.ts", "note": "Enforces from 2026-11-14: the owner decided on #413 to enforce now, on the recorded outcome of 6 warnings, 6 heeded and 0 overridden over 5 sessions (ADR 0080)." },
    { "rule": "main-ruleset-deletion", "kind": "ruleset", "mode": "enforce", "owner": "tools/harness/src/ruleset/index.ts", "note": "Starts in enforce because live main already has this rule active, so the first sync changes nothing. A new or changed rule lands in audit: sync puts it in main-candidate in evaluate, and a person approves moving it to enforce (ADR 0090)." },
    { "rule": "main-ruleset-non-fast-forward", "kind": "ruleset", "mode": "enforce", "owner": "tools/harness/src/ruleset/index.ts", "note": "Starts in enforce because live main already has this rule active, so the first sync changes nothing. A new or changed rule lands in audit: sync puts it in main-candidate in evaluate, and a person approves moving it to enforce (ADR 0090)." },
    { "rule": "main-ruleset-pull-request", "kind": "ruleset", "mode": "enforce", "owner": "tools/harness/src/ruleset/index.ts", "note": "Starts in enforce because live main already has this rule active, so the first sync changes nothing. A new or changed rule lands in audit: sync puts it in main-candidate in evaluate, and a person approves moving it to enforce (ADR 0090)." },
    { "rule": "main-ruleset-required-status-checks", "kind": "ruleset", "mode": "enforce", "owner": "tools/harness/src/ruleset/index.ts", "note": "Starts in enforce because live main already has this rule active, so the first sync changes nothing. A new or changed rule lands in audit: sync puts it in main-candidate in evaluate, and a person approves moving it to enforce (ADR 0090)." },
    { "rule": "judge-ci", "kind": "checklist", "mode": "enforce", "owner": "tools/harness/src/judge/checklist.ts" },
    { "rule": "judge-scan", "kind": "checklist", "mode": "enforce", "owner": "tools/harness/src/judge/checklist.ts" },
    { "rule": "judge-coverage", "kind": "checklist", "mode": "enforce", "owner": "tools/harness/src/judge/checklist.ts" },
    { "rule": "judge-principles-review", "kind": "checklist", "mode": "enforce", "owner": "tools/harness/src/judge/checklist.ts" },
    { "rule": "judge-expand-step", "kind": "checklist", "mode": "enforce", "owner": "tools/harness/src/judge/checklist.ts" },
    { "rule": "judge-pattern-match", "kind": "checklist", "mode": "enforce", "owner": "tools/harness/src/judge/checklist.ts" },
    { "rule": "judge-guardrail-activation", "kind": "checklist", "mode": "audit", "owner": "tools/harness/src/judge/checklist.ts", "note": "Starts in audit (AGENTS.md, Audit before enforce): a change that lands a guardrail in enforce, loosens one or removes one is listed here until a person approves enforcing this item through `guardrail request` and `guardrail activate` (plan 12, Step 4)." },
    { "rule": "deny-cluster-delete", "kind": "bash", "mode": "enforce", "owner": "tools/harness/src/guardrail/deny.ts", "deny": ["Bash(k3d cluster delete:*)", "Bash(k3d * cluster delete*)", "Bash(k3d cluster * delete*)"] },
    { "rule": "deny-iac-destroy", "kind": "bash", "mode": "enforce", "owner": "tools/harness/src/guardrail/deny.ts", "deny": ["Bash(tofu destroy:*)", "Bash(terraform destroy:*)"] },
