    { "rule": "deny-namespace-delete", "kind": "bash", "mode": "enforce", "owner": "tools/harness/src/guardrail/deny.ts", "deny": ["Bash(kubectl delete namespace:*)", "Bash(kubectl delete ns:*)"] },
    { "rule": "deny-kore-destroy", "kind": "bash", "mode": "enforce", "owner": "tools/harness/src/guardrail/deny.ts", "deny": ["Bash(kore * destroy)", "Bash(kore * destroy *)", "Bash(./bin/kore * destroy)", "Bash(./bin/kore * destroy *)"] },
    { "rule": "deny-read-keys", "kind": "file", "mode": "enforce", "owner": "tools/harness/src/guardrail/deny.ts", "deny": ["Read(./.kore/keys/**)"] },
    { "rule": "deny-read-tokens", "kind": "file", "mode": "enforce", "owner": "tools/harness/src/guardrail/deny.ts", "deny": ["Read(./.kore/state/*token*)"] }
