    { "rule": "main-ruleset-deletion", "kind": "ruleset", "mode": "enforce", "owner": "tools/harness/src/ruleset/index.ts", "note": "Starts in enforce because live main already has this rule active, so the first sync changes nothing. A new or changed rule lands in audit: sync puts it in main-candidate in evaluate, and a person approves moving it to enforce (ADR 0090)." },
    { "rule": "main-ruleset-non-fast-forward", "kind": "ruleset", "mode": "enforce", "owner": "tools/harness/src/ruleset/index.ts", "note": "Starts in enforce because live main already has this rule active, so the first sync changes nothing. A new or changed rule lands in audit: sync puts it in main-candidate in evaluate, and a person approves moving it to enforce (ADR 0090)." },
    { "rule": "main-ruleset-pull-request", "kind": "ruleset", "mode": "enforce", "owner": "tools/harness/src/ruleset/index.ts", "note": "Starts in enforce because live main already has this rule active, so the first sync changes nothing. A new or changed rule lands in audit: sync puts it in main-candidate in evaluate, and a person approves moving it to enforce (ADR 0090)." },
    { "rule": "main-ruleset-required-status-checks", "kind": "ruleset", "mode": "enforce", "owner": "tools/harness/src/ruleset/index.ts", "note": "Starts in enforce because live main already has this rule active, so the first sync changes nothing. A new or changed rule lands in audit: sync puts it in main-candidate in evaluate, and a person approves moving it to enforce (ADR 0090)." },
    { "rule": "deny-cluster-delete", "kind": "bash", "mode": "enforce", "owner": "tools/harness/src/guardrail/deny.ts", "deny": ["Bash(k3d cluster delete:*)", "Bash(k3d * cluster delete*)", "Bash(k3d cluster * delete*)"] },
    { "rule": "deny-iac-destroy", "kind": "bash", "mode": "enforce", "owner": "tools/harness/src/guardrail/deny.ts", "deny": ["Bash(tofu destroy:*)", "Bash(terraform destroy:*)"] },
