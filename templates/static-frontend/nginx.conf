server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A single-page app falls back to its entry point; /api belongs to the BFF.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
