# Non-secret configuration only: the AOT training run reads this file and the
# resulting cache is baked into the image (ADR 0046).
server:
  port: 8080
  servlet:
    session:
      # Host-only: no domain key, so the browser never shares the session with
      # other services under the same domain (vision, host-only cookies).
      cookie:
        http-only: true
        secure: true
        # Lax keeps the session on the top-level redirect back from the sign-in
        # provider, which Strict would drop.
        same-site: lax
management:
  health:
    db:
      # The probes read /actuator/health: a database blip must not restart or
      # unready every replica, so the session store is not part of it.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
spring:
  autoconfigure:
    # The datasource exists only while sign-in is on (SessionStoreConfiguration), so
    # the AOT training and verify runs refresh the context with no database.
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  session:
    # A session lives 30 minutes from its last request, the idle time of the
    # platform realm's SSO session; signing in again rebuilds it.
    timeout: 30m
    jdbc:
      # SessionSchema creates the tables, under a lock, so replicas starting
      # together do not race on Spring Session's non-idempotent script.
      initialize-schema: never
      # Expired rows are deleted every five minutes by each replica.
      cleanup-cron: "0 */5 * * * *"
