# Tags releases with release-please and signs the reference image with keyless
# Cosign. Both live in this one file because the keyless certificate identity is
# this workflow file at the ref the run started from (ADR 0028).
#
# release-please creates the vX.Y.Z tag with the default GITHUB_TOKEN, and a tag
# pushed with that token starts no workflow. A signing job run from main would
# carry the identity ...release.yaml@refs/heads/main, which is not a release tag.
# So the `dispatch` job re-runs this workflow at the new tag (workflow_dispatch is
# exempt from the GITHUB_TOKEN restriction), and only that tag-ref run signs: its
# identity is ...release.yaml@refs/tags/vX.Y.Z, the exact subject the managed
# environment lists. No GitHub App or personal token is needed.
#
# Version tags MUST be protected by a repository ruleset (restrict creation,
# updates, and deletion of v* tags to maintainers, with the github-actions
# integration allowed to create them): the repository cannot configure that
# itself, and without it anyone who can push a tag can mint a trusted signature.

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The integration tier (ADR 0098) on every push to main. release-please waits
  # for it, so a red main creates no tag and leaves the release pull request
  # as it was (#404). `needs` cannot name a job in another workflow, so this job
  # repeats the tier steps of integration.yml and nightly.yml.
  integration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          install_args: node npm opa gator helm promtool opentofu
          # No cache: this workflow publishes tags, and zizmor's cache-poisoning
          # audit fails a cache restored into a release run (as the release jobs do).
          cache: false
      - name: Install CLI dependencies
        run: npm ci --prefix tools/kore
      - name: Install harness dependencies
        run: npm ci --prefix tools/harness
      - name: Run the integration tier
        run: mise run test-integration

  release-please:
    needs: integration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write # release-please labels its pull requests
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dispatch:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Run the signing workflow at the new tag
        run: gh workflow run release.yaml --ref "refs/tags/$TAG"

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      # The one place the release registry is chosen.
      IMAGE: ghcr.io/corekraft/kore/reference
      ISSUER: https://token.actions.githubusercontent.com
      IDENTITY: https://github.com/corekraft/kore/.github/workflows/release.yaml@refs/tags/${{ github.ref_name }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          install_args: cosign
          cache: false
      # Gradle builds the Kotlin BFF template image; it is installed apart from
      # the signing tools above, at the version `.mise.toml` pins.
      - name: Install Gradle
        run: mise install gradle
      - name: Check the tag is a release version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vX.Y.Z" >&2; exit 1; }
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Build and push the reference image
        run: |
          docker build --tag "$IMAGE:$TAG" apps/reference
          docker push "$IMAGE:$TAG"
          DIGEST="$(docker inspect --format '{{ index .RepoDigests 0 }}' "$IMAGE:$TAG")"
          echo "DIGEST=${DIGEST##*@}" >> "$GITHUB_ENV"
      - name: Sign the digest
        run: mise exec -- cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify the signature against the exact identity
        run: |
          mise exec -- cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "${IMAGE}@${DIGEST}"
      - name: Write the image lock
        run: |
          jq -n --arg image "$IMAGE" --arg digest "$DIGEST" --arg signer "$IDENTITY" \
            '{version: 1, authorizedSigners: [$signer], entries: {reference: {image: $image, digest: $digest, signer: $signer}}}' \
            > images.lock.json
          cat images.lock.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images.lock.json
          path: images.lock.json
          if-no-files-found: error
      # The golden-path static frontend template image (ADR 0045), signed by the
      # same keyless identity. It is published only: the image lock above stays
      # the reference image's, because nothing deploys the template yet. The
      # template steps follow the lock, so a template failure cannot leave the
      # signed reference image without it.
      - name: Build, push, sign and verify the static frontend template image
        env:
          TEMPLATE_IMAGE: ghcr.io/corekraft/kore/templates/static-frontend
        run: |
          docker build --tag "$TEMPLATE_IMAGE:$TAG" templates/static-frontend
          docker push "$TEMPLATE_IMAGE:$TAG"
          TEMPLATE_DIGEST="$(docker inspect --format '{{ index .RepoDigests 0 }}' "$TEMPLATE_IMAGE:$TAG")"
          TEMPLATE_DIGEST="${TEMPLATE_DIGEST##*@}"
          echo "TEMPLATE_IMAGE=$TEMPLATE_IMAGE" >> "$GITHUB_ENV"
          echo "TEMPLATE_DIGEST=$TEMPLATE_DIGEST" >> "$GITHUB_ENV"
          mise exec -- cosign sign --yes "${TEMPLATE_IMAGE}@${TEMPLATE_DIGEST}"
          mise exec -- cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "${TEMPLATE_IMAGE}@${TEMPLATE_DIGEST}"
      # The golden-path Kotlin BFF template image (ADR 0046), built by Jib with the
      # agent and the AOT cache, and signed by the same keyless identity. Published
      # only: nothing deploys the template yet, so the lock stays the reference's.
      - name: Build, push, sign and verify the Kotlin BFF template image
        env:
          BFF_TEMPLATE_IMAGE: ghcr.io/corekraft/kore/templates/kotlin-bff
        working-directory: templates/kotlin-bff
        run: |
          # Gradle runs on the runner's JDK 21; stop if the image changes it.
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version 2>&1 | grep -q '"21\.' || { echo "Gradle needs JDK 21, runner has another" >&2; exit 1; }
          mise exec -- gradle --no-daemon jib --image="$BFF_TEMPLATE_IMAGE:$TAG"
          BFF_TEMPLATE_DIGEST="$(cat build/jib-image.digest)"
          echo "BFF_TEMPLATE_IMAGE=$BFF_TEMPLATE_IMAGE" >> "$GITHUB_ENV"
          echo "BFF_TEMPLATE_DIGEST=$BFF_TEMPLATE_DIGEST" >> "$GITHUB_ENV"
          mise exec -- cosign sign --yes "${BFF_TEMPLATE_IMAGE}@${BFF_TEMPLATE_DIGEST}"
          mise exec -- cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "${BFF_TEMPLATE_IMAGE}@${BFF_TEMPLATE_DIGEST}"
      # The record a later deploy reads (ADR 0045, 0046). It is separate from the
      # reference image lock above, which stays the reference's own, and it is
      # written only after both template images are signed.
      - name: Write the template image lock
        run: |
          # Step-level env does not carry over, so stop on an empty value
          # rather than write a lock entry that names no image.
          : "${TEMPLATE_IMAGE:?the static frontend image name is empty}"
          : "${TEMPLATE_DIGEST:?the static frontend digest is empty}"
          : "${BFF_TEMPLATE_IMAGE:?the Kotlin BFF image name is empty}"
          : "${BFF_TEMPLATE_DIGEST:?the Kotlin BFF digest is empty}"
          jq -n --arg signer "$IDENTITY" \
            --arg frontend "$TEMPLATE_IMAGE" --arg frontendDigest "$TEMPLATE_DIGEST" \
            --arg bff "$BFF_TEMPLATE_IMAGE" --arg bffDigest "$BFF_TEMPLATE_DIGEST" \
            '{version: 1, authorizedSigners: [$signer], entries: {
              "static-frontend": {image: $frontend, digest: $frontendDigest, signer: $signer},
              "kotlin-bff": {image: $bff, digest: $bffDigest, signer: $signer}}}' \
            > template-images.lock.json
          cat template-images.lock.json
      # Verifies what the lock records, not what the steps above held, so a
      # deploy that reads the lock refers only to a digest that verified.
      - name: Verify every template lock entry
        run: |
          set -euo pipefail
          jq -r '.entries[] | "\(.image)@\(.digest)"' template-images.lock.json | while IFS= read -r ref; do
            mise exec -- cosign verify \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              "$ref" > /dev/null
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-images.lock.json
          path: template-images.lock.json
          if-no-files-found: error
      # The platform Backstage image (plan 15 step 6): the backend with the
      # Keycloak OIDC module, the Kubernetes plugin and the catalog, signed by the
      # same keyless identity. Published and recorded in its own lock only:
      # nothing deploys it yet (the chart stays behind platform-portal), so it
      # follows every earlier lock and cannot lose them.
      - name: Build, push, sign and verify the Backstage image
        env:
          BACKSTAGE_IMAGE: ghcr.io/corekraft/kore/backstage
        run: |
          docker build --tag "$BACKSTAGE_IMAGE:$TAG" images/backstage
          docker push "$BACKSTAGE_IMAGE:$TAG"
          BACKSTAGE_DIGEST="$(docker inspect --format '{{ index .RepoDigests 0 }}' "$BACKSTAGE_IMAGE:$TAG")"
          BACKSTAGE_DIGEST="${BACKSTAGE_DIGEST##*@}"
          echo "BACKSTAGE_IMAGE=$BACKSTAGE_IMAGE" >> "$GITHUB_ENV"
          echo "BACKSTAGE_DIGEST=$BACKSTAGE_DIGEST" >> "$GITHUB_ENV"
          mise exec -- cosign sign --yes "${BACKSTAGE_IMAGE}@${BACKSTAGE_DIGEST}"
          mise exec -- cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "${BACKSTAGE_IMAGE}@${BACKSTAGE_DIGEST}"
      - name: Write the Backstage image lock
        run: |
          jq -n --arg signer "$IDENTITY" \
            --arg image "$BACKSTAGE_IMAGE" --arg digest "$BACKSTAGE_DIGEST" \
            '{version: 1, authorizedSigners: [$signer], entries: {
              backstage: {image: $image, digest: $digest, signer: $signer}}}' \
            > backstage-image.lock.json
          cat backstage-image.lock.json
      - name: Verify every Backstage lock entry
        run: |
          set -euo pipefail
          jq -r '.entries[] | "\(.image)@\(.digest)"' backstage-image.lock.json | while IFS= read -r ref; do
            mise exec -- cosign verify \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              "$ref" > /dev/null
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backstage-image.lock.json
          path: backstage-image.lock.json
          if-no-files-found: error

  # Mirrors the approved platform images (infra/catalog/seeds.yaml and
  # approved-images.yaml, the owners of the digest pins) into the internal
  # registry (ADR 0033). Same tag-only gate and minimal permissions as
  # `release`; it runs beside it, not after it, so an upstream outage cannot
  # block the reference image.
  mirror:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      # The one place the mirror namespace is chosen.
      MIRROR: ghcr.io/corekraft/kore/mirror
      ISSUER: https://token.actions.githubusercontent.com
      IDENTITY: https://github.com/corekraft/kore/.github/workflows/release.yaml@refs/tags/${{ github.ref_name }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          install_args: cosign crane
          cache: false
      - name: Check the tag is a release version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vX.Y.Z" >&2; exit 1; }
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | mise exec -- crane auth login ghcr.io --username "$ACTOR" --password-stdin
      - name: Mirror, verify, and sign each approved platform image
        run: |
          set -euo pipefail
          # Both catalog files are JSON-compatible YAML, so jq reads them directly.
          # The seeds are the bootstrap exception; approved-images.yaml holds the
          # rest. Together they are the full approved list.
          jq -c '.seeds[] | {ref: .image, name: .catalogImage, provenance: .evidence.provenance}' infra/catalog/seeds.yaml > approved.ndjson
          jq -c '.images[] | {ref: .image, name: .name, provenance: .evidence.provenance}' infra/catalog/approved-images.yaml >> approved.ndjson
          [ -s approved.ndjson ] || { echo "no approved platform images" >&2; exit 1; }
          # A repeated name would overwrite a mirrored copy and collapse a lock entry.
          repeated="$(jq -r .name approved.ndjson | sort | uniq -d)"
          [ -z "$repeated" ] || { echo "duplicate mirror name: $repeated" >&2; exit 1; }
          : > entries.ndjson
          while IFS= read -r seed; do
            ref="$(jq -r .ref <<< "$seed")"
            name="$(jq -r .name <<< "$seed")"
            digest="${ref##*@}"
            upstream="${ref%@*}"
            # Pull by the recorded digest; a different digest is a hard failure.
            pulled="$(mise exec -- crane digest "$ref")"
            if [ "$pulled" != "$digest" ]; then
              echo "$name: upstream returned $pulled, catalog records $digest" >&2
              exit 1
            fi
            if [ "$(jq -r .provenance.signed <<< "$seed")" = "true" ]; then
              upstream_issuer="$(jq -r .provenance.issuer <<< "$seed")"
              upstream_identity="$(jq -r .provenance.identity <<< "$seed")"
              mise exec -- cosign verify \
                --certificate-identity "$upstream_identity" \
                --certificate-oidc-issuer "$upstream_issuer" \
                "$ref" > /dev/null
              provenance="$(jq -nc --arg i "$upstream_issuer" --arg d "$upstream_identity" '{result: "verified", issuer: $i, identity: $d}')"
            else
              echo "$name: upstream publishes no signature (unsigned-upstream)"
              provenance='{"result":"unsigned-upstream"}'
            fi
            # GHCR creates a package from the repository token only when it is
            # linked to the repository, so seed the link first. The copy itself
            # stays bit-identical.
            CRANE="mise exec -- crane" .github/scripts/link-mirror-package.sh "$MIRROR/$name"
            mise exec -- crane copy "$ref" "$MIRROR/$name:$TAG"
            copied="$(mise exec -- crane digest "$MIRROR/$name:$TAG")"
            if [ "$copied" != "$digest" ]; then
              echo "$name: mirror digest $copied differs from upstream $digest" >&2
              exit 1
            fi
            mise exec -- cosign sign --yes "$MIRROR/$name@$digest"
            mise exec -- cosign verify \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              "$MIRROR/$name@$digest" > /dev/null
            jq -nc --arg name "$name" --arg upstream "$upstream" --arg digest "$digest" \
              --arg mirror "$MIRROR/$name@$digest" --argjson provenance "$provenance" --arg signer "$IDENTITY" \
              '{key: $name, value: {upstream: $upstream, upstreamDigest: $digest, mirror: $mirror, provenance: $provenance, signer: $signer}}' >> entries.ndjson
          done < approved.ndjson
      - name: Write the platform image lock
        run: |
          jq -s --arg signer "$IDENTITY" \
            '{version: 1, authorizedSigners: [$signer], entries: from_entries}' entries.ndjson \
            > platform-images.lock.json
          cat platform-images.lock.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-images.lock.json
          path: platform-images.lock.json
          if-no-files-found: error

  # Attaches the platform image lock to the GitHub release release-please
  # created, so a committed overlay can be checked against it with
  # `kore validate --platform-image-lock` (ADR 0044). The lock is evidence, not
  # authority: admission still verifies each image's signature, so this job
  # holds only the scope to write release assets, none of the signing job's. A rerun may
  # repeat an identical upload; a different lock never replaces a published one.
  attach-lock:
    needs: mirror
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: platform-images.lock.json
      - name: Attach the lock to the release
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx platform-images.lock.json; then
            gh release download "$TAG" --pattern platform-images.lock.json --dir published
            cmp published/platform-images.lock.json platform-images.lock.json || {
              echo "release $TAG already has a different platform-images.lock.json; refusing to replace it" >&2
              exit 1
            }
            echo "release $TAG already carries this lock"
          else
            gh release upload "$TAG" platform-images.lock.json
          fi

  # Attaches the template image lock to the GitHub release, as attach-lock does
  # for the platform lock (ADR 0044): evidence for a later deploy-by-digest, from
  # a job with only the scope to write release assets. A rerun may repeat an
  # identical upload; a different lock never replaces a published one.
  attach-template-lock:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: template-images.lock.json
      - name: Attach the template lock to the release
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx template-images.lock.json; then
            gh release download "$TAG" --pattern template-images.lock.json --dir published
            cmp published/template-images.lock.json template-images.lock.json || {
              echo "release $TAG already has a different template-images.lock.json; refusing to replace it" >&2
              exit 1
            }
            echo "release $TAG already carries this lock"
          else
            gh release upload "$TAG" template-images.lock.json
          fi

  # Attaches the Backstage image lock to the GitHub release, as
  # attach-template-lock does: from a job with only the scope to write release
  # assets. A rerun may repeat an identical upload; a different lock never
  # replaces a published one.
  attach-backstage-lock:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: backstage-image.lock.json
      - name: Attach the Backstage lock to the release
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx backstage-image.lock.json; then
            gh release download "$TAG" --pattern backstage-image.lock.json --dir published
            cmp published/backstage-image.lock.json backstage-image.lock.json || {
              echo "release $TAG already has a different backstage-image.lock.json; refusing to replace it" >&2
              exit 1
            }
            echo "release $TAG already carries this lock"
          else
            gh release upload "$TAG" backstage-image.lock.json
          fi

  # Packages the configuration-phase releases Argo CD takes over (ADR 0043) as
  # Helm charts and pushes them to the platform OCI registry under immutable,
  # content-addressed versions. Each digest is signed keylessly by this tag's
  # identity, verified, and recorded in a lock that is a separate artifact from
  # the image locks above. A rerun finds the version already published and keeps
  # it; a different digest under a published version fails.
  charts:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: charts-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      # The one place the chart namespace is chosen.
      CHARTS: ghcr.io/corekraft/kore/charts
      ISSUER: https://token.actions.githubusercontent.com
      IDENTITY: https://github.com/corekraft/kore/.github/workflows/release.yaml@refs/tags/${{ github.ref_name }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          install_args: cosign crane helm
          cache: false
      - name: Check the tag is a release version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vX.Y.Z" >&2; exit 1; }
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | mise exec -- crane auth login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | mise exec -- helm registry login ghcr.io --username "$ACTOR" --password-stdin
      - name: Package, push, sign and verify each configuration chart
        run: |
          set -euo pipefail
          mise exec -- .github/scripts/package-platform-charts.sh packaged > packaged.ndjson
          : > entries.ndjson
          while IFS= read -r row; do
            name="$(jq -r .name <<< "$row")"
            version="$(jq -r .version <<< "$row")"
            file="$(jq -r .file <<< "$row")"
            CRANE="mise exec -- crane" .github/scripts/link-mirror-package.sh "$CHARTS/$name"
            if digest="$(mise exec -- crane digest "$CHARTS/$name:$version" 2> /dev/null)"; then
              echo "$name $version already published as $digest; not pushing again"
            else
              mise exec -- helm push "packaged/$file" "oci://$CHARTS" 2>&1 | tee push.log
              digest="$(sed -n 's/^Digest: //p' push.log | tail -n 1)"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "$name: helm push reported no digest" >&2; exit 1; }
              [ "$(mise exec -- crane digest "$CHARTS/$name:$version")" = "$digest" ] || {
                echo "$name $version already published with a different digest" >&2
                exit 1
              }
            fi
            mise exec -- cosign sign --yes "$CHARTS/$name@$digest"
            mise exec -- cosign verify \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              "$CHARTS/$name@$digest" > /dev/null
            jq -nc --arg name "$name" --arg chart "$CHARTS/$name" --arg version "$version" \
              --arg digest "$digest" --arg signer "$IDENTITY" \
              '{key: $name, value: {chart: $chart, version: $version, digest: $digest, signer: $signer}}' >> entries.ndjson
          done < packaged.ndjson
      - name: Write the platform chart lock
        run: |
          jq -s --arg signer "$IDENTITY" \
            '{version: 1, authorizedSigners: [$signer], entries: from_entries}' entries.ndjson \
            > platform-charts.lock.json
          cat platform-charts.lock.json
      # Verifies what the lock records, so a deploy that reads it refers only to
      # a digest that verified.
      - name: Verify every chart lock entry
        run: |
          set -euo pipefail
          jq -r '.entries[] | "\(.chart)@\(.digest)"' platform-charts.lock.json | while IFS= read -r ref; do
            mise exec -- cosign verify \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              "$ref" > /dev/null
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-charts.lock.json
          path: platform-charts.lock.json
          if-no-files-found: error
          retention-days: 30

  # Publishes the platform configuration charts from main on every push, so a
  # local live proof can install a chart fix without a release (ADR 0138). It
  # signs with the main workflow identity, which the signer guard admits only
  # behind this job's exact main gate, and it uploads the lock as a 30-day
  # artifact named by commit, never as a release asset. Only the release chart
  # lock counts for activation.
  charts-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: charts-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      # The one place the chart namespace is chosen, as in charts.
      CHARTS: ghcr.io/corekraft/kore/charts
      ISSUER: https://token.actions.githubusercontent.com
      # This job runs only on main, so the workflow file's ref is refs/heads/main.
      IDENTITY: https://github.com/corekraft/kore/.github/workflows/release.yaml@refs/heads/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          install_args: cosign crane helm
          cache: false
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | mise exec -- crane auth login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | mise exec -- helm registry login ghcr.io --username "$ACTOR" --password-stdin
      - name: Package, push and sign each configuration chart
        run: |
          set -euo pipefail
          mise exec -- .github/scripts/package-platform-charts.sh packaged > packaged.ndjson
          : > entries.ndjson
          while IFS= read -r row; do
            name="$(jq -r .name <<< "$row")"
            version="$(jq -r .version <<< "$row")"
            file="$(jq -r .file <<< "$row")"
            CRANE="mise exec -- crane" .github/scripts/link-mirror-package.sh "$CHARTS/$name"
            if digest="$(mise exec -- crane digest "$CHARTS/$name:$version" 2> /dev/null)"; then
              echo "$name $version already published as $digest; not pushing again"
            else
              mise exec -- helm push "packaged/$file" "oci://$CHARTS" 2>&1 | tee push.log
              digest="$(sed -n 's/^Digest: //p' push.log | tail -n 1)"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "$name: helm push reported no digest" >&2; exit 1; }
              [ "$(mise exec -- crane digest "$CHARTS/$name:$version")" = "$digest" ] || {
                echo "$name $version already published with a different digest" >&2
                exit 1
              }
            fi
            # A digest the main identity already verifies gets no new signature,
            # so a push that changes no chart adds nothing to the registry.
            if ! mise exec -- cosign verify \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              "$CHARTS/$name@$digest" > /dev/null 2>&1; then
              mise exec -- cosign sign --yes "$CHARTS/$name@$digest"
            fi
            jq -nc --arg name "$name" --arg chart "$CHARTS/$name" --arg version "$version" \
              --arg digest "$digest" --arg signer "$IDENTITY" \
              '{key: $name, value: {chart: $chart, version: $version, digest: $digest, signer: $signer}}' >> entries.ndjson
          done < packaged.ndjson
      - name: Write the platform chart lock
        run: |
          jq -s --arg signer "$IDENTITY" \
            '{version: 1, authorizedSigners: [$signer], entries: from_entries}' entries.ndjson \
            > platform-charts.lock.json
          cat platform-charts.lock.json
      # Every entry must verify against the main identity before the lock is uploaded.
      - name: Verify every chart lock entry
        run: |
          set -euo pipefail
          jq -r '.entries[] | "\(.chart)@\(.digest)"' platform-charts.lock.json | while IFS= read -r ref; do
            mise exec -- cosign verify \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              "$ref" > /dev/null
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-charts.lock.json-${{ github.sha }}
          path: platform-charts.lock.json
          if-no-files-found: error
          retention-days: 30

  # Attaches the chart lock to the GitHub release, as attach-lock does for the
  # platform image lock (ADR 0044): evidence, from a job with only the scope to
  # write release assets. A rerun may repeat an identical upload; a different
  # lock never replaces a published one.
  attach-chart-lock:
    needs: charts
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: platform-charts.lock.json
      - name: Attach the chart lock to the release
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx platform-charts.lock.json; then
            gh release download "$TAG" --pattern platform-charts.lock.json --dir published
            cmp published/platform-charts.lock.json platform-charts.lock.json || {
              echo "release $TAG already has a different platform-charts.lock.json; refusing to replace it" >&2
              exit 1
            }
            echo "release $TAG already carries this lock"
          else
            gh release upload "$TAG" platform-charts.lock.json
          fi
