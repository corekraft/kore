# Manual live run: ONE chosen `test:live:<suite>` on a hosted runner, on demand
# (#623; local Docker is unavailable). It reuses nightly.sh with a single suite,
# so the clean `kore local up`, the scratch environment and the teardown are
# exactly the nightly's, and the teardown always runs last.
#
# Runs only on dispatch: no schedule, push or pull_request trigger.
# Concurrency: the nightly's own group, so two live runs, or a live run and the
# nightly, never overlap and a run in progress is never cancelled.
#
# Host caveat: numbers from this workflow come from a github-hosted runner, a
# different host from the local VM. A footprint run is recorded with its true
# host (runner label, vCPU, memory) and method, and is never described as the
# local VM. The `runs` input takes several clean measurements in one job, each
# printed with its load average beside it. The footprint suite reads macOS
# `sysctl vm.swapusage` and fails on a Linux runner (#659), so the default suite
# is lifecycle; footprint stays selectable. nightly.sh also skips measurement-only
# suites (#662), so choosing footprint ends with "found no test:live suites"
# until #659 lets a measurement suite run here.
#
# A footprint taken here must not be recorded as the local Now baseline for
# #614/#623 (the local VM is a different host); it needs the owner's decision on
# the issue first.

name: live

on:
  workflow_dispatch:
    inputs:
      suite:
        description: The test:live suite to run
        type: choice
        default: lifecycle
        options:
          - admission
          - database
          - docs
          - footprint
          - gate
          - gateway
          - identity
          - ingress-measure
          - lifecycle
          - ops
          - policy
          - reference
          - registry
          - resilience
          - signer
          - storage
          - telemetry
      runs:
        description: Footprint measurements in one job (2 to 5); other suites ignore it
        type: number
        default: 3

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      KORE_RUN_NIGHTLY: "1"
    steps:
      - name: Check the runs input
        if: inputs.suite == 'footprint'
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          if ! { [[ "$RUNS" =~ ^[0-9]+$ ]] && [ "$RUNS" -ge 2 ] && [ "$RUNS" -le 5 ]; }; then
            echo "runs must be a whole number from 2 to 5, got '$RUNS'" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: false
      - name: Install CLI dependencies
        run: npm ci --prefix tools/kore
      - name: Clean local up and the chosen live suite
        env:
          KORE_NIGHTLY_SUITES: test:live:${{ inputs.suite }}
          KORE_FOOTPRINT_RUNS: ${{ inputs.runs }}
        run: tools/kore/scripts/nightly.sh 2>&1 | tee "$RUNNER_TEMP/live.log"
      - name: Print the suite output in the job summary
        if: always()
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          {
            echo "### live suite: $SUITE"
            echo "runner: ${RUNNER_NAME} (${RUNNER_OS} ${RUNNER_ARCH}), $(nproc) vCPU, $(awk '/^MemTotal:/ { printf "%d", $2 / 1024 }' /proc/meminfo) MiB"
            echo '```'
            tail -n 400 "$RUNNER_TEMP/live.log" 2>/dev/null || echo "no output captured"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
