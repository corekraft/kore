name: integration

# The merge check for the integration tier (ADR 0098). A pull request that touches
# the commit hooks or the harness hook scripts runs the tier and must pass it before
# it merges; any other pull request skips the tier. The check is always reported, so
# a skipped run still satisfies a required check.

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      hooks: ${{ steps.filter.outputs.hooks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$changed" | grep -qE '^(\.claude/(hooks|evals)/|tools/kore/\.husky/|tools/harness/src/hook/|tools/[^/]+/integration/|tools/[^/]+/vitest\.integration\.config\.ts$|\.github/workflows/integration\.yml$)'; then
            echo "hooks=true" >> "$GITHUB_OUTPUT"
          else
            echo "hooks=false" >> "$GITHUB_OUTPUT"
          fi

  integration:
    needs: changes
    if: needs.changes.outputs.hooks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          install_args: node npm
          cache: true
      - name: Install CLI dependencies
        run: npm ci --prefix tools/kore
      - name: Install harness dependencies
        run: npm ci --prefix tools/harness
      - name: Run the integration tier
        run: mise run test-integration
