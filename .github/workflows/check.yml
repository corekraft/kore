name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          install_args: node npm opa
          cache: true
      - name: Install CLI dependencies
        run: npm ci --prefix tools/kore
      - name: Typecheck
        run: npm --prefix tools/kore run check
      - name: Unit tests
        run: mise run test
      - name: Harness tests
        run: mise run test-hooks
      - name: Policy tests
        run: mise run test-opa
      - name: Validate catalogs
        run: mise run validate
      - name: Knowledge base
        run: mise run kb-check -- --strict
