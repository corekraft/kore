name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          install_args: node npm opa gator helm promtool opentofu
          cache: true
      - name: Install CLI dependencies
        run: npm ci --prefix tools/kore
      - name: Install harness dependencies
        run: npm ci --prefix tools/harness
      - name: Typecheck
        run: npm --prefix tools/kore run check
      - name: Unit tests
        run: mise run test
      - name: Harness tests
        run: mise run test-hooks
      - name: Policy tests
        run: mise run test-opa
      - name: Gatekeeper policy tests
        run: mise run test-gatekeeper
      - name: Test Prometheus rules
        run: mise run test-promtool
      - name: Validate catalogs
        run: mise run validate
      - name: Validate OpenTofu stacks
        run: mise run validate-tofu
      - name: Knowledge base
        run: mise run kb-check -- --strict

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          install_args: trufflehog osv-scanner semgrep actionlint zizmor hadolint
          cache: true
      - name: Security and quality scans
        run: mise run scan
