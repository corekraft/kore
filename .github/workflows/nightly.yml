# Nightly live proof (issue #339, retro finding 6). The `check` workflow never
# starts a cluster, so the opt-in live suites would otherwise run only by
# hand. This runs a clean `kore local up` and then every named
# `test:live:<name>` suite once a night, `lifecycle` last. The bare
# `test:live` task is skipped (ADR 0093).
#
# The run's conclusion is the status on main: a scheduled run belongs to the
# default branch's latest commit, and the workflow needs no write permission.
# A failed run notifies the person who last edited the schedule.
#
# Runner: `ubuntu-latest`, the free hosted Linux runner (4 vCPU, 16 GB for
# public repositories; plan 9 measured k3s peaking at 6.7 GiB). The job gets a
# fresh VM and must not assume a dedicated or macOS host. If a run does not fit,
# use a larger hosted runner; the self-hosted trust controls in ADR 0093 are the
# fallback.

name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      KORE_RUN_NIGHTLY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: false
      - name: Install CLI dependencies
        run: npm ci --prefix tools/kore
      - name: Clean local up and the live suites
        run: tools/kore/scripts/nightly.sh
