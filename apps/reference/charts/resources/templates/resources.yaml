apiVersion: platform.kore.dev/v1alpha1
kind: PostgreSQLInstance
metadata:
  name: reference-db
  labels:
    {
      app.kubernetes.io/part-of: reference,
      platform.kore.dev/retention: {{ .Values.database.retentionPolicy | quote }},
    }
spec:
  serviceClass: development
  storageSize: {{ .Values.database.storageSize | quote }}
  compatibilityVersion: {{ .Values.database.compatibilityVersion }}
  connectionSecretName: {{ .Values.database.connectionSecretName | quote }}
  retentionPolicy: {{ .Values.database.retentionPolicy | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: reference-app }
spec:
  refreshInterval: 1h
  secretStoreRef:
    { kind: ClusterSecretStore, name: {{ .Values.platform.secretStore | quote }} }
  target:
    name: reference-app
    template:
      metadata: { labels: { app.kubernetes.io/part-of: reference } }
  data:
    - secretKey: API_TOKEN
      remoteRef: { key: reference-app, property: API_TOKEN }
