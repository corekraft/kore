apiVersion: v1
kind: ServiceAccount
metadata:
  name: reference-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: reference-migrate
  labels: {app.kubernetes.io/name: reference-migrate, app.kubernetes.io/part-of: reference}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels: {app.kubernetes.io/name: reference-migrate, app.kubernetes.io/part-of: reference, platform.kore.dev/service-account: reference-migrate, istio.io/dataplane-mode: ambient}
    spec:
      serviceAccountName: reference-migrate
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{- if .Values.image.digest }}{{ .Values.image.repository }}@{{ .Values.image.digest }}{{ else }}{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [node, --experimental-strip-types, src/migrate-main.ts]
          env:
            - {name: PGHOST, valueFrom: {secretKeyRef: {name: reference-db-connection, key: host}}}
            - {name: PGPORT, valueFrom: {secretKeyRef: {name: reference-db-connection, key: port}}}
            - {name: PGDATABASE, valueFrom: {secretKeyRef: {name: reference-db-connection, key: database}}}
            - {name: PGUSER, valueFrom: {secretKeyRef: {name: reference-db-connection, key: username}}}
            - {name: PGSSLMODE, valueFrom: {secretKeyRef: {name: reference-db-connection, key: sslmode}}}
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.database.passwordSecret.name }}, key: {{ .Values.database.passwordSecret.key }}}}}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, capabilities: {drop: [ALL]}}
