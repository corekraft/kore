{{- range $component := list "frontend" "api" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reference-{{ $component }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reference-{{ $component }}
  labels: {app.kubernetes.io/name: reference-{{ $component }}, app.kubernetes.io/part-of: reference}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: reference-{{ $component }}}}
  template:
    metadata:
      {{- if $.Values.secretVersion }}
      annotations: {platform.kore.dev/secret-version: {{ $.Values.secretVersion | quote }}}
      {{- end }}
      labels: {app.kubernetes.io/name: reference-{{ $component }}, app.kubernetes.io/part-of: reference, platform.kore.dev/service-account: reference-{{ $component }}, istio.io/dataplane-mode: ambient}
    spec:
      serviceAccountName: reference-{{ $component }}
      automountServiceAccountToken: false
      containers:
        - name: app
          image: "{{- if $.Values.image.digest }}{{ $.Values.image.repository }}@{{ $.Values.image.digest }}{{ else }}{{ $.Values.image.repository }}:{{ $.Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - {name: APP_MODE, value: {{ $component | quote }}}
            - {name: OTEL_SERVICE_NAME, value: reference-{{ $component }} }
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ $.Values.platform.otlpEndpoint | quote }}}
            - {name: API_URL, value: "http://reference-api:8080"}
            {{- if eq $component "api" }}
            - {name: PGHOST, valueFrom: {secretKeyRef: {name: reference-db-connection, key: host}}}
            - {name: PGPORT, valueFrom: {secretKeyRef: {name: reference-db-connection, key: port}}}
            - {name: PGDATABASE, valueFrom: {secretKeyRef: {name: reference-db-connection, key: database}}}
            - {name: PGUSER, valueFrom: {secretKeyRef: {name: reference-db-connection, key: username}}}
            - {name: PGSSLMODE, valueFrom: {secretKeyRef: {name: reference-db-connection, key: sslmode}}}
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: {{ $.Values.database.passwordSecret.name }}, key: {{ $.Values.database.passwordSecret.key }}}}}
            {{- end }}
            - {name: API_TOKEN, valueFrom: {secretKeyRef: {name: reference-app, key: API_TOKEN}}}
          ports: [{name: http, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /livez, port: http}, initialDelaySeconds: 2, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          resources: {{ toYaml $.Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: reference-{{ $component }}
  {{ if eq $component "api" }}
  labels: {istio.io/use-waypoint: reference-api-waypoint}
  {{ end }}
spec:
  selector: {app.kubernetes.io/name: reference-{{ $component }}}
  ports: [{name: http, port: 8080, targetPort: http}]
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: reference}
spec:
  parentRefs:
    - {name: {{ .Values.platform.gateway.name }}, namespace: {{ .Values.platform.gateway.namespace }} }
  hostnames: [{{ .Values.platform.gateway.hostname | quote }}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: reference-frontend, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: reference-api-waypoint
  labels: {istio.io/waypoint-for: service}
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    annotations: {ambient.istio.io/xfcc-include-client-identity: "true"}
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: strict}
spec:
  selector: {matchLabels: {app.kubernetes.io/part-of: reference}}
  mtls: {mode: STRICT}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: api-default-deny}
spec: {selector: {matchLabels: {app.kubernetes.io/name: reference-api}}}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: api-allow-frontend}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: reference-api}}
  action: ALLOW
  rules:
    - from: [{source: {principals: ["cluster.local/ns/{{ .Release.Namespace }}/sa/reference-api-waypoint"]}}]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: api-allow-frontend-l7}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: reference-api
  action: ALLOW
  rules:
    - from: [{source: {principals: ["cluster.local/ns/{{ .Release.Namespace }}/sa/reference-frontend"]}}]
      to: [{operation: {paths: ["/api", "/api/protected"]}}]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: api-opa-protected}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: reference-api
  action: CUSTOM
  provider: {name: opa-authorizer}
  rules: [{to: [{operation: {paths: ["/api/protected"]}}]}]
