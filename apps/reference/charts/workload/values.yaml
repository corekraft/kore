image: { repository: kore/reference, tag: 0.1.0, pullPolicy: IfNotPresent }
platform:
  secretStore: platform-secrets
  gateway: { name: kore-gateway, namespace: kore-system, hostname: REQUIRED }
  otlpEndpoint: http://otel-collector.observability.svc:4318
resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { cpu: 250m, memory: 256Mi }

# Off by default; an environment turns it on through chart values. With it on
# the Deployments carry no replica count: the autoscaler is the only owner
# (ADR 0047).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
# Needs autoscaling.enabled, so the budget never sits over a single replica.
podDisruptionBudget:
  enabled: false
  # Set at most one of the two; with neither set, minAvailable is 1. A
  # minAvailable at or above autoscaling.minReplicas is refused.
  minAvailable: null
  maxUnavailable: null

database:
  # The connection Secret's passwordSecretRef names the Secret that holds the
  # password; Helm cannot dereference it, so the chart is told the same name.
  passwordSecret: { name: reference-db-app, key: password }
migrate:
  activeDeadlineSeconds: 600

# Opaque marker of the secrets this workload consumes; a new value restarts the
# pods. Set by the deployer, never carries secret data.
secretVersion: ""
