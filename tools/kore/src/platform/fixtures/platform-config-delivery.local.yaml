# Source: platform-config-delivery/templates/applications.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kore-platform-config
  namespace: argocd
  labels:
    platform.kore.dev/release: kore-platform-config
spec:
  project: "platform-configuration"
  source:
    repoURL: "oci://ghcr.io/corekraft/kore/charts/kore-platform-config"
    path: "."
    targetRevision: "sha256:6666666666666666666666666666666666666666666666666666666666666666"
    helm:
      releaseName: "kore-platform-config"
      parameters:
        - name: "gateway.className"
          value: "agentgateway"
        - name: "gateway.hostname"
          value: "kore.local"
        - name: "gateway.platformHostname"
          value: "*.platform.kore.local"
  destination:
    server: https://kubernetes.default.svc
    namespace: "kore-system"
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true

