---
# Source: platform-config/templates/namespaces.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: kore-system
  labels: {app.kubernetes.io/managed-by: Helm}

---
# Source: platform-config/templates/namespaces.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: kore-secret-source
  labels:
    app.kubernetes.io/managed-by: Helm
    platform.kore.dev/secret-source: "true"


---
# Source: platform-config/templates/gateway-service.yaml
# Istio generates the Gateway's Service and merges this overlay into it. The
# environment decides how the Service is published (an overlay that reaches the
# Gateway through a node port, say); the chart names no provider.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kore-gateway-service
  namespace: kore-system
  labels: {app.kubernetes.io/managed-by: Helm}
data:
  service: |
    spec:
      type: NodePort
      ports:
        - port: 8443
          nodePort: 30443

---
# Source: platform-config/templates/mesh-policy.yaml
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: default-deny, namespace: kore-system}
spec: {}

---
# Source: platform-config/templates/mesh-policy.yaml
# The Gateway is the intentional public entry point; keep the rest of
# kore-system denied by default while allowing HTTPS traffic to this Gateway.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: gateway-allow-https, namespace: kore-system}
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: kore-gateway
  action: ALLOW
  rules:
    - to:
        - operation:
            ports: ["8443"]

---
# Source: platform-config/templates/secret-store.yaml
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: kore-secret-source
      server:
        url: https://kubernetes.default.svc
        caProvider: {type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: kore-secret-source}
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets


---
# Source: platform-config/templates/gateway.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kore-gateway
  namespace: kore-system
  labels: {app.kubernetes.io/managed-by: Helm}
spec:
  infrastructure:
    parametersRef: {group: "", kind: ConfigMap, name: kore-gateway-service}
  gatewayClassName: istio
  listeners:
    - name: https
      hostname: "kore.local"
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: kore-local-tls}
      allowedRoutes:
        namespaces: {from: All}

---
# Source: platform-config/templates/mesh-policy.yaml
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: default, namespace: kore-system}
spec: {mtls: {mode: STRICT}}
