apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: kore-upstream-images
  labels: {app.kubernetes.io/managed-by: Helm}
spec:
  mode: warn
  images:
    - glob: "index.docker.io/istio/proxyv2**"
    - glob: "ghcr.io/cloudnative-pg/postgresql**"
    - glob: "ghcr.io/cloudnative-pg/cloudnative-pg**"
  authorities:
    - name: kore-managed-upstream
      static:
        action: pass
