---
# Source: image-policy/templates/clusterimagepolicy.yaml
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: kore-platform-images
  labels: {app.kubernetes.io/managed-by: Helm}
spec:
  mode: warn
  images:
    - glob: "registry.example:5000/**"
  authorities:
    - name: release-workflow
      keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - issuer: "https://token.actions.githubusercontent.com"
            subject: "https://github.com/corekraft/kore/.github/workflows/release.yaml@refs/tags/v0.3.2"
          - issuer: "https://token.actions.githubusercontent.com"
            subject: "https://github.com/corekraft/kore/.github/workflows/release.yaml@refs/tags/v0.4.0"
      ctlog:
        url: https://rekor.sigstore.dev
      source:
        - signaturePullSecrets:
            - name: "kore-registry-read"

