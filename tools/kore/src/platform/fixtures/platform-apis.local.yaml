# Source: platform-apis/templates/organization-xrd.yaml
# Cluster scope: ADR 0115 (the namespace composition creates cluster-scoped Namespaces).
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: organizations.platform.kore.dev
spec:
  scope: Cluster
  group: platform.kore.dev
  names:
    kind: Organization
    plural: organizations
  defaultCompositionRef:
    name: organization-local
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          # A suborg is an Organization one level below the tenant root `platform` (ADR 0165).
          # Its name is its namespace, so it is a DNS label of at most 54 characters
          # (<suborg>--preview fits 63), with no double hyphen; its quota has no default,
          # so an unbounded suborg cannot be written. Reserved names are refused by
          # kore validate, which holds the platform namespaces (ADR 0165).
          x-kubernetes-validations:
            - rule: "self.metadata.name.matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$')"
              message: "metadata.name must be a single DNS label (lowercase letters, digits and hyphens, at most 63 characters, no dots)"
            - rule: "self.metadata.name == 'platform' || self.metadata.name.size() <= 54"
              message: "metadata.name must be at most 54 characters, so <suborg>--preview fits 63; shorten it"
            - rule: "!self.metadata.name.contains('--')"
              message: "metadata.name must not contain a double hyphen: the suborg namespace is <suborg> and its preview is <suborg>--preview; rename it"
            - rule: "self.metadata.name != 'platform' || !has(self.spec.parent)"
              message: "the platform organization is the tenant root and has no parent; remove spec.parent"
            - rule: "self.metadata.name == 'platform' || has(self.spec.parent)"
              message: 'spec.parent is required for a suborg; set it to "platform", the tenant root'
            - rule: "!has(self.spec.parent) || self.spec.parent == 'platform'"
              message: 'spec.parent must be "platform", the tenant root: v1 places a suborg one level below it; set it to "platform"'
            - rule: "self.metadata.name == 'platform' || has(self.spec.quota)"
              message: "spec.quota is required for a suborg, and has no default: set requests.cpu, requests.memory, pods and storage"
          properties:
            spec:
              type: object
              required: [tenant]
              properties:
                tenant:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"
                parent:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"
                # The quota of a suborg: requests for cpu and memory, a pod count and the
                # storage it may request. Required for a suborg by the rules above, with no
                # default; the platform organization carries none.
                quota:
                  type: object
                  required: [requests, pods, storage]
                  additionalProperties: false
                  properties:
                    requests:
                      type: object
                      required: [cpu, memory]
                      additionalProperties: false
                      properties:
                        cpu: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?m?$" }
                        memory: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?(Mi|Gi|Ti)$" }
                    pods: { type: integer, minimum: 1 }
                    storage: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?(Gi|Ti)$" }
            status:
              type: object
              properties:
                conditions:
                  { type: array, x-kubernetes-preserve-unknown-fields: true }
                phase: { type: string }

