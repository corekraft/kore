# Source: reference-workload/templates/workloads.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reference-frontend
  labels: {app.kubernetes.io/name: reference-frontend, app.kubernetes.io/part-of: reference}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: reference-frontend}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: reference-frontend, app.kubernetes.io/part-of: reference, platform.kore.dev/service-account: reference-frontend, istio.io/dataplane-mode: ambient}
    spec:
      serviceAccountName: reference-frontend
      automountServiceAccountToken: false
      containers:
        - name: app
          image: "kore/reference:0.1.0"
          imagePullPolicy: IfNotPresent
          env:
            - {name: APP_MODE, value: "frontend"}
            - {name: OTEL_SERVICE_NAME, value: reference-frontend }
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc:4318"}
            - {name: API_URL, value: "http://reference-api:8080"}
            - {name: API_TOKEN, valueFrom: {secretKeyRef: {name: reference-app, key: API_TOKEN}}}
          ports: [{name: http, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /livez, port: http}, initialDelaySeconds: 2, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          resources: 
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, capabilities: {drop: [ALL]}}

