---
# Source: golden-path-workload/templates/workload.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-bff
  labels:
    app.kubernetes.io/name: auth-bff
    app.kubernetes.io/part-of: auth
spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-bff
        app.kubernetes.io/part-of: auth
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: bff
          image: "ghcr.io/corekraft/kore/kotlin-bff-template@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

