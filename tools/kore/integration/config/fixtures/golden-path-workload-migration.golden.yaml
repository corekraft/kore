---
# Source: golden-path-workload/templates/migration.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  labels:
    app.kubernetes.io/name: auth-migrate
    app.kubernetes.io/part-of: auth
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-migrate
        app.kubernetes.io/part-of: auth
    spec:
      serviceAccountName: auth-migrate
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "ghcr.io/corekraft/kore/kotlin-bff-template@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          command: ["node","--experimental-strip-types","src/migrate-main.ts"]
          env:
            - {name: PGHOST, valueFrom: {secretKeyRef: {name: auth-db-ddl, key: host}}}
            - {name: PGPORT, valueFrom: {secretKeyRef: {name: auth-db-ddl, key: port}}}
            - {name: PGDATABASE, valueFrom: {secretKeyRef: {name: auth-db-ddl, key: database}}}
            - {name: PGUSER, valueFrom: {secretKeyRef: {name: auth-db-ddl, key: username}}}
            - {name: PGSSLMODE, valueFrom: {secretKeyRef: {name: auth-db-ddl, key: sslmode}}}
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: auth-db-ddl, key: password}}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
