---
# Source: kore-postgresql-api/templates/definition.yaml
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgresqlinstances.platform.kore.dev
spec:
  scope: Namespaced
  group: platform.kore.dev
  names:
    kind: PostgreSQLInstance
    plural: postgresqlinstances
  defaultCompositionRef:
    name: postgresqlinstance-local
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required:
                [
                  serviceClass,
                  storageSize,
                  compatibilityVersion,
                  connectionSecretName,
                  retentionPolicy,
                ]
              properties:
                serviceClass: { type: string, enum: [development, standard] }
                storageSize: { type: string, pattern: "^[1-9][0-9]*Gi$" }
                compatibilityVersion: { type: integer, enum: [16, 17, 18] }
                connectionSecretName:
                  { type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" }
                retentionPolicy: { type: string, enum: [Delete, Retain] }
            status:
              type: object
              properties:
                conditions:
                  { type: array, x-kubernetes-preserve-unknown-fields: true }
                endpoint: { type: string }
                phase: { type: string }
                failureReason: { type: string }
                host: { type: string }
                port: { type: integer }

---
# Source: kore-postgresql-api/templates/composition-database-routes.yaml
# With database-routes on, the composition gains the derived name, the local CA's
# certificate and the verifying connection keys (ADR 0137). The Go template bodies
# live beside it, unrendered by helm; the header line carries the platform values
# that kore passes, so the composition reads them without a second source. The
# serviceClassInstances header tells the compose step whether to derive its
# instances from the claim's serviceClass (ADR 0154); it is set only while the flag is on.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgresqlinstance-local
  labels: { platform.kore.dev/provider: local }
spec:
  compositeTypeRef:
    { apiVersion: platform.kore.dev/v1alpha1, kind: PostgreSQLInstance }
  mode: Pipeline
  pipeline:
    - step: compose-cloudnative-pg
      functionRef: { name: function-go-templating }
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $routes := dict "domain" "kore.internal" "organizationId" "platform" "issuer" "kore-local-ca" "gatewayName" "kore-gateway" "gatewayNamespace" "kore-system" "sectionName" "postgres" }}
            {{- $serviceClassInstances := false }}
            {{- $images := dict "16" "ghcr.io/cloudnative-pg/postgresql:16.4@sha256:99be063781d171d3971089b49c992706bdab9ccbd2b57cdf126c7542773aedfe" "17" "ghcr.io/cloudnative-pg/postgresql:17.4@sha256:3c0ba08ea353c9705a755c113e4ae395be76553e0ed68076e5410cb09b9d17d9" "18" "ghcr.io/cloudnative-pg/postgresql:18.4@sha256:6138f19539304b585c6cafd1af82ca407f184139459a8e06f0880df4556d3588" }}
            {{- $name := .observed.composite.resource.metadata.name }}
            {{- $namespace := .observed.composite.resource.metadata.namespace }}
            {{- $version := .observed.composite.resource.spec.compatibilityVersion | int }}
            {{- $host := printf "%s.%s.%s" $name $routes.organizationId $routes.domain }}
            {{- $certificates := ne $version 16 }}
            {{- $standard := eq (default "development" .observed.composite.resource.spec.serviceClass) "standard" }}
            {{- $memory := ternary "1Gi" "512Mi" $standard }}
            apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: {{ .observed.composite.resource.metadata.name }}
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: database
              labels:
                platform.kore.dev/retention: {{ .observed.composite.resource.spec.retentionPolicy }}
            spec:
              instances: {{ if $serviceClassInstances }}{{ ternary 2 1 $standard }}{{ else }}1{{ end }}
            {{- if $serviceClassInstances }}
              enablePDB: {{ $standard }}
              primaryUpdateMethod: switchover
              resources:
                requests:
                  memory: {{ $memory }}
                limits:
                  memory: {{ $memory }}
            {{- end }}
              inheritedMetadata:
                labels:
                  platform.kore.dev/retention: {{ .observed.composite.resource.spec.retentionPolicy }}
                  istio.io/dataplane-mode: none
              imageName: {{ index $images (.observed.composite.resource.spec.compatibilityVersion | int | toString) }}
              storage:
                size: {{ .observed.composite.resource.spec.storageSize }}
                storageClass: {{ if eq .observed.composite.resource.spec.retentionPolicy "Retain" }}kore-retained{{ else }}kore-standard{{ end }}
              bootstrap: {initdb: {database: app, owner: app}}
            {{- if $certificates }}
              certificates:
                serverTLSSecret: {{ $name }}-server-tls
                serverCASecret: {{ $name }}-server-tls
            {{- end }}
            {{- if $certificates }}
            ---
            apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: {{ $name }}-server
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: server-certificate
            spec:
              secretName: {{ $name }}-server-tls
              secretTemplate:
                labels:
                  cnpg.io/reload: ""
              dnsNames:
                - {{ $host }}
                - {{ $name }}-rw
                - {{ $name }}-rw.{{ $namespace }}.svc
                - {{ $name }}-ro
                - {{ $name }}-ro.{{ $namespace }}.svc
                - {{ $name }}-r
                - {{ $name }}-r.{{ $namespace }}.svc
              issuerRef:
                kind: ClusterIssuer
                name: {{ $routes.issuer }}
            {{- end }}
            {{- if $certificates }}
            {{- $routeEntry := dict }}
            {{- with .observed.resources }}{{ with index . "database-route" }}{{ $routeEntry = . }}{{ end }}{{ end }}
            {{- $route := dig "resource" (dict) $routeEntry }}
            {{- $accepted := dict }}
            {{- $resolved := dict }}
            {{- range dig "status" "parents" (list) $route }}
            {{- if and (eq (dig "parentRef" "name" "" .) $routes.gatewayName) (eq (dig "parentRef" "namespace" "" .) $routes.gatewayNamespace) }}
            {{- range dig "conditions" (list) . }}
            {{- if eq (dig "type" "" .) "Accepted" }}{{ $accepted = . }}{{ end }}
            {{- if eq (dig "type" "" .) "ResolvedRefs" }}{{ $resolved = . }}{{ end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $routeReady := and (eq (dig "status" "" $accepted) "True") (eq (dig "status" "" $resolved) "True") }}
            ---
            # The database's name on the shared Gateway: a TLS passthrough route in the
            # database's own namespace, so the Gateway picks the backend by the name the
            # client sends and the database keeps its own certificate. The backend is the
            # read-write Service beside it; a backend names no namespace, so the route never
            # reaches another namespace and needs no ReferenceGrant (ADR 0139).
            apiVersion: gateway.networking.k8s.io/v1
            kind: TLSRoute
            metadata:
              name: {{ $name }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: database-route
                gotemplating.fn.crossplane.io/ready: {{ if $routeReady }}"True"{{ else }}"False"{{ end }}
            spec:
              parentRefs:
                - group: gateway.networking.k8s.io
                  kind: Gateway
                  name: {{ $routes.gatewayName }}
                  namespace: {{ $routes.gatewayNamespace }}
                  sectionName: {{ $routes.sectionName }}
              hostnames:
                - {{ $host }}
              rules:
                - backendRefs:
                    - name: {{ $name }}-rw
                      port: 5432
            {{- end }}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ .observed.composite.resource.spec.connectionSecretName }}
              namespace: {{ .observed.composite.resource.metadata.namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                app.kubernetes.io/part-of: {{ .observed.composite.resource.metadata.namespace }}
            type: Opaque
            stringData:
              host: {{ .observed.composite.resource.metadata.name }}-rw
              port: "5432"
              database: app
              username: app
              passwordSecretRef: {{ .observed.composite.resource.metadata.name }}-app
              sslmode: require
              externalHost: {{ $host }}
              externalPort: "5432"
              externalSslmode: verify-full
            
    - step: project-status
      functionRef: { name: function-go-templating }
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $routes := dict "domain" "kore.internal" "organizationId" "platform" "issuer" "kore-local-ca" "gatewayName" "kore-gateway" "gatewayNamespace" "kore-system" "sectionName" "postgres" }}
            {{- $phase := "" }}
            {{- $reason := "" }}
            {{- $version := .observed.composite.resource.spec.compatibilityVersion | int }}
            {{- with .observed.resources }}{{ with .database }}{{ with .resource.status }}
            {{- $phase = .phase | default "" }}
            {{- $reason = .phaseReason | default "" }}
            {{- end }}{{ end }}{{ end }}
            {{- $routeEntry := dict }}
            {{- with .observed.resources }}{{ with index . "database-route" }}{{ $routeEntry = . }}{{ end }}{{ end }}
            {{- $route := dig "resource" (dict) $routeEntry }}
            {{- $accepted := dict }}
            {{- $resolved := dict }}
            {{- range dig "status" "parents" (list) $route }}
            {{- if and (eq (dig "parentRef" "name" "" .) $routes.gatewayName) (eq (dig "parentRef" "namespace" "" .) $routes.gatewayNamespace) }}
            {{- range dig "conditions" (list) . }}
            {{- if eq (dig "type" "" .) "Accepted" }}{{ $accepted = . }}{{ end }}
            {{- if eq (dig "type" "" .) "ResolvedRefs" }}{{ $resolved = . }}{{ end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $routeReady := and (eq (dig "status" "" $accepted) "True") (eq (dig "status" "" $resolved) "True") }}
            {{- $refused := $accepted }}
            {{- if eq (dig "status" "" $accepted) "True" }}{{ $refused = $resolved }}{{ end }}
            {{- $routeReason := default "Provisioning" (dig "reason" "" $refused) }}
            {{- $routeMessage := default "the Gateway has not reported on the database route yet" (dig "message" "" $refused) }}
            {{- if $routeReady }}{{ $routeReason = "Routed" }}{{ $routeMessage = "the Gateway accepted the database route" }}{{ end }}
            apiVersion: platform.kore.dev/v1alpha1
            kind: PostgreSQLInstance
            status:
              phase: {{ $phase | quote }}
              failureReason: {{ $reason | quote }}
              host: {{ .observed.composite.resource.metadata.name }}-rw
              port: 5432
              endpoint: {{ .observed.composite.resource.metadata.name }}-rw:5432
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: DatabaseHealthy
                status: {{ if eq $phase "Cluster in healthy state" }}"True"{{ else }}"False"{{ end }}
                reason: {{ if eq $phase "Cluster in healthy state" }}Healthy{{ else if $reason }}Failed{{ else }}Provisioning{{ end }}
                message: {{ $reason | default $phase | quote }}
                target: CompositeAndClaim
            {{- if ne $version 16 }}
              - type: DatabaseRouteReady
                status: {{ if $routeReady }}"True"{{ else }}"False"{{ end }}
                reason: {{ $routeReason | quote }}
                message: {{ $routeMessage | quote }}
                target: CompositeAndClaim
            {{- end }}
            {{- if eq $version 16 }}
              - type: ReachableByName
                status: "False"
                reason: UnsupportedVersion
                message: "Postgres 16 is not reachable by name: use the port forward"
                target: CompositeAndClaim
            {{- end }}
            
    - step: mark-ready
      functionRef: { name: function-auto-ready }
